# The rules catalog — docs/plans/2026-09-14-rules-catalog-design.md §4.
# One entry per rule id in rules.db. The build fails on a missing or unknown id,
# an unknown status, a byHand pointer that does not resolve, a byHand without
# note, a todo without why, a noRollEffect without note, a name or group that
# does not match rules.db, a duplicate id, or counts that differ from
# rules-catalog.snapshot.json.
#
# status: implemented | byHand | noRollEffect | todo
#
# Entries with a status other than todo live in the block at the top of the file.

# ---------------------------------------------------------------------------
# Core rules without an Optolith id (design §4). GRW_ ids are exempt from the
# rules.db checks; the evaluator applies them to every hero. Fokusregeln that
# have no Optolith id use the same prefix and the group Fokusregel.
# ---------------------------------------------------------------------------
- id: GRW_mehrfacheVerteidigung
  name: "Mehrfache Verteidigung"
  group: "Grundregel"
  status: implemented
  reviewed: null
  sources:
    - { kind: book, title: "Regelwerk", page: 232 }
  note: "−3 per defence already made this round, parries and dodges counted apart (CombatSituation.parriesThisRound / dodgesThisRound). Vinsalt-Stil (SA_923) sets the step to −2. The buttons' preview (CombatSituation.pendingMultipleDefensePenalty) still says −3; step 3 reads it off the evaluation."
  clauses:
    - kind: passive
      domains: [meleeParry, meleeDodge]
      when: [{ situation.defencesThisRound: { min: 1 } }]
      effects: [{ add: { target: vw, value: -3, per: defencesThisRound } }]

- id: GRW_reichweite
  name: "Reichweite"
  group: "Grundregel"
  status: implemented
  reviewed: null
  sources:
    - { kind: book, title: "Regelwerk", page: 238 }
  note: "The shorter weapon is penalised: Kurz gegen Mittel −2 AT, Kurz gegen Lang −4 AT, Mittel gegen Lang −2 AT; the longer side gets nothing (WeaponReach.atPenaltyAgainst is the same table for the announcement chips). The hero's side is the piece in the hand (Situation.loadoutReach, bare hands kurz); the opponent's reach is asked once per fight (OpponentProfile.reach)."
  clauses:
    - kind: passive
      domains: [meleeAttack]
      when: [{ loadout.reach: Kurz }, { opponent.reach: Mittel }]
      effects: [{ add: { target: at, value: -2 } }]
    - kind: passive
      domains: [meleeAttack]
      when: [{ loadout.reach: Kurz }, { opponent.reach: Lang }]
      effects: [{ add: { target: at, value: -4 } }]
    - kind: passive
      domains: [meleeAttack]
      when: [{ loadout.reach: Mittel }, { opponent.reach: Lang }]
      effects: [{ add: { target: at, value: -2 } }]

- id: GRW_beengteUmgebung
  name: "Beengte Umgebung"
  group: "Grundregel"
  status: implemented
  reviewed: null
  sources:
    - { kind: book, title: "Regelwerk", page: 238 }
  note: "Kurz 0, Mittel −4 AT/PA, Lang −8 AT/PA, by the reach of the piece in the hand (on a parry the main weapon, until step 3 names the parrying piece to CombatSituation.defenseModifiers). The eingeengt status (STATE_6) is the toggle; CombatSituation.beengteUmgebung carries it into the roll."
  clauses:
    - kind: passive
      domains: [meleeAttack, meleeParry]
      when: [situation.beengt, { loadout.reach: Mittel }]
      effects: [{ add: { target: at, value: -4 } }, { add: { target: pa, value: -4 } }]
    - kind: passive
      domains: [meleeAttack, meleeParry]
      when: [situation.beengt, { loadout.reach: Lang }]
      effects: [{ add: { target: at, value: -8 } }, { add: { target: pa, value: -8 } }]

- id: DISADV_57
  name: "Verweichlicht"
  group: "Nachteil"
  status: implemented
  reviewed: null
  sources:
    - { kind: optolith, src: US25003, page: 133 }
  note: "The Selbstbeherrschung check (TAL_8) a Wundeffekt demands is 2 harder (Optolith: 'Bei der Probe auf Selbstbeherrschung … bei Wundeffekten … eine Erschwernis von 2'). Only that probe — CombatTakeDamageView opens TalentProbeModal with isWoundEffectProbe (CombatWoundEffectPanel only previews it and asks to roll) — not every Selbstbeherrschung check."
  clauses:
    - kind: passive
      domains: [talentCheck]
      when: [situation.woundEffect]
      effects: [{ add: { target: { talent: TAL_8 }, value: -2 } }]

- id: GRW_zustandsbegrenzung
  name: "Zustände: höchstens −5"
  group: "Grundregel"
  status: byHand
  pointer: { file: Hesindion/Engine/ModifierEngine.swift, symbol: applyingZustandCap }
  note: "The combined Zustand penalty floors at −5. ModifierEngine.applyingZustandCap adds the correction line once, over Swift and catalog lines together (COND_ lines are tagged isZustand). The vocabulary has no cap effect, so this stays code; the evaluator's order puts it after every add and modification."

- id: GRW_passierschlag
  name: "Passierschlag"
  group: "Grundregel"
  status: byHand
  pointer: { file: Hesindion/Views/CombatDefenseViews.swift, symbol: CombatPassierschlagView }
  note: "A flow, not a modifier: CombatStep.passierschlag follows a critical parry (AGENTS.md, defence flow), or the Kritische Erfolge table replaces it (ADR-0011). CombatPassierschlagView is the screen; CombatStep.passierschlag routes to it after a critical parry."

- id: GRW_zonenaufschlag
  name: "Zonenaufschlag"
  group: "Fokusregel"
  status: implemented
  reviewed: null
  sources:
    - { kind: optolith, id: FR_11, title: "Trefferzonen-Regeln", src: US25003, page: 128 }
  note: "Trefferzonen Fokusregel: an announced zone costs Kopf −10, Torso −4, Gliedmaßen −8 on AT or FK. Gezielter Angriff (SA_160) and Gezielter Schuss (SA_161) halve it, an überraschter opponent (STATE_13) eases it by 2 — halved first, then eased, so Kopf comes to −3. The extra limb zones of non-humanoid plans take the limb value by analogy, as HitZoneModifiers.penalty does for the picker's chips."
  clauses:
    - kind: passive
      domains: [meleeAttack, rangedAttack]
      when: [{ hero.fokusRule: trefferzonen }, { situation.targetZone: [kopf] }]
      effects: [{ add: { target: at, value: -10 } }, { add: { target: fk, value: -10 } }]
    - kind: passive
      domains: [meleeAttack, rangedAttack]
      when: [{ hero.fokusRule: trefferzonen }, { situation.targetZone: [torso, koerper] }]
      effects: [{ add: { target: at, value: -4 } }, { add: { target: fk, value: -4 } }]
    - kind: passive
      domains: [meleeAttack, rangedAttack]
      when: [{ hero.fokusRule: trefferzonen }, { situation.targetZone: [arme, beine, vordereBeine, mittlereGliedmassen, hintereBeine, schwanz, fangarme] }]
      effects: [{ add: { target: at, value: -8 } }, { add: { target: fk, value: -8 } }]

- id: GRW_vorteilhaftePosition
  name: "Vorteilhafte Position"
  group: "Grundregel"
  status: implemented
  reviewed: null
  sources:
    - { kind: book, title: "Regelwerk", page: 238 }
    - { kind: book, title: "Regelwerk", page: 240 }
  note: "+2 AT and +2 PA when the hero is better placed. Two ways to be: the GM says so for this attack (the toggle on the announcement, gm.fact advantageousPosition), or the hero is mounted against a foot fighter (Regelwerk 240, Berittener Kampf — the opponent's onFoot is asked once per fight). Golgariten-Stil (SA_661) raises the AT half. The mounted branch comes first so a rider is asked about the opponent before the GM is asked about the position."
  clauses:
    - kind: passive
      domains: [meleeAttack, meleeParry]
      when:
        - any:
            - all: [situation.mounted, opponent.onFoot]
            - { gm.fact: { id: advantageousPosition, span: attack } }
      effects: [{ add: { target: at, value: 2 } }, { add: { target: pa, value: 2 } }]

- id: GRW_kampfImWasser
  name: "Kampf im Wasser"
  group: "Grundregel"
  status: implemented
  reviewed: null
  sources:
    - { kind: book, title: "Regelwerk", page: 239 }
    - { kind: wiki, url: "https://dsa.ulisses-regelwiki.de/GR_Kampf-Wasser.html", fetched: 2026-09-18 }
  text: |
    Wer sich im Wasser aufhält, kann sich in der Regel schlechter bewegen als an Land und
    erleidet Erschwernisse auf Attacke und Parade. Bei etwa hüfthohem Wasser beträgt diese
    Erschwernis jeweils -2. Unter Wasser steigen die Erschwernisse auf jeweils -6.
  note: "The depth is a round situation (CombatSituation.water), set on the combat root and persisted in Hero.activeCombatWater. AT and PA only, as the page says; Ausweichen is untouched. No ranged attack under water is Swift: the root disables the Fernkampf button (the vocabulary has no forbid effect)."
  clauses:
    # unterWasser first: SA_418/ADV_71 modify this rule from their own
    # `situation.water: [unterWasser]` clause, and RuleReachabilityTests'
    # `satisfy` picks the modified rule's *first* domain/target-matching
    # clause as the one to satisfy — putting unterWasser first keeps that
    # pick consistent with the modifying clause's own `when` (see the test's
    # `base` comment). Evaluation itself does not care about clause order.
    - kind: passive
      domains: [meleeAttack, meleeParry]
      when: [{ situation.water: [unterWasser] }]
      effects: [{ add: { target: at, value: -6 } }, { add: { target: pa, value: -6 } }]
    - kind: passive
      domains: [meleeAttack, meleeParry]
      when: [{ situation.water: [huefthoch] }]
      effects: [{ add: { target: at, value: -2 } }, { add: { target: pa, value: -2 } }]

- id: GRW_karmaleObjekte
  name: "Karmale Objekte"
  group: "Fokusregel"
  status: implemented
  reviewed: null
  sources:
    - { kind: wiki, url: "https://dsa.ulisses-regelwiki.de/Fokus_Karmale_Objekte.html", fetched: 2026-09-14 }
  text: |
    Angriffe mit geweihten Waffen bewirken bei Dämonen regulären Schaden. Angriffe mit
    geweihten Waffen der Gegengottheit erzeugen doppelte Trefferpunkte.
  note: "Fokusregel karmaleObjekte. Which weapon is geweiht is a hero-span answer under the rule's toggle (Hero.consecratedWeapons; no Optolith export says so). Whether the demon is of the opposing deity is the GM's call, once per fight (gm.fact opposingDeity, span opponent). Regular damage to any other demon is stated on screen by the demon toggle's subtitle, not computed."
  clauses:
    - kind: passive
      domains: [damage]
      when:
        - { hero.fokusRule: karmaleObjekte }
        - { loadout.weapon: { consecrated: true } }
        - { opponent.type: demon }
        - { gm.fact: { id: opposingDeity, span: opponent } }
      effects: [{ multiply: { target: tp, factor: 2 } }]

# ---------------------------------------------------------------------------
# Implemented through the evaluator (status implemented): the clauses say what
# the app does. reviewed is null until a person has read them against the text.
# ---------------------------------------------------------------------------
- id: SA_163
  name: "Kampf im Wasser"
  group: "Kampf"
  status: implemented
  reviewed: null
  sources: [{ kind: optolith }]
  note: "Eases GRW_kampfImWasser by 2 on AT and PA. Gated off under water when the hero also owns Unterwasserkampf (SA_418) or Wasserlebewesen (ADV_71): those already remove the underwater penalty entirely (modifyRule set: 0), and the evaluator applies every modifyRule's set before its add, so an unconditional +2 here would land on top of the 0 and read as a +2 bonus instead of nil. At hüfthoch neither SA_418 nor ADV_71 has anything to say, so the ease still applies there."
  clauses:
    - kind: passive
      domains: [meleeAttack, meleeParry]
      when:
        - not:
            all:
              - { situation.water: [unterWasser] }
              - any:
                  - { hero.hasRule: { id: SA_418 } }
                  - { hero.hasRule: { id: ADV_71 } }
      effects:
        - { modifyRule: { id: GRW_kampfImWasser, target: at, add: 2 } }
        - { modifyRule: { id: GRW_kampfImWasser, target: pa, add: 2 } }

- id: SA_418
  name: "Unterwasserkampf"
  group: "Kampf"
  status: implemented
  reviewed: null
  sources: [{ kind: optolith }]
  note: "Under water GRW_kampfImWasser does not apply (set to 0, dropped). Waist-deep water still costs 2."
  clauses:
    - kind: passive
      domains: [meleeAttack, meleeParry]
      when: [{ situation.water: [unterWasser] }]
      effects:
        - { modifyRule: { id: GRW_kampfImWasser, target: at, set: 0 } }
        - { modifyRule: { id: GRW_kampfImWasser, target: pa, set: 0 } }

- id: ADV_71
  name: "Wasserlebewesen"
  group: "Vorteil"
  status: implemented
  reviewed: null
  sources: [{ kind: optolith }]
  note: "Grants Unterwasserkampf (SA_418); same clauses."
  clauses:
    - kind: passive
      domains: [meleeAttack, meleeParry]
      when: [{ situation.water: [unterWasser] }]
      effects:
        - { modifyRule: { id: GRW_kampfImWasser, target: at, set: 0 } }
        - { modifyRule: { id: GRW_kampfImWasser, target: pa, set: 0 } }

- id: SA_923
