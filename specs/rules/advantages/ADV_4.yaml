# DRAFT FORMAT — see ../../README.md.
id: ADV_4
name: Begabung
kind: advantage
source:
  url: https://dsa.ulisses-regelwiki.de/vorteil.html?vorteil=Begabung
  book: Regelwerk
  page: 163
  checked: 2026-09-24
  hash: null
reviewed: null
# Probe example 22. Optolith: `max: 3`, selectOptionCategories SKILLS, SPELLS, LITURGICAL_CHANTS;
# the hero file names the Fertigkeit by `sid` (e.g. "TAL_10"), one instance per Fertigkeit.
# FORMAT: the rule is instanced per select option, and every effect is gated on "the check is on
# the chosen Fertigkeit" (`option.sid`). DISADV_37 (example 19) needs the same per-option
# instancing for its text; here the option gates the effect itself.
# The Fertigkeitsprobe this acts on is core/fertigkeitsproben.yaml.

clauses:
  - id: B1
    text: >
      Ein begabter Abenteurer kann bei jeder Probe auf eine bestimmte Fertigkeit einen W20 neu
      würfeln.
    effects:
      - when: { check.onOption: true }
        reroll: { die: { dice: any }, keep: better, max: 1, per: action }
        # Plan Appendix A.4. An effect on the dice stage (`check.dice`), not on a value: the
        # procedure offers it once the three dice are in and before the result is confirmed
        # (the old `after: rolled`, `before: result`), the player picks the die (B2: `dice: any`,
        # after seeing all three), and the result is then recomputed from the new dice. Once per
        # check (`max: 1, per: action`; the old `once_per: check`). `keep: better` is B2's.
        # `check.onOption` is the per-option gate (the old `check: { skill: option.sid }`): the
        # check is on the Fertigkeit this instance's `sid` names.

  - id: B2
    text: >
      Der Spieler kann zunächst die 3W20 würfeln und sich eines der drei Ergebnisse aussuchen,
      dass er neu würfeln kann. Es gilt das bessere Ergebnis beider Würfe.
    none: "carried by B1's reroll: the player's die (`dice: any`), the better result kept (`keep: better`)"
    # "Better" per die: on a Teilprobe a lower number is never worse (fertigkeitsproben.FP2),
    # so `better` = min(old, new). A rerolled 20 therefore never counts, and a reroll can
    # never create a Doppel-20 (situation 22.5). Both dice are logged (a line of kind
    # `rerolled`). The old `choose: { die: player, from: check.rolls }` + `keep: better`.

  - id: B3
    text: >
      Eine Begabung muss für jede Fertigkeit einzeln gewählt werden, also zum Beispiel auf ein
      bestimmtes Talent, einen Zauber oder eine Liturgie.
    none: >
      purchase; carried by the per-option gate on B1. "Fertigkeit" covers talents, spells and
      liturgies, so the offer belongs on every 3W20 check the app rolls (TalentProbeModal,
      SpellProbeModal, the liturgy checks), keyed by the option's id.

  - id: B4
    text: >
      Man kann nicht mehrfach in einer Fertigkeit begabt sein und somit zwei oder gar drei
      W20-Würfe in einer Probe wiederholen.
    none: purchase legality (Optolith's); B1's once-per-check limit is what the table sees

  - id: B5
    text: Fällt eine Doppel-20 oder Dreifach-20 kann man diesen Vorteil nicht nutzen.
    effects:
      - when: { check.twenties: { atLeast: 2 } }
        forbid: { what: { line: ADV_4.B1 } }
        because: "Doppel-20: Begabung nicht erlaubt"
        # Read on the first roll: a Patzer cannot be undone by this advantage (22.6). B1's reroll
        # is forbidden when two or three dice show 20 (the old `check.result: [patzer]`).

  - id: B6
    text: >
      Eine Begabung kann nur für eine Fertigkeit, nicht aber für eine Kampftechnik gewählt
      werden (dafür gibt es jedoch den Vorteil Waffenbegabung).
    none: purchase; Optolith offers no combat technique as an option, so no attack is ever gated in

  - id: B7
    text: >
      Ein Einsatz von Schicksalspunkten ist vor oder nach dem Einsatz einer Begabung erlaubt
      (siehe Seite 29). Dadurch ist es möglich, mehrfach neu zu würfeln oder eine andere Wirkung
      der Schicksalspunkte mit der Begabung zu kombinieren.
    none: allowed is the default (plan Appendix A.8); the check procedure offers every open reroll in either order until used
    # The old `allow: { together: [B1, schicksalspunkte.neuer-wurf], order: any }`. Two rerolls
    # on the same dice, in an order the player chooses — the second sees the dice the first
    # left (spec §6 step 2: "Begabung and a Schip in either order, the player's, until
    # confirmed"). schicksalspunkte's Neuer Wurf is not written yet (that file says so in its
    # header).

  - id: B8
    text: >
      Voraussetzung: Kein Nachteil Unfähig für diese Fertigkeit, nicht mehr als drei Begabungen
      pro Person
    none: purchase prerequisite

  - id: B9
    text: "AP-Wert: 6/12/18/24 Abenteuerpunkte (A-/B-/C-/D-Fertigkeit)"
    none: cost

  - id: B10
    text: "Anmerkung: siehe auch: Begabungen durch Liturgien"
    none: a pointer to other pages
