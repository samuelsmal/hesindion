# DRAFT FORMAT — see ../README.md.
# FORMAT: kind `equipment`. The table row is data every other rule reads (the Kampftechnik,
# TP, the Schadensschwelle, AT/PA-Mod, reach), kept under `provides`; the Anmerkung, Waffenvorteil
# and Waffennachteil are clauses. The first is core, the other two belong to the Fokusregel
# Waffeneigenschaften (core/waffeneigenschaften) — so a ruleset per clause, not per file.
id: ITEMTPL_19
name: Rabenschnabel
kind: equipment
source:
  url: https://dsa.ulisses-regelwiki.de/rabenschnabel.html
  book: Regelwerk
  page: 367
  checked: 2026-09-24
  hash: null
reviewed: null
# The page also lists Aventurische Rüstkammer p. 83 (Optolith's source for the Waffenvorteil and
# -nachteil, US25208), Aventurisches Götterwirken p. 233, Straßenstaub & Halsabschneider p. 28 and
# Archiv der Ausrüstung p. 125. Optolith (de-DE and univ Equipment.yaml) has the same numbers and
# text as the page. It has a second Rabenschnabel, ITEMTPL_796, without the geweiht note; the
# app treats both as this one (RulesDatabase, Hero.isConsecrated).

provides:
  technique: CT_5            # Hiebwaffen
  tp: 1W6+4
  kind: melee                # a Nahkampfwaffe: it has a Schadensschwelle (schaden.S3)
  leiteigenschaft: [KK]      # L+S KK 14: the weapon's Leiteigenschaft …
  schadensschwelle: 14       # … and its Schadensschwelle (was `ls: { attribute, threshold }`)
  atMod: 0
  paMod: -1
  reach: mittel
  weight: 1.5                # Stein
  length: 110                # HF
  price: 105                 # Silbertaler
  complexity: einfach
  consecrated: Boron

clauses:
  - id: RS0
    text: "Rabenschnabel | TP 1W6+4 | L+S KK 14 | AT/PA-Mod 0/-1 | RW mittel | 1,5 Stein | 110 HF | 105 S | einf"
    effects:
      - provide: { name: loadout.weapon, value: provides }
        # The row. AT/PA-Mod: the AT- und PA-Modifikatoren rule (added after the base values).
        # L+S: the Schadensbonus on the Kampftechniken page — +1 TP per point of the
        # Leiteigenschaft above the threshold (schaden.S3): Boronmir's KK 14 is the threshold
        # itself, so +0 (before 2026-09-24 his KK 15 gave +1). The app ignores the threshold: FumbleEffectResolver says "no export carries
        # the threshold (issue #14)", but the hero file has `primaryThreshold: { threshold: 14 }`
        # on the item, and OptolithImportService.parseItems does not read it.

  - id: RS1
    text: >
      Anmerkung: geweiht (Boron); borongeweihte Waffen sind nur für Borongeweihte erwerbbar
    none: >
      who may buy it; that it is geweiht matters only under the Fokusregel Karmale Objekte
      (FokusRule.karmaleObjekte, Hero.isConsecrated), which is not part of this example

  - id: RS2
    name: Dornenspitze
    text: >
      Waffenvorteil: Statt mit der Hammerseite anzugreifen, kann der Held auch die Dornenspitze
      verwenden. Die Dornenspitze verursacht ebenfalls 1W6+4 TP. Rüstungen mit RS 6 oder mehr
      erleiden dadurch einen Malus von -2 auf RS.
    effects:
      - when: { rulesets: fokus.waffeneigenschaften }
        offer: { choice: dornenspitze }
        # On the attack: the choice between the Hammerseite and the Dornenspitze.
        ruling: rabenschnabel-waffeneigenschaft
      - when: { rulesets: fokus.waffeneigenschaften, choice.dornenspitze: true, action.attack: hit, opponent.armour: worn, opponent.rs: { atLeast: 6 } }
        add: { to: opponent.rs, value: -2 }
        ruling: [rabenschnabel-waffeneigenschaft, dornenspitze-rs]
        # Opponent side: the app has no opponent RS (ADR-0005) and shows the line as a note,
        # "Gegner-RS −2 · Rabenschnabel (nur gegen RS 6 oder mehr)" (CombatAttackViews.rsText).
        # Worn armour only, not natural RS; with Trefferzonen-RS, the armour on the zone hit
        # (ruling dornenspitze-rs). The TP stay the weapon's.

  - id: RS3
    text: >
      Von einem Reittier aus geführt, bekommt der Träger des Rabenschnabels einen Bonus von +1
      TP.
    effects:
      - when: { rulesets: fokus.waffeneigenschaften, hero.mounted: true, action.attack: hit }
        add: { to: tp, value: 1 }
        ruling: rabenschnabel-waffeneigenschaft
        # Part of the Waffenvorteil paragraph; either end of the weapon. On the Sturmangriff zu
        # Pferd too (reiterkampf.RK14). Golgariten-Stil adds no TP of its own (SA_661; the
        # catalog note on SA_661 records that the code once did, from Optolith's stale text).

  - id: RS4
    text: >
      Waffennachteil: Nach einem bestätigten Patzer bei einer Attacke erhält der Träger
      zusätzlich 1 Stufe Betäubung.
    effects:
      - when: { rulesets: fokus.waffeneigenschaften, action.attack: confirmedFumble }
        gain: { rule: COND_2, levels: 1 }
        ruling: rabenschnabel-waffeneigenschaft
        # In addition to the Patzer table's result. The app does this in Swift, always
        # (WeaponFumbleExtras, keyed by the weapon's name).

rulings:
  - id: rabenschnabel-waffeneigenschaft
    status: decided
    question: >
      Do the Rabenschnabel's Dornenspitze, its +1 TP on horseback and its Betäubung on a Patzer
      apply only when the group plays the Fokusregel Waffeneigenschaften?
    answer: Only with the Fokusregel, like every weapon's Waffenvorteil and -nachteil.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [RS2, RS3, RS4, ITEMTPL_29.GR2, ITEMTPL_29.GR3, ITEMTPL_29.GR4, waffeneigenschaften]
    notes: >
      The Waffeneigenschaften page (Aventurische Rüstkammer p. 56) says weapons' Vor- und
      Nachteile "nur zum Tragen kommen, wenn du mit der Fokusregel spielst", and Optolith sources
      this weapon's to the Rüstkammer (p. 83). The app needs a Fokusregel toggle (Ausrüstung,
      Stufe I); the Dornenspitze, the +1 TP mounted and the Betäubung apply only while it is on,
      and so do the Großschild's lines. The app today has no such Fokusregel and applies all three
      always (catalog ITEMTPL_19, WeaponFumbleExtras). The answer covers every weapon, so the
      ruling could move to rulings.yaml; it stays here, where the other files cite it.

  - id: dornenspitze-rs
    status: decided
    question: >
      "Rüstungen mit RS 6 oder mehr erleiden einen Malus von -2 auf RS" — worn armour only, or
      any RS 6+, a creature's natural armour included?
    answer: Worn armour only; with Trefferzonen-RS, the armour on the zone hit.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [RS2]
    notes: >
      The page names Rüstungen; a creature's natural RS (a Krokodil, a Drache) is untouched. Under
      the Fokusregel Trefferzonen-Rüstungsschutz, "RS 6 oder mehr" is the RS of the worn armour on
      the zone hit. The app shows the −2 as a note for the GM and never applies it (catalog
      ITEMTPL_19, `rsNote`); the note should read "Rüstung mit RS 6 oder mehr".
