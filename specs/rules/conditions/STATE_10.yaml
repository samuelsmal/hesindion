# DRAFT FORMAT — see ../README.md.
id: STATE_10
name: Liegend
kind: state                # a Status, not a Zustand: no Stufen, outside the −5 Zustand cap (the old `kind: status`)
source:
  url: https://dsa.ulisses-regelwiki.de/Sta_Liegend.html
  book: Regelwerk
  page: 36
  checked: 2026-09-23
  hash: null
reviewed: null

# Who can be liegend: the hero (stated, or answered "ja" when Handlungsunfähig starts — ruling
# handlungsunfaehig-liegend, asked by STATE_8.H3) and the opponent (stated per attack on the
# opponent profile). One rule whose effects land on whichever side carries the status: the
# hero's own lines when `hero.has: STATE_10`, the opponent's lines and texts when
# `opponent.has: STATE_10` (the old `applies_to_side: [hero, opponent]` and `side:`), as
# STATE_13.

clauses:
  - id: L1
    text: >
      Ob gerade geweckt oder zu Boden geworfen, die Person befindet sich in liegender Position.
      Dies führt besonders im Kampf zu einigen Modifikationen.
    none: introduces the status

  - id: L2
    text: So lange die Person liegt, kann sie sich nur sehr langsam fortbewegen (GS 1).
    effects:
      - when: { hero.has: STATE_10 }
        set: { to: gs, value: 1 }
        # A value *set*, not a modifier. Handlungsunfähig sets GS 0 (STATE_8.H2); when both
        # hold, the later set in rule-id order wins (plan Task 22): "STATE_10" sorts before
        # "STATE_8", so GS 0 wins (liegend 7.4, 7.5).
      - when: { opponent.has: STATE_10 }
        tell: { to: opponent, text: "GS 1" }

  - id: L3
    text: Ihre Verteidigung ist um 2 erschwert, ihre Angriffe um 4.
    effects:
      - require: { that: { opponent.has: STATE_10 }, enables: true }
        # Task 33: the opponent's Liegend acts on the hero's screens, though the hero does not
        # have it (as STATE_13.UE1): the opponent's lines and texts below (and L2's) reach the
        # hero's attack (liegend 7.3). The hero's own effects stay gated on `hero.has: STATE_10`.
      - when: { hero.has: STATE_10 }
        add: { to: [pa, aw], value: -2 }
      - when: { hero.has: STATE_10 }
        add: { to: [at, fk], value: -4 }
        ruling: liegend-attacks
      - when: { opponent.has: STATE_10 }
        add: { to: [opponent.pa, opponent.aw], value: -2 }
        # Printed as the opponent's own calculation on the announcement and the damage screen;
        # the hero's AT does not change. The rules give the attacker nothing else for it.
      - when: { opponent.has: STATE_10 }
        tell: { to: opponent, text: "AT −4" }
        # The opponent's attack roll is not ours (ADR-0005); the hero's defence does not change.

  - id: L4
    text: >
      Wer aufstehen möchte, braucht dazu 1 Aktion. Ist ein Gegner in Angriffsdistanz, kann er
      dabei einen Passierschlag ausführen. Um keinen Passierschlag abzubekommen, kann der Held
      eine Probe auf Körperbeherrschung (Kampfmanöver) ablegen. Bei Gelingen bekommt er keinen
      Passierschlag ab.
    effects:
      - when: { hero.has: STATE_10 }
        offer: { choice: aufstehen, costs: [{ cost: { pool: actions, amount: 1 } }] }
      - when: { hero.has: STATE_10, choice.aufstehen: true }
        gain: { rule: STATE_10, levels: -1 }
        # Standing up clears the status (the old `then: { remove_state: STATE_10 }`).
      - when: { hero.has: STATE_10, opponent.inReach: true }
        offer: { choice: passierschlagVermeiden, default: false }
        # "kann der Held eine Probe … ablegen": the check is the player's to take (the old
        # `optional_check`), offered beside the stand-up whenever an opponent is in reach
        # (`if_opponent_in_reach`); it runs when the hero stands up (below).
      - when: { hero.has: STATE_10, choice.aufstehen: true, opponent.inReach: true, choice.passierschlagVermeiden: true }
        check:
          of: { talent: TAL_4, with: Kampfmanöver }
          onFailure:
            - tell: { to: opponent, text: passierschlag }
        # Körperbeherrschung (TAL_4) (Kampfmanöver). "Bei Gelingen bekommt er keinen
        # Passierschlag ab"; on a failure the opponent may make one.
      - when: { hero.has: STATE_10, choice.aufstehen: true, opponent.inReach: true, choice.passierschlagVermeiden: false }
        tell: { to: opponent, text: passierschlag }
        # The check skipped (the old `on_check_failed_or_skipped`): the opponent may make a
        # Passierschlag.

rulings:
  - id: liegend-attacks
    status: decided
    question: >
      "Ihre Angriffe um 4" — which attacks? Melee AT only, or ranged (FK) as well?
    answer: >
      Every attack roll: melee AT and FK.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [L3]
    notes: >
      The page says "Angriffe", not "AT". A prone hero shoots at FK −4; spells are not attacks in
      this sense. The app applies −4 to melee attacks only (catalog STATE_10, domain meleeAttack),
      so a prone archer shoots at no penalty today.

  - id: handlungsunfaehig-liegend
    status: decided
    question: >
      Handlungsunfähig says the person "in den meisten Situationen … gilt … zudem als liegend".
      When does a Handlungsunfähig hero count as Liegend?
    answer: >
      When the hero becomes Handlungsunfähig, a modal also asks whether the hero is now Liegend.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [L1, L2, L3, L4]
    notes: >
      Option b in the owner's words. The question comes whenever Handlungsunfähig starts, from
      whatever cause: set by hand, implied by Bewusstlos, or reached by a Zustand at Stufe IV
      (Hero.isHandlungsunfaehigFromZustaende). "Nein" leaves room for the hero tied to a mast or
      held on a horse. Today the app makes Handlungsunfähig and Bewusstlos always imply Liegend
      (StateCatalog: implies ["liegend"]), and a Handlungsunfähig reached through Zustände
      implies nothing, because Hero.impliedStateIDs reads only states that are set. On top of
      Handlungsunfähig (no actions, no defences, GS 0) Liegend matters for what the sheet shows and
      for standing up once able to act again (L4).
