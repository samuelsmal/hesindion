id: SA_41
subgroup: passiv
note: Tier ladder (Stufe I-II), engine matches effect tier to owned Stufe exactly. Encodes the BE column of the armour-table row shift only; the GS/INI extra-penalty column is not modelled
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Belastungsgew%C3%B6hnung.html
  book: US25001
  page: 246
  checked: '2026-09-21'
  hash: sha256:271a9935c020ef5d042872ab9bac15d0d52afe153133fa680e8d2c6d4cd3f424
effects:
- type: modifier
  target: be
  scope: all
  value: -1
  tier: 1
  note: Stufe I - armour counts two rows higher in the armour table, which works out as BE -1 for every armour with BE of at least 1
- type: modifier
  target: be
  scope: all
  value: -2
  tier: 2
  note: Stufe II - two rows per Stufe, so four rows, which works out as BE -2. scope all is the open question ADR-0008 records for BE, not a settled answer
