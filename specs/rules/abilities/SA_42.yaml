# DRAFT FORMAT — see ../../README.md.
id: SA_42
name: Beidhändiger Kampf
kind: specialAbility
group: Kampfsonderfertigkeiten
levels: 2
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Beih%C3%A4ndigerKampf.html   # the wiki's own spelling
  book: Regelwerk (4. Auflage)
  page: 246–247
  checked: 2026-09-23
  hash: null
reviewed: null

clauses:
  - id: BH1
    text: >
      Der Abzug auf Attacke und Parade beträgt bei Stufe I der Sonderfertigkeit nur -1 statt wie
      üblich -2. Bei Stufe II der Sonderfertigkeit sinken die Erschwernisse zusätzlich zu dem
      Bonus aus Beidhändiger Kampf I um einen weiteren Punkt auf insgesamt 0.
    effects:
      - when: { round.doubleAttack: true, not: { action.defence: shieldParry } }
        add: { to: [at, pa, aw], value: level }
        ruling: [sa42-dodge, sf-technique-lists]
        # Lowers beidhaendiger-kampf.ZW3's −2 by 1 per Stufe: an add with ZW3's own targets and
        # `when`, so it applies exactly where ZW3 does. At Stufe II the two come to 0, the old
        # `max_total: 0`, which the Stufe (at most II) can never pass.
        # FORMAT: lowers another rule's penalty. The breakdown shows "Beidhändiger Kampf −2"
        # and "Beidhändiger Kampf I +1" as two lines, the second marked as lowering the first —
        # or one line "−1 (−2, gelindert durch SF I)"; a display choice for the design.

  - id: BH2
    text: "Kampftechniken: Dolche, Fächer, Fechtwaffen, Hiebwaffen, Raufen, Schilde, Schwerter"
    effects:
      - require: { that: { loadout.weapon.technique: [CT_3, CT_20, CT_4, CT_5, CT_9, CT_10, CT_12], loadout.other.technique: [CT_3, CT_20, CT_4, CT_5, CT_9, CT_10, CT_12] } }
        ruling: sf-technique-lists
        # The main hand is `loadout.weapon`, the off hand `loadout.other`.
        # Dolche, Fächer, Fechtwaffen, Hiebwaffen, Raufen, Schilde, Schwerter. BH1 lowers the
        # penalty only when both pieces of the double attack are on the list: a Morgenstern
        # (Kettenwaffen) with a shield pays the full −2. A fist as one hand is ruling
        # beidhaendiger-kampf.raufen-double-attack.

  - id: BH3
    text: "Voraussetzungen: Stufe I: GE 13; Stufe II: GE 15, Beidhändiger Kampf I"
    none: purchase prerequisites, not a roll

  - id: BH4
    text: "AP-Wert: Stufe I/II: 20/35 Abenteuerpunkte"
    none: purchase cost

  - id: BH5
    text: >
      Anmerkung: Neue Kampftechniken aus späteren Publikationen in die Liste der Kampftechniken
      hinzugefügt. Als Quellenangabe sind (meist) die Publikationen der entsprechenden
      Kampftechnik heranzuziehen.
    none: >
      how the wiki keeps BH2's list; evidence for sf-technique-lists' option (a) — a list kept up
      to date with new techniques is a use list, not a learning list

rulings:
  - id: sa42-dodge
    status: decided
    question: >
      The core penalty (beidhaendiger-kampf.ZW3) is on AT "und alle Verteidigungen" — AW too.
      SA_42 says it lowers "der Abzug auf Attacke und Parade". Does the SF also lower the AW part?
    answer: >
      Yes: 'Abzug' means ZW3's penalty as a whole, wherever it applies.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [BH1]
    notes: >
      A hero with SA_42 II attacks, parries and dodges at 0 in a round with a double attack. The
      app already lowers AT, PA and AW alike (Hero.dualAttackPenalty feeds
      MeleeModifiers.dualAttackPenalty and DefenseModifiers.dualAttackDefense).
