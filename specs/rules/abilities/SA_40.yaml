# DRAFT FORMAT — see ../README.md.
id: SA_40
name: Aufmerksamkeit
kind: specialAbility
group: Kampfsonderfertigkeiten
passive: true
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Aufmerksamkeit.html
  book: Regelwerk
  page: 246
  checked: 2026-09-24
  hash: null
reviewed: null

clauses:
  - id: A1
    text: >
      Bei einem Hinterhalt oder wenn es darum geht, ob er überrascht wird, erhält er eine
      Erleichterung von +2 auf Sinnesschärfe (Hinterhalt entdecken), um seine Gegner zu
      entdecken.
    effects:
      - when: { check.talent: TAL_10 }
        offer: { choice: hinterhaltUeberraschung, default: false }
        ruling: aufmerksamkeit-when
        # The toggle "Hinterhalt / Überraschung" on the Sinnesschärfe check, off by default: the
        # old fact `situation: ambush`, which the decided ruling makes the player's to state.
      - when: { check.talent: TAL_10, check.application: Hinterhalt entdecken, choice.hinterhaltUeberraschung: true }
        add: { to: check.modifier, value: 2 }
        ruling: aufmerksamkeit-when
        # Sinnesschärfe is TAL_10. Failing the check leaves the hero Überrascht (STATE_13).
        # FORMAT: an Anwendungsgebiet of a talent — the app does not model applications, and
        # "ambush" is a fact about the situation the check screen cannot know on its own.

  - id: A2
    text: "Voraussetzungen: IN 13"
    none: purchase prerequisite, not a roll

  - id: A3
    text: "Kampftechnik: alle"
    none: a passive ability; no weapon is involved in the check

  - id: A4
    text: "AP-Wert: 10 Abenteuerpunkte"
    none: purchase cost

rulings:
  - id: aufmerksamkeit-when
    status: decided
    question: >
      The +2 applies only to a Sinnesschärfe (Hinterhalt entdecken) check in an ambush or when
      surprise is at stake. How does the app know that a Sinnesschärfe check is one?
    answer: >
      A toggle 'Hinterhalt / Überraschung' on the Sinnesschärfe check, off by default; on, the +2
      is a line from SA_40.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [A1]
    notes: >
      The toggle is shown on TAL_10's check screen for heroes with SA_40 only, beside the
      "Belastung zählt" toggle (COND_1.belastung-talents-maybe), and names the page's wording,
      Hinterhalt entdecken. The app today never applies the +2 (catalog: byHand) and shows the hint
      "Aufmerksamkeit: +2 auf Überraschung vermeiden" on every Sinnesschärfe check
      (TalentProbeModal.hints, Talent.sinnesschaerfeRuleId).
