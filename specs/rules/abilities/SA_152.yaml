# DRAFT FORMAT — see ../README.md.
# Written first for SA_172.U4 (ruling SA_172.auf-distanz-halten), where an opponent has it. The
# hero's own use is encoded too: announced for the round (AD2), it forbids Basismanöver.
id: SA_152
name: Auf Distanz halten
kind: specialAbility
group: Kampfsonderfertigkeiten
levels: 2
passive: true                  # "(passiv)" on the page; kampfsonderfertigkeiten.KS2 lists it as "wirkt immer"
techniques: [alle Nahkampftechniken]
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_AufDistanzhalten.html
  book: Aventurisches Kompendium
  page: 151
  checked: 2026-09-24
  hash: null
reviewed: null

clauses:
  - id: AD1
    text: >
      Wer einen Gegner auf Distanz halten will, muss über eine Waffe verfügen, deren
      Reichweite größer ist als die Reichweite des Widersachers. Ist diese Voraussetzung erfüllt,
      erhöhen sich die AT-Erschwernisse für den Gegner zusätzlich um -1 pro Stufe der SF.
    effects:
      - require: { that: { opponent.has: SA_152 }, enables: true }
        ruling: SA_172.auf-distanz-halten
        # The opponent's SF acts on the hero, who does not own it (Task 31): the GM's answer
        # "Gegner hat Auf Distanz halten" enables the rule, so the line below applies (reichweite
        # RW.12). The hero's own use is AD2's offer, gated on `hero.has`.
      - when: { opponent.has: SA_152, reach.gap: { atLeast: 1 } }
        add: { to: at, value: -1, per: opponent.level.SA_152 }
        ruling: SA_172.auf-distanz-halten
        # The opponent's Stufe is a GM question, asked like the opponent's reach
        # (OpponentProfile). FORMAT: `per: opponent.level.SA_152` (the old `opponent.tier`) — a
        # Stufe the hero does not own. `reach.gap` ≥ 1: the opponent's weapon is the longer
        # (reichweite); the old `check: at` is the target.
      - when: { choice.aufDistanzHalten: true, reach.gap: { atMost: -1 } }
        tell: { to: opponent, text: "AT −<tier> (Auf Distanz halten <I/II>)" }
        # Opponents are not modelled (ADR-0005); the hero's use is a reminder. Only in a round
        # where AD2's announcement was made: owning the SF and the longer weapon is not enough.
        # `<tier>` is the Stufe owned; the page offers no lower one.

  - id: AD2
    text: >
      Dafür kann der Held in dieser KR keine Basismanöver einsetzen. Auf Distanz halten muss am
      Anfang der Runde angesagt werden.
    effects:
      - when: { hero.has: SA_152, round.phase: start }
        offer: { choice: aufDistanzHalten, span: round }
        # "Anfang der Runde" — the same round-start announcement as SA_65.VH1 and SA_66
        # (`round.phase: start`, the old `at: round_start`; `span: round`, the old `lasts`). The
        # app has none yet; it would be a toggle on the combat round.
      - when: { choice.aufDistanzHalten: true }
        forbid: { what: { manoeuvre: { kind: basismanoever } } }
        because: Auf Distanz halten — in dieser KR keine Basismanöver
        # Only Basismanöver (Finte, Wuchtschlag, …). A plain attack, a Spezialmanöver and the
        # defences stay allowed: the page forbids nothing else. The picker hides them and says why.
      - when: { choice.aufDistanzHalten: true, reach.gap: { atLeast: 0 } }
        tell: { to: player, text: "Auf Distanz halten wirkt nur mit der längeren Waffe (AD1)" }

  - id: AD3
    text: >
      Anmerkung: Ein Kämpfer mit kurzer Waffe gegen einen Kämpfer mit langer Waffe und Auf Distanz
      halten II erleidet beispielswiese eine Erschwernis von -6 auf AT (-4 durch den
      Reichweitenunterschied und -2 durch die SF). Die Erschwernisse dieser
      Kampfsonderfertigkeit bleiben auch gegenüber Gegnern mit der SF Unterlaufen bestehen. Die
      SF ist kein Basismanöver, da man es ansonsten nicht ausführen könnte, wenn man nicht an der
      Reihe ist.
    none: >
      the page's own example of AD1, and the same statement as SA_172.U4: AD1's line is its own,
      so Unterlaufen, which lowers only reichweite.RW3's line, never reaches it (reichweite RW.12).

  - id: AD4
    text: "Voraussetzungen: Stufe I: GE 13; Stufe II: GE 15, Auf Distanz halten I"
    none: purchase prerequisites, not a roll

  - id: AD5
    text: "Kampftechniken: alle Nahkampftechniken"
    effects:
      - require: { that: { loadout.weapon: melee } }
        # „alle“: kampfsonderfertigkeiten.KS6 says such an SF is used independently of a
        # Kampftechnik, so sf-technique-lists does not reach it. Any melee weapon — and AD1
        # already needs one with a reach.

  - id: AD6
    text: "AP-Wert: Stufe I/II: 15/20 Abenteuerpunkte"
    none: purchase cost, not a roll
