# DRAFT FORMAT — see ../README.md.
id: SA_172
name: Unterlaufen
kind: specialAbility
group: Kampfsonderfertigkeiten
levels: 2
manoeuvre: { kind: basismanoever }      # so reiterkampf.RK3 leaves it available on horseback
techniques: [Dolche, Fechtwaffen, Hiebwaffen, Kettenwaffen, Raufen, Schilde, Schwerter, Zweihandhiebwaffen, Zweihandschwerter]
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Unterlaufen.html
  book: Aventurisches Kompendium
  page: 155
  checked: 2026-09-23
  hash: null
reviewed: null

clauses:
  - id: U1
    text: >
      Für jede Stufe dieser SF kann die Heldin eine Stufe Nachteile durch Nahkampfreichweiten
      gegen Gegner mit längeren Waffen ignorieren. Mit Stufe I lässt sich beispielsweise der
      Unterschied zwischen kurzer Waffe und mittlerer Waffe überwinden, mit Stufe II sogar der
      Unterschied zwischen kurz und lang. Kann die Abenteurerin durch Unterlaufen den
      Reichweitenvorteil nicht komplett ignorieren, sind die Nachteile zumindest um 1 Stufe
      verringert.
    effects:
      - when: { choice.unterlaufen: true, level: 1 }
        replace: { line: { line: reichweite.RW3 }, with: { of: reach.gap, above: 1, times: -2 } }
      - when: { choice.unterlaufen: true, level: 2 }
        replace: { line: { line: reichweite.RW3 }, with: { of: reach.gap, above: 2, times: -2 } }
        # Lowers RW3's line by reach *steps*, one per Stufe, not by a number (the old `lower: {
        # by_steps: 1, per: tier, min: 0 }`): RW3's −2 per step counts only the steps above the
        # Stufe, never below 0 — Stufe I: kurz/lang −4 → −2, kurz/mittel −2 → 0; Stufe II: 0.
        # The breakdown shows "Reichweite −4 → −2 (Unterlaufen I)" (a replaced line with
        # `via: [SA_172.U1]`), so the player sees what was ignored.

  - id: U2
    text: >
      Die Heldin muss das Unterlaufen vor ihrer AT ankündigen. Diese AT ist um die
      Nahkampfreichweite modifiziert, die nicht durch das Manöver ausgeglichen werden kann.
      Misslingt die AT, steht dem Gegner ein Passierschlag zu. Der Vorteil des Manövers gilt nur
      für einen Angriff.
    effects:
      - offer: { choice: unterlaufen, span: action }
        ruling: sf-technique-lists
        # Announced before the AT (the old `announce: before-at`), for that one attack (the old
        # `span: attack`: the one action). The technique gate is U6's.
      - require: { that: { reach.gap: { atLeast: 1 } }, for: { choice: unterlaufen } }
        because: nur gegen einen Gegner mit der längeren Waffe
        # The old offer's `requires: { opponent.reach: { longer_than: loadout.reach } }`.
        # FORMAT: offering it only against a longer weapon is a UI choice: against an equal
        # or shorter one it gains nothing and still risks a Passierschlag.
      - when: { choice.unterlaufen: true, action.attack: [miss, confirmedFumble] }
        tell: { to: opponent, text: passierschlag }

  - id: U3
    text: Unterlaufen kann mit keinem Spezialmanöver kombiniert werden.
    effects:
      - when: { not: { hero.has: SA_173 } }
        forbid: { what: { manoeuvre: { kind: spezialmanoever } }, together: true }

  - id: U4
    text: >
      Anmerkung: Einen Bonus des Widersachers durch die SF Auf Distanz halten muss der Held
      dennoch bei seiner AT als Erschwernis einrechnen.
    none: >
      the penalty is SA_152.AD1's own line, asked as an opponent fact on the announcement (ruling
      auf-distanz-halten, cited on SA_152.AD1's effect); U1 replaces only reichweite.RW3's line,
      so it never reaches that one.

  - id: U5
    text: "Voraussetzungen: Stufe I: GE 13; Stufe II: GE 15, Unterlaufen I"
    none: purchase prerequisites, not a roll

  - id: U6
    text: >
      Kampftechniken: Dolche, Fechtwaffen, Hiebwaffen, Kettenwaffen, Raufen, Schilde, Schwerter,
      Zweihandhiebwaffen, Zweihandschwerter
    effects:
      - require: { that: { loadout.weapon.technique: [CT_3, CT_4, CT_5, CT_6, CT_9, CT_10, CT_12, CT_15, CT_16] } }
        ruling: sf-technique-lists
        # Not Stangenwaffen (CT_13): a lang weapon has no reach gap to close.

  - id: U7
    text: "AP-Wert: Stufe I/II: 10/15 Abenteuerpunkte pro Stufe"
    none: purchase cost, not a roll

rulings:
  - id: auf-distanz-halten
    status: decided
    question: >
      U4: an opponent with the SF Auf Distanz halten (SA_152) keeps its bonus against an
      Unterlaufen. The app does not know the opponent's special abilities. How does that bonus
      reach the hero's AT?
    answer: >
      A GM question on the announcement, 'Gegner hat Auf Distanz halten', which adds the SF's
      penalty as its own line.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [U4, SA_152.AD1]
    notes: >
      The SF's page (KSF_AufDistanzhalten, AK 151) was found on processing: −1 AT per Stufe for
      the opponent of a fighter with the longer weapon, kept against Unterlaufen. So the question
      asks the Stufe (I or II), and SA_152 has its own rule file. The app does not know SA_152
      yet (catalog `todo`).
