# DRAFT FORMAT — see ../README.md.
id: SA_661
name: Golgariten-Stil
kind: specialAbility
group: Kampfstilsonderfertigkeiten (bewaffnet)
passive: true
source:
  url: https://dsa.ulisses-regelwiki.de/SF_Kampfstilsonderfertigkeiten/bewaffnete-kampfstile/golgariten-stil.html
  book: Aventurisches Götterwirken I
  page: 229
  checked: 2026-09-23
  hash: null
reviewed: null
# Optolith's text for this ability says TP where the page says PA: "einen Bonus von +1 TP bei
# Nahkampfangriffen, wenn er sich auf dem Rücken eines Reittiers befindet". The page (and its
# other print, Kodex des Schwertes p. 318) wins.

clauses:
  - id: GS1
    text: >
      Kämpft der Held beritten gegen Fußkämpfer, erhöht sich die aus der vorteilhaften Position
      resultierende Erleichterung auf AT um +2.
    effects:
      - when: { hero.mounted: true, opponent.onFoot: true, any: [{ loadout.weapon: Rabenschnabel }, { loadout.weapon: Großschild }] }   # GS3
        add: { to: at, value: 2 }
        ruling: [kampfstil-techniques, passierschlag.passierschlag-sf]
        # Raises vorteilhafte-position.VP1's AT line (the old `raise: { line: VP1.at, by: 2 }`)
        # as a line of its own under VP1's mounted condition: the breakdown shows "Vorteilhafte
        # Position +2" and "Golgariten-Stil +2" as two lines (reiterkampf 5.6).
        # passierschlag-sf: a Kampfstil still applies on a Passierschlag (kampfsituationen 17.3).

  - id: GS2
    text: >
      Außerdem bekommt der Abenteurer noch einen Bonus von +1 PA, wenn er sich auf dem Rücken
      eines Reittiers befindet.
    effects:
      - when: { hero.mounted: true, any: [{ loadout.weapon: Rabenschnabel }, { loadout.weapon: Großschild }] }   # GS3
        add: { to: pa, value: 1 }
        ruling: kampfstil-techniques

  - id: GS3
    text: >
      Kampftechniken: Hiebwaffen (nur Rabenschnabel), Schilde (nur Großschild und nur von einem
      Reittier aus)
    none: >
      the condition GS1 and GS2 carry in their `when` (ruling kampfstil-techniques): the piece
      the roll is made with is a Rabenschnabel (ITEMTPL_19), or a Großschild (ITEMTPL_29) from a
      mount — both clauses are mounted only, so "nur von einem Reittier aus" always holds there.
      The old `define: { loadout.style: SA_661, … }` named that condition once; the vocabulary
      has no named condition, so it is written out in each.

  - id: GS4
    text: "Erweiterte Kampfsonderfertigkeiten: Frontalangriff, Mächtiger Rundumschlag, Schildstoß"
    none: unlocks purchases, not a roll

  - id: GS5
    text: "Voraussetzungen: MU 13"
    none: purchase prerequisite, not a roll

  - id: GS6
    text: "AP-Wert: 10 Abenteuerpunkte"
    none: cost
