# The Probe table (Task 34): the caller's data about a talent or spell check, which no rule
# encodes (TAL_7's `probe`, `anwendungsgebiet` and `belastung` clauses). rulec checks it
# (scripts/rulec/checks.py) and writes it into build/rules/situations.json as `checks`; the
# situations harness hands it to the engine as the app hands in its own data. One row per id:
#   attributes           the Probe's three attributes in order (fertigkeitsproben.FP1)
#   hinderedByBelastung  talents: true, false or maybe, the fact `check.hinderedByBelastung`
#                        (COND_1.belastung-reach)
#   applications         talents: the Anwendungsgebiete by Optolith id (negative ids need an SF),
#                        the list `check.application` is picked from (fertigkeitsproben.FP8); an
#                        owned numeric `sid2` (SA_9) is resolved into the name here
# Extracted once, on 2026-09-26, from what the harness read before: rules.db (`make rules-db`)
# `skill_details` (`check_attr_1–3`, `encumbrance`) and every `spell_details` row with three
# attributes (the spells and liturgies; blessings and cantrips have no Probe), and the applications
# from Optolith's de-DE/Skills.yaml. A new talent or spell a situation checks needs its row here.

