# DRAFT FORMAT — see ../README.md.
# The Fokusregel that switches every weapon's Waffenvorteil and Waffennachteil on. Written
# because the weapon files (equipment/) gate those clauses on it.
id: waffeneigenschaften
name: Waffeneigenschaften
kind: core
ruleset: fokus.waffeneigenschaften
source:
  url: https://dsa.ulisses-regelwiki.de/Waffeneigenschaften.html
  book: Aventurische Rüstkammer
  page: 56
  checked: 2026-09-24
  hash: null
reviewed: null
# FORMAT: the gated clauses live in other files (every weapon's Waffenvorteil/-nachteil). Each
# names the ruleset in its own `when`; this file only defines it. The alternative, a file-level
# `ruleset:`, does not work for a weapon, whose table row is core and whose Waffenvorteil is not.

clauses:
  - id: WE1
    text: >
      Waffeneigenschaften sind eine Fokusregel der Stufe I für den Themenkomplex Ausrüstung.
    effects:
      - provide: { name: fokus.waffeneigenschaften, value: { theme: Ausrüstung, level: 1 }, readBy: display }
        # The Fokusregel's Themenkomplex and Stufe (formerly the file's `fokus:` key); the
        # ruleset itself is the file's `ruleset:`, switched on through the `rulesets` fact.
        # The app has no such Fokusregel (FokusRule: trefferzonen, kritische Erfolge,
        # karmaleObjekte) and applies the Waffenvorteile it knows always (catalog ITEMTPL_19,
        # WeaponFumbleExtras).

  - id: WE2
    text: >
      Die hier vorgestellten Waffen verfügen nicht nur über die bereits bekannten Werte aus dem
      Regelwerk, sondern auch über Waffeneigenschaften. Dabei handelt es sich um spezielle Vor-
      und Nachteile für Waffen, die nur zum Tragen kommen, wenn du mit der Fokusregel spielst.
    none: >
      the gate is a `when: { rulesets: fokus.waffeneigenschaften }` on each Waffenvorteil and
      Waffennachteil effect in equipment/, each resting on the ruling
      ITEMTPL_19.rabenschnabel-waffeneigenschaft
    # The weapon's table row and its Anmerkung (e.g. the Großschild's "zusätzlich -1 AT auf
        # die Hauptwaffe") are Regelwerk values and stay on without the Fokusregel.

  - id: WE3
    text: >
      Diese Vor- und Nachteile wiegen sich auf, sodass die Waffe nicht besser oder schlechter
      wird. Aber durch die Waffeneigenschaften kommen die individuelleren Merkmale einer Waffe
      besser zur Geltung und dadurch wird das Spiel deutlich komplexer.
    none: design intent

# Related, not a clause of this page: the Kampfregeln page's note that a Zweihandhiebwaffe or
# Zweihandschwert used one-handed loses its Waffenvorteile under this Fokusregel
# (https://dsa.ulisses-regelwiki.de/GR_Kampf-2HHiebwaffen-Schwerter-1H.html).
