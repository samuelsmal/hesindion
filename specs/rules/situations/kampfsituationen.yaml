# Example 17 — Passierschlag, Angriff von hinten, Beengte Umgebung, Größenkategorie.
# Same conventions as belastung.yaml. DRAFT FORMAT — see ../README.md.
#
# The hero is Boronmir as of the 2026-09-24 export
# (specs/heroes/Boronmir Siebenfeld von Greifenfurt.json):
#   MU 14, GE 14, KK 14. Hiebwaffen 14, Schwerter 12, Schilde 10, Raufen 10.
#   AT = KtW + (MU−8)/3 (AT mod 0 for both weapons):
#     Rabenschnabel (Hiebwaffen 14)     14 + 2 = 16
#     Langschwert (Schwerter 12)        12 + 2 = 14
#   PA = ⌈KtW/2⌉ + (Leiteigenschaft−8)/3 + PA mod:
#     Rabenschnabel (Hiebwaffen, KK)    7 + 2 − 1 = 8
#     Langschwert (Schwerter, GE/KK)    6 + 2 + 0 = 8
#   Großschild (Schilde 10, AT −6, PA +3):
#     shield AT     10 + 2 − 6 = 6
#     shield parry  ⌈10/2⌉ + 2 + 2×3 = 13   (the shield's PA mod counts double on its own parry)
#     carried, it adds its PA mod +3 to a weapon parry: Rabenschnabel 11, Langschwert 11
#   AW = GE/2 = 7.
#   These are what the app computes too (OptolithImportService.parseItems,
#   Hero.passiveShieldPABonus). Kupperus (Svellttaler Kaltblut, under `pets`): GS 12, groß.
#
# No armour unless stated. In his Plattenrüstung, Belastung I (Belastungsgewöhnung II) adds −1
# AT/PA/AW on foot, nothing mounted (belastung.md, reiterkampf.RK7); those lines are left out below
# because none of these rules touches them. Also left out: the Großschild's "−1 AT auf die
# Hauptwaffe" (ITEMTPL_29.GR1, example 18), which none of these rules touches either.
# `total` is the change; the value after it is in the comment.
#
# The per-item values above are the base values `at(with: …)` / `pa(with: …)`; Kupperus (the old
# file-level `mount`) is `mount.gs`, his size groß a comment (no rule here reads it: the rider is
# his own size, ruling groessenkategorie.mounted-size). Each situation states its loadout
# (`weapon`, `shield`, `other: shield`, the weapon's `reach`, the shield's size), mounted as
# `hero.mounted`. A Passierschlag is `choice.passierschlag` (the old `attack: passierschlag`).
# The GM's facts: `gmFact.fromBehind` (the old `opponent: { fromBehind }`), the incoming attack's
# kind `gmFact.incomingAttack` (melee, ranged or passierschlag; the old `attack: { kind }` and
# `event`), and `gmFact.beengt` for a beengte Umgebung (the old `states: [STATE_6]`, the app's
# switch). The piece a roll is made with is `action.with` (weapon or shield). What the player
# or opponent is told is `texts` (the old `tell`); the opponent's lines are the queries
# `opponent.pa` / `opponent.aw` (the old `opponent_lines`).

hero:
  values:
    "at(with: Rabenschnabel)": 16
    "at(with: Langschwert)": 14
    "at(with: Großschild)": 6
    "pa(with: Rabenschnabel)": 8
    "pa(with: Langschwert)": 8
    "pa(with: Großschild)": 13
    aw: 7
    mount.gs: 12

situations:

  # --- Passierschlag ------------------------------------------------------------------------

  - id: "17.1"
    name: A human flees Boronmir; Passierschlag with the Rabenschnabel (the page's example)
    loadout: { weapon: Rabenschnabel, reach: mittel }
    choose: { choice.passierschlag: true }
    expect:
      at: { total: -4, lines: [{ value: -4, from: passierschlag.PS2 }] }      # 16 → 12
      events: []                                                              # the old `costs: none`: no Handlung paid
      texts: [{ opponent: "keine Verteidigung", from: passierschlag.PS2 }]
    sequence:                                                                 # PS4 (the old `rolls` expectation)
      - rolls: [1]
        expect: { success: true, legal: { confirm: false, ruling: passierschlag.passierschlag-dice } }   # result: hit
      - rolls: [20]
        expect: { success: false, legal: { confirm: false, ruling: passierschlag.passierschlag-dice } }  # result: miss
    appToday: >
      same at AT 12 (no confirmation roll). isHit is a plain comparison with the AT, so at AT 20+
      a 20 would hit and at AT 0 or below a 1 would miss (17.4)

  - id: "17.2"
    name: Passierschlag with Wuchtschlag or Finte
    hero: { abilities: { SA_67: 1, SA_48: 1 } }   # Finte added: he dropped it in 2026-09
    loadout: { weapon: Langschwert, reach: mittel }
    choose: { choice.passierschlag: true }
    expect:
      notOffered:
        - { choice: wuchtschlag, because: passierschlag.PS3 }
        - { choice: finte, because: passierschlag.PS3 }
    appToday: same (the Passierschlag is itself the one entry of the manoeuvre list)

  - id: "17.3"
    name: Mounted on Kupperus, Passierschlag at a fleeing fighter on foot
    hero: { abilities: { SA_661: 1 } }
    loadout: { weapon: Rabenschnabel, reach: mittel, hero.mounted: true }
    opponent: { onFoot: true }
    choose: { choice.passierschlag: true }
    expect:
      at:
        total: 0                                                              # 16 → 16
        lines:
          - { value: -4, from: passierschlag.PS2 }
          - { value: 2, from: vorteilhafte-position.VP1, via: [reiterkampf.RK2] }
          - { value: 2, from: SA_661.GS1, ruling: passierschlag.passierschlag-sf }   # raises vorteilhafte-position.VP1
    appToday: same

  - id: "17.4"
    name: Passierschlag aimed at the head (Trefferzonen on)
    rulesets: [fokus.trefferzonen]
    hero: { abilities: { SA_160: 1 } }
    loadout: { weapon: Langschwert, reach: mittel }
    choose: { choice.passierschlag: true, choice.targetZone: kopf }
    expect:
      at:
        total: -14                                                            # 14 → 0 (Langschwert)
        lines:
          - { value: -4, from: passierschlag.PS2 }
          - { value: -10, from: trefferzonen.TZ5, ruling: passierschlag.passierschlag-zone }
          # no halving: Gezielter Angriff is a manoeuvre (PS3)
    sequence:                                                                 # the old `rolls` expectation
      - rolls: [1]
        expect: { success: true, legal: { ruling: passierschlag.passierschlag-dice } }   # at AT 0: result hit
    appToday: no zone picker on a Passierschlag — wrong

  - id: "17.5"
    name: Passierschlag in a corridor with the Langschwert
    loadout: { weapon: Langschwert, reach: mittel }
    gm: { gmFact.beengt: true }
    choose: { choice.passierschlag: true, action.with: weapon }
    expect:
      at:
        total: -8                                                             # 14 → 6
        lines:
          - { value: -4, from: passierschlag.PS2 }
          - { value: -4, from: beengte-umgebung.BU2 }
    appToday: same

  - id: "17.6"
    name: Passierschlag at a rat (winzig)
    loadout: { weapon: Rabenschnabel, reach: mittel }
    opponent: { size: winzig }
    choose: { choice.passierschlag: true }
    expect:
      at:
        total: -8                                                             # 16 → 8
        lines:
          - { value: -4, from: passierschlag.PS2 }
          - { value: -4, from: groessenkategorie.GK3 }
    appToday: same

  - id: "17.7"
    name: Two opponents flee in the same round
    loadout: { weapon: Rabenschnabel, reach: mittel }
    sequence:                                                                 # the old `attacks: [passierschlag, passierschlag]`, `each`
      - { choose: { choice.passierschlag: true }, expect: { at: { total: -4, lines: [{ value: -4, from: passierschlag.PS2 }] } } }
      - { choose: { choice.passierschlag: true }, expect: { at: { total: -4, lines: [{ value: -4, from: passierschlag.PS2 }] } } }
    expect:
      events: []                                    # the old `actions_used: 0` (PS2, PS5)
      # the old `counts_as_defence: false`: mehrfache-verteidigung does not move — no expect key
      # says it (MIGRATION.md, expectation conflicts)
    appToday: same (nothing counts Passierschläge)

  - id: "17.8"
    name: Boronmir on foot fails a Flucht and suffers a Passierschlag
    loadout: { weapon: Langschwert, reach: mittel, shield: Großschild, other: shield, shield.size: gross }
    gm: { gmFact.incomingAttack: passierschlag }                              # the old `event: { hero: fluchtFailed }`
    expect:
      notOffered: [{ defence: [pa, aw], because: passierschlag.PS2 }]
      # the old `next: takeDamage`: the take-damage screen follows — no expect key says it
      # (MIGRATION.md, expectation conflicts)
    appToday: same (CombatFluchtView → take-damage screen, "keine Verteidigung")

  - id: "17.9"
    name: Mounted, Boronmir flees past a fighter on foot and suffers a Passierschlag
    loadout: { hero.mounted: true }
    opponent: { onFoot: true }
    gm: { gmFact.incomingAttack: passierschlag }                              # the old `event: { hero: passierschlagSuffered }`
    expect:
      notOffered: [{ defence: [pa, aw], because: passierschlag.PS2 }]
      offered: [{ choice: mountHit, "on": takeDamage, from: reiterkampf.RK11, ruling: reiterkampf.passierschlag-on-mount }]
    sequence:
      - choose: { choice.mountHit: true }                                     # the old `with_choice`
        expect:
          texts: [{ player: "Die SP gehen auf die LeP des Reittiers.", from: reiterkampf.RK11 }]   # the old `target: mount`: the SP go to Kupperus's LE
          events: [{ check: { talent: TAL_6, with: Kampfmanöver }, from: reiterkampf.RK10 }]    # the old `then`: Reiten (Kampfmanöver)
    appToday: the damage goes to Boronmir — wrong

  # --- Angriff von hinten -------------------------------------------------------------------

  - id: "17.10"
    name: Mounted, a fighter on foot attacks Boronmir from behind
    hero: { abilities: { SA_661: 1 } }
    loadout: { weapon: Rabenschnabel, reach: mittel, shield: Großschild, other: shield, shield.size: gross, hero.mounted: true }
    opponent: { onFoot: true }
    gm: { gmFact.fromBehind: true, gmFact.incomingAttack: melee }
    expect:
      "pa(with: weapon)":
        # base 8: the Großschild's passive +3 does not apply
        total: -1                                                             # 8 → 7
        lines:
          - { value: 2, from: vorteilhafte-position.VP1, via: [reiterkampf.RK2] }
          - { value: 1, from: SA_661.GS2 }
          - { value: -4, from: angriff-von-hinten.AH1 }
        notApplied:
          - { rule: schilde, clause: SCH1, reason: reiterkampf.RK5, ruling: angriff-von-hinten.mounted-from-behind-shield }
      notOffered:
        - { defence: shieldParry, because: reiterkampf.RK5, ruling: angriff-von-hinten.mounted-from-behind-shield }
      aw:
        total: -4                                                             # 7 → 3
        lines:
          - { value: 2, from: vorteilhafte-position.VP1, via: [reiterkampf.RK2] }
          - { value: -2, from: reiterkampf.RK6 }
          - { value: -4, from: angriff-von-hinten.AH1 }
    appToday: shield parry offered at 12, weapon parry 10 — wrong; AW 3 right
    # From the weapon-arm side instead (not behind): no −4, and the shield parry is still not
    # offered (RK5) — how the app learns the side is the open reiterkampf.mounted-attack-side.

  - id: "17.11"
    name: On foot, Langschwert and Großschild, attacked from behind
    loadout: { weapon: Langschwert, reach: mittel, shield: Großschild, other: shield, shield.size: gross, hero.mounted: false }   # on foot, as the name says (R61)
    gm: { gmFact.fromBehind: true, gmFact.incomingAttack: melee }
    expect:
      "pa(with: shield)": { total: -4, lines: [{ value: -4, from: angriff-von-hinten.AH1 }] }   # 13 → 9
      "pa(with: weapon)": { total: -4, lines: [{ value: -4, from: angriff-von-hinten.AH1 }] }   # 11 → 7
      aw: { total: -4, lines: [{ value: -4, from: angriff-von-hinten.AH1 }] }          # 7 → 3
    appToday: same

  - id: "17.12"
    name: Boronmir attacks a human from behind
    loadout: { weapon: Rabenschnabel, reach: mittel, weapon.kind: melee }
    gm: { gmFact.fromBehind: true }
    expect:
      at: { total: 0 }
      "opponent.pa": { total: -4, lines: [{ value: -4, from: angriff-von-hinten.AH1 }] }   # the old `opponent_lines: [{ to: [pa, aw] … }]`
      "opponent.aw": { total: -4, lines: [{ value: -4, from: angriff-von-hinten.AH1 }] }
    appToday: same (an opponent line "Gegner-VW −4")

  - id: "17.13"
    name: An arrow from behind; Boronmir dodges
    loadout: { weapon: Langschwert, reach: mittel }
    gm: { gmFact.fromBehind: true, gmFact.incomingAttack: ranged }            # the old `attack: { kind: ranged }`
    expect:
      aw: { total: 0 }                                                        # 7
      notApplied: [{ rule: angriff-von-hinten, clause: AH1, reason: "melee only", ruling: angriff-von-hinten.from-behind-ranged }]
    appToday: −4 when the toggle is set — wrong (the defence screen does not know the attack was ranged)

  # --- Beengte Umgebung ---------------------------------------------------------------------

  - id: "17.14"
    name: A corridor, Langschwert and Großschild, AT and parry with the Langschwert
    loadout: { weapon: Langschwert, reach: mittel, shield: Großschild, other: shield, shield.size: gross }
    gm: { gmFact.beengt: true }
    choose: { action.with: weapon }
    expect:
      # The Großschild's row (BU3) reaches only rolls with the shield (ruling
      # beengte-umgebung.beengt-shield-carried): 17.15, 17.17.
      at: { total: -4, lines: [{ value: -4, from: beengte-umgebung.BU2 }] }            # 14 → 10
      "pa(with: weapon)": { total: -4, lines: [{ value: -4, from: beengte-umgebung.BU2 }] }     # 11 → 7
    appToday: same

  - id: "17.15"
    name: The same corridor, parrying with the Großschild
    loadout: { weapon: Langschwert, reach: mittel, shield: Großschild, other: shield, shield.size: gross }
    gm: { gmFact.beengt: true }
    choose: { action.defence: shieldParry, action.with: shield }
    expect:
      "pa(with: shield)": { total: -4, lines: [{ value: -4, from: beengte-umgebung.BU3 }] }       # 13 → 9
    appToday: −4, but from the Langschwert's reach (mittel), not the shield's row — right by coincidence

  - id: "17.16"
    name: The Langschwert dropped; Raufen and the Großschild, parrying with the shield
    loadout: { weapon: null, reach: kurz, shield: Großschild, other: shield, shield.size: gross }
    gm: { gmFact.beengt: true }
    choose: { action.defence: shieldParry, action.with: shield }
    expect:
      "pa(with: shield)": { total: -4, lines: [{ value: -4, from: beengte-umgebung.BU3 }] }       # 13 → 9
    appToday: 0 — wrong (the main piece is bare hands, kurz; Situation.loadoutReach)

  - id: "17.17"
    name: A shield bash with the Großschild in the corridor
    loadout: { weapon: Langschwert, reach: mittel, shield: Großschild, other: shield, shield.size: gross }
    gm: { gmFact.beengt: true }
    choose: { action.with: shield }                                           # the old `attack: { with: Großschild }`
    expect:
      at: { total: -6, lines: [{ value: -6, from: beengte-umgebung.BU3 }] }             # 6 → 0
    appToday: >
      no shield attack is offered (beidhaendiger-kampf); where the app does roll AT with the
      shield (a Passierschlag named for it, PassierschlagRoll) the shield's reach is kurz and
      Beengte Umgebung gives 0 — wrong

  - id: "17.18"
    name: The corridor with the Rabenschnabel alone; and dodging
    loadout: { weapon: Rabenschnabel, reach: mittel }
    gm: { gmFact.beengt: true }
    choose: { action.with: weapon }
    expect:
      at: { total: -4, lines: [{ value: -4, from: beengte-umgebung.BU2 }] }             # 16 → 12
      pa: { total: -4, lines: [{ value: -4, from: beengte-umgebung.BU2 }] }             # 8 → 4
      aw: { total: 0 }                                                                  # 7
    appToday: same

  # --- Größenkategorie ----------------------------------------------------------------------

  - id: "17.19"
    name: Boronmir attacks a rat (winzig)
    loadout: { weapon: Rabenschnabel, reach: mittel }
    opponent: { size: winzig }
    expect:
      at: { total: -4, lines: [{ value: -4, from: groessenkategorie.GK3 }] }            # 16 → 12
    appToday: same
    # With Trefferzonen and a zone announced, the zone penalty replaces this: trefferzonen TZ.7.

  - id: "17.20"
    name: An Oger (groß) attacks; Langschwert and Großschild
    loadout: { weapon: Langschwert, reach: mittel, shield: Großschild, other: shield, shield.size: gross }
    opponent: { size: gross }
    expect:
      offered: [{ defence: shieldParry }, { defence: aw }]
      notOffered: [{ defence: weaponParry, because: groessenkategorie.GK4 }]
      "pa(with: shield)": { total: 0 }                                                           # 13
    appToday: same (SizeCategoryRules.allowedDefenses; the weapon list shows only the shield)

  - id: "17.21"
    name: An Oger attacks; the Rabenschnabel alone
    loadout: { weapon: Rabenschnabel, reach: mittel }
    opponent: { size: gross }
    expect:
      offered: [{ defence: aw }]
      notOffered: [{ defence: weaponParry, because: groessenkategorie.GK4 }]
    appToday: same

  - id: "17.22"
    name: Mounted on Kupperus, Boronmir attacks a fighter on foot
    hero: { abilities: { SA_661: 1 } }
    loadout: { weapon: Rabenschnabel, reach: mittel, hero.mounted: true }
    opponent: { onFoot: true, size: mittel }
    expect:
      at:
        total: 4                                                              # 16 → 20
        lines:
          - { value: 2, from: vorteilhafte-position.VP1, via: [reiterkampf.RK2] }
          - { value: 2, from: SA_661.GS1 }                                    # raises vorteilhafte-position.VP1
      texts: []          # no defence restriction: Boronmir is mittel (ruling groessenkategorie.mounted-size)
    appToday: same (AT 20; nothing said about the opponent's defence)

  - id: "17.23"
    name: On foot, a mounted knight attacks Boronmir (Langschwert and Großschild)
    loadout: { weapon: Langschwert, reach: mittel, shield: Großschild, other: shield, shield.size: gross }
    opponent: { mounted: true, size: mittel }
    expect:
      offered: [{ defence: weaponParry }, { defence: shieldParry }, { defence: aw }]
      # The rider is mittel, not the mount's groß (ruling groessenkategorie.mounted-size).
    appToday: same (whatever size the player picks for the rider; mittel by default)

  - id: "17.24"
    name: Mounted, a Riese (riesig, on foot) attacks
    loadout: { weapon: Rabenschnabel, reach: mittel, shield: Großschild, other: shield, shield.size: gross, hero.mounted: true }
    opponent: { size: riesig, onFoot: true }
    expect:
      offered: [{ defence: aw }]
      notOffered:
        - { defence: weaponParry, because: groessenkategorie.GK4 }
        - { defence: shieldParry, because: groessenkategorie.GK4 }
      aw:
        total: 0                                                              # 7
        lines:
          - { value: 2, from: vorteilhafte-position.VP1, via: [reiterkampf.RK2] }
          - { value: -2, from: reiterkampf.RK6 }
    appToday: same
