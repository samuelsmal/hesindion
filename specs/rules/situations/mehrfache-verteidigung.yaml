# Example 3 — Mehrfache Verteidigung. Same conventions as belastung.yaml. No armour, on foot.
# `round.defencesMade` is the number of defences already rolled this Kampfrunde (the old
# `round.defences` list, counted). The defence being rolled is the query (`pa` or `aw`; the old
# `check:`). A defence's `legal` says whether it may be rolled, and why not.
# DRAFT FORMAT — see ../README.md.

hero: { values: { at: 14, pa: 8, aw: 7, ini: 12, gs: 8 } }

situations:

  - id: V1
    name: First parry of the round
    round: { defencesMade: 0 }
    expect:
      pa: { total: 0 }
    appToday: same

  - id: V2
    name: Second parry
    round: { defencesMade: 1 }                  # pa
    expect:
      pa: { total: -3, lines: [{ value: -3, from: mehrfache-verteidigung.MV1 }] }
    appToday: same

  - id: V3
    name: Third parry
    round: { defencesMade: 2 }                  # pa, pa
    expect:
      pa: { total: -6, lines: [{ value: -6, from: mehrfache-verteidigung.MV1 }] }
    appToday: same

  - id: V4
    name: A dodge after a parry — the penalty carries across kinds
    round: { defencesMade: 1 }                  # pa
    expect:
      aw: { total: -3, lines: [{ value: -3, from: mehrfache-verteidigung.MV1, via: [mehrfache-verteidigung.MV4] }] }
    appToday: 0 — wrong (parries and dodges are counted apart, CombatSituation.defensesSoFar)

  - id: V5
    name: A parry after dodging an arrow — ranged defences count too
    loadout: { hero.mounted: false }            # on foot, as the header says (R61)
    round: { defencesMade: 1 }                  # a dodge against a ranged attack
    expect:
      pa: { total: -3, lines: [{ value: -3, from: mehrfache-verteidigung.MV1, via: [mehrfache-verteidigung.MV4] }] }
    appToday: 0 — wrong (counted per kind)

  - id: V6
    name: The next Kampfrunde
    round: { number: 2, defencesMade: 0 }       # the previous round had pa, pa, aw
    expect:
      pa: { total: 0 }
    appToday: same

  - id: V7
    name: Vinsalt-Stil with a Rapier, third defence
    hero: { abilities: { SA_923: 1 } }
    loadout: { weapon: Rapier, weapon.technique: CT_4, hero.mounted: false }   # Fechtwaffe; on foot (R61: the comment and the header)
    round: { defencesMade: 2 }                  # pa, aw
    expect:
      pa: { total: -4, lines: [{ value: -4, from: mehrfache-verteidigung.MV1, via: [SA_923.VS1], ruling: kampfstil-techniques }] }   # changed by VS1
    appToday: −2 — wrong (only the one earlier parry is counted, not the dodge)

  - id: V8
    name: Vinsalt-Stil with a Schwert
    hero: { abilities: { SA_923: 1 } }
    loadout: { weapon: Schwert }
    round: { defencesMade: 2 }                  # pa, pa
    expect:
      pa: { total: -6, lines: [{ value: -6, from: mehrfache-verteidigung.MV1 }] }
      notApplied:
        - { rule: SA_923, clause: VS1, reason: a Schwert is not in VS2's list, ruling: kampfstil-techniques }
    appToday: same (the catalog requires an Armbrust, Fechtwaffe or Zweihandschwert)

  - id: V9
    name: The value reaches 0 — parry gone, dodge still there
    hero: { values: { pa: 5, aw: 7 } }
    round: { defencesMade: 2 }                  # pa, pa
    expect:
      pa: { result: -1, legal: { allowed: false, because: mehrfache-verteidigung.MV3, ruling: mehrfache-verteidigung.zero-value } }
      aw: { result: 1, legal: true }
    appToday: both offered; the parry is rolled against −1 — wrong

  - id: V10
    name: Schip "Verteidigung" keeps a defence alive
    hero: { values: { pa: 5 } }
    round: { defencesMade: 2 }                  # pa, pa
    choose: { choice.schipVerteidigung: true }
    expect:
      pa:
        total: -2
        result: 3        # the old `pa_value`: 5 − 6 + 4, above 0, so the parry is allowed (MV3)
        lines:
          - { value: -6, from: mehrfache-verteidigung.MV1 }
          - { value: 4, from: schicksalspunkte.SP-verteidigung }
    appToday: the +4 line exists but cites no rule (DefenseModifiers.schipDefenseBoost, rules [])

  - id: V11
    name: Verteidigungshaltung, announced at the start of the round
    hero: { abilities: { SA_65: 1 } }
    round: { phase: start }
    choose: { choice.verteidigungshaltung: true }
    expect:
      pa: { total: 4, lines: [{ value: 4, from: SA_65.VH1, ruling: SA_65.vh-scope }] }
      aw: { total: 4, lines: [{ value: 4, from: SA_65.VH1, ruling: SA_65.vh-scope }] }
      legal: { actions: { attack: forbidden, spell: forbidden, freeAction: { allowed: true, ruling: SA_65.vh-free-actions } } }
    appToday: not offered — SA_65 is not implemented (catalog status todo)

  - id: V12
    name: Verteidigungshaltung and the Schip "Verteidigung" together
    hero: { abilities: { SA_65: 1 } }
    loadout: { hero.mounted: false }            # on foot, as the header says (R61)
    choose: { choice.verteidigungshaltung: true, choice.schipVerteidigung: true }
    expect:
      pa:
        total: 8
        lines:
          - { value: 4, from: SA_65.VH1, ruling: [SA_65.vh-scope, SA_65.vh-stacking] }
          - { value: 4, from: schicksalspunkte.SP-verteidigung, ruling: SA_65.vh-stacking }
    appToday: +4 (only the Schip exists)

  - id: V13
    name: Verteidigungshaltung wanted in the middle of the round
    hero: { abilities: { SA_65: 1 } }
    round: { phase: afterFirstAction }
    expect:
      notOffered: [{ choice: verteidigungshaltung, because: SA_65.VH1 }]
