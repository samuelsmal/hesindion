# Example 7 — Liegend. Same conventions as belastung.yaml. DRAFT FORMAT — see ../README.md.
# The opponent's lines (the old `opponent_lines`) are the queries `opponent.pa` / `opponent.aw`,
# printed as the opponent's own calculation; the hero's values do not move.
#
# Re-keyed under §10.1 (plan Task 12):
#   `states: [STATE_10]` (hero input)        → `hero: { states: { STATE_10: true } }`
#   `states: [{ COND_6: n }]`                → `hero: { conditions: { COND_6: n } }`
#   `opponent: { states: [STATE_10] }`       → `opponent: { has: STATE_10 }`
#   `bewusstlos`, `handlungsunfaehig`        → STATE_2 (Bewusstlos), STATE_8 (Handlungsunfähig)
#   `states: { handlungsunfaehig }` (expect) → `events: [{ gained: STATE_8 }]`
#   `STATE_10: { asked: … }`                 → `questions: [{ fact: choice.liegend, … }]` (STATE_8.H3)
#   `actions: none`, `defences: none`        → `legal: { actions: none, defences: none }`
#   `gs: { set: n, from }`                   → `gs: { result: n, lines: [{ kind: set, from }] }`
#   `told`                                   → `texts`
#   `choose: { action, check }`              → `choose: { choice.aufstehen, choice.passierschlagVermeiden,
#                                               check.* }` and `rolls: { check.result }`
#   `offered: [{ action: aufstehen }]`       → `offered: [{ choice: aufstehen }]`
#   `after: { states: { STATE_10: removed } }` → `events: [{ cleared: STATE_10 }]`
#   `check: { fk: true }` (input)            → the query `fk` itself
#   `GRW_zustandsbegrenzung`                 → zustaende.Z3; `from: COND_6` (a line) → COND_6.SZ5

hero: { values: { at: 14, pa: 8, aw: 7, fk: 10, ini: 12, gs: 8 } }

situations:

  - id: "7.1"
    name: The hero lies on the ground
    hero: { states: { STATE_10: true } }
    expect:
      at: { total: -4, lines: [{ value: -4, from: STATE_10.L3, ruling: STATE_10.liegend-attacks }] }
      pa: { total: -2, lines: [{ value: -2, from: STATE_10.L3 }] }
      aw: { total: -2, lines: [{ value: -2, from: STATE_10.L3 }] }
      gs: { result: 1, lines: [{ kind: set, from: STATE_10.L2 }] }
    appToday: same (AT/PA/AW from the catalog's STATE_10, GS from Hero.effectiveGeschwindigkeit)

  - id: "7.2"
    name: The hero shoots from the ground
    hero: { states: { STATE_10: true } }
    expect:
      fk: { total: -4, lines: [{ value: -4, from: STATE_10.L3, ruling: STATE_10.liegend-attacks }] }
    appToday: 0 — the catalog's STATE_10 reaches melee attacks only (domain meleeAttack)

  - id: "7.3"
    name: The hero attacks an opponent who lies on the ground
    opponent: { has: STATE_10 }
    expect:
      at: { total: 0 }
      "opponent.pa": { total: -2, lines: [{ value: -2, from: STATE_10.L3 }] }   # the old `opponent_lines: { defence }`
      "opponent.aw": { total: -2, lines: [{ value: -2, from: STATE_10.L3 }] }
      texts: [{ opponent: "AT −4", from: STATE_10.L3 }, { opponent: "GS 1", from: STATE_10.L2 }]
    appToday: the −2 opponent line, printed on the announcement and the damage screen; nothing told about their AT or GS

  - id: "7.4"
    name: The hero is Bewusstlos
    hero: { states: { STATE_2: true } }
    expect:
      events: [{ gained: STATE_8, from: STATE_2.BW3 }]                   # Handlungsunfähig, the Bewusstlos page
      questions: [{ fact: choice.liegend, text: "Liegt der Held?", from: STATE_8.H3, ruling: STATE_10.handlungsunfaehig-liegend }]
      legal: { actions: none, defences: none }
      gs: { result: 0, lines: [{ kind: set, from: STATE_8.H2 }] }        # the Handlungsunfähig page: GS 0
    appToday: >
      Liegend always implied, never asked (StateCatalog: implies ["liegend"]); GS 1 — wrong
      (Handlungsunfähig sets GS 0, Hero.effectiveGeschwindigkeit only knows Liegend)

  - id: "7.5"
    name: Handlungsunfähig from Schmerz IV, on the battlefield
    hero: { conditions: { COND_6: 4 } }
    expect:
      events: [{ gained: STATE_8, from: COND_6.SZ5 }]
      questions: [{ fact: choice.liegend, text: "Liegt der Held?", from: STATE_8.H3, ruling: STATE_10.handlungsunfaehig-liegend }]
      gs: { result: 0, lines: [{ kind: set, from: STATE_8.H2 }] }
    appToday: >
      Handlungsunfähig, but only via Hero.isHandlungsunfaehigFromZustaende — nothing asks about
      Liegend and nothing implies it (impliedStateIDs reads only states that are *set*); GS stays 8

  - id: "7.6"
    name: Standing up with an opponent in reach
    hero: { states: { STATE_10: true } }
    opponent: { inReach: true }
    choose:
      choice.aufstehen: true
      choice.passierschlagVermeiden: true
      check.kind: talent
      check.talent: TAL_4                     # Körperbeherrschung
      check.application: Kampfmanöver
    rolls: { check.result: failure }
    expect:
      offered: [{ choice: aufstehen, from: STATE_10.L4, costs: action }]
      events: [{ cleared: STATE_10, from: STATE_10.L4 }]
      texts: [{ opponent: passierschlag, from: STATE_10.L4 }]
    appToday: no stand-up action; the player removes Liegend by hand

  - id: "7.7"
    name: Standing up, Körperbeherrschung succeeds
    hero: { states: { STATE_10: true } }
    opponent: { inReach: true }
    choose:
      choice.aufstehen: true
      choice.passierschlagVermeiden: true
      check.kind: talent
      check.talent: TAL_4                     # Körperbeherrschung
      check.application: Kampfmanöver
    rolls: { check.result: success }
    expect:
      events: [{ cleared: STATE_10, from: STATE_10.L4 }]
      texts: []

  - id: "7.8"
    name: Liegend is a Status — it is not capped with the Zustände
    hero: { states: { STATE_10: true }, conditions: { COND_6: 3 } }
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    expect:
      at:
        total: -9
        lines:
          - { value: -4, from: STATE_10.L3 }
          - { value: -3, from: COND_1.B3 }
          - { value: -3, from: COND_6.SZ5 }
          - { value: 1, from: zustaende.Z3 }      # Zustände −6 capped at −5; see example 4
    appToday: same total (ModifierEngine.applyingZustandCap; Liegend is not tagged isZustand)
