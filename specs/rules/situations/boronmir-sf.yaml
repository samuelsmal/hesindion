# Example 14 — Boronmir's Kampfsonderfertigkeiten: Vorstoß, Schildspalter, Aufmerksamkeit,
# Plänkler-Formation. Same conventions as belastung.yaml. DRAFT FORMAT — see ../README.md.
# Open rulings named without a prefix live in ../rulings.yaml or in the rule's own file.
#
# The hero is Boronmir with his values as of 2026-09-24 (specs/heroes/Boronmir Siebenfeld von
# Greifenfurt.json), always in his Plattenrüstung. He dropped Finte, Schildspalter,
# Vorstoß and Plänkler-Formation that day (he took Formation instead, example 19), so this example
# adds SA_48, SA_59, SA_66 and SA_884 back; their prerequisites (GE 13, KK 13, Wuchtschlag I) he
# still meets. His values, derived as the app derives them (OptolithImportService:
# AT = KtW + (MU−8)/3, PA = ⌈KtW/2⌉ + (Leiteigenschaft−8)/3, both rounded down):
#   MU 14 → +2 AT; KK 14 → +2 PA (Hiebwaffen and Schilde: KK; Schwerter: GE 14 / KK 14)
#   Rabenschnabel (Hiebwaffen 14, AT 0 / PA −1):  AT 16, PA 8, with the Großschild's passive +3: 11
#   Langschwert   (Schwerter 12, AT 0 / PA 0):    AT 14, PA 8, with the passive +3: 11
#   Großschild    (Schilde 10, AT −6 / PA +3, StP 30): AT 6, PA 7 + 2 × 3 = 13  (schilde)
#   AW: GE 14 / 2 = 7. Sinnesschärfe (TAL_10) FW 9.
#   Rabenschnabel TP 1W6+4: KK 14 is not above its Schadensschwelle KK 14, no Schadensbonus.
# Belastung: Plattenrüstung III, Belastungsgewöhnung II → I: −1 on AT, PA, AW on foot
# (COND_1.B3 via SA_41.G1, belastung 2.2); mounted, RK7 lowers it to none for
# Kampfproben (reiterkampf.RK7).
# Mounted on Kupperus against foot fighters: Vorteilhafte Position +2 AT/PA/AW, Golgariten-Stil
# +2 AT (Rabenschnabel) and +1 PA, dodge −2 (reiterkampf 5.6).
# `total` is the sum of the lines; `result` is the value on the check, from the base above.
# The base values below are the old per-item `values` (Großschild StP 30 is
# `item.structurePoints(with: Großschild)`). Every situation states its loadout in full, as the
# file-level `hero` holds none (the old file-level `armour` and `loadout`): Rabenschnabel and
# Großschild in the Plattenrüstung (Belastung 3, no extra) unless it says otherwise.
# A manoeuvre or toggle chosen is its `choice.<name>` (the old `vorstoss`, `manoeuvre:`,
# `tier`); "announced at the start of the round" is `round.phase: start` (the old
# `at: round_start`); "then" is a `sequence` step. What is not allowed is a query's `legal`
# (the old `not_allowed`), whether manoeuvres combine the situation's `legal.combinations`, what
# the player or opponent is told `texts`.

heroFile: "../../heroes/Boronmir Siebenfeld von Greifenfurt.json"
hero:
  # SA_48, SA_59, SA_66, SA_884: added for this example, dropped on 2026-09-24
  abilities: { SA_40: 1, SA_41: 2, SA_43: 1, SA_67: 1, SA_661: 1, SA_862: 1, SA_48: 1, SA_59: 1, SA_66: 1, SA_884: 1 }
  values:
    "at(with: Rabenschnabel)": 16
    "pa(with: Rabenschnabel)": 11
    "at(with: Langschwert)": 14
    "pa(with: Langschwert)": 11
    "at(with: Großschild)": 6
    "pa(with: Großschild)": 13
    "item.structurePoints(with: Großschild)": 30
    aw: 7

situations:

  # --- Vorstoß (SA_66) -----------------------------------------------------------------------

  - id: "14.1"
    name: Vorstoß with the Rabenschnabel, announced at the start of the round, on foot
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    round: { phase: start }
    choose: { choice.vorstoss: true }
    expect:
      offered: [{ choice: vorstoss, from: SA_66.V3 }]
      at:
        total: 1
        result: 17
        lines:
          - { value: 2, from: SA_66.V1 }
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
      pa: { legal: { allowed: false, span: round, because: SA_66.V2 } }    # until the round ends
      aw: { legal: { allowed: false, span: round, because: SA_66.V2 } }
    appToday: same, when the attack is the hero's first act of the round

  - id: "14.2"
    name: Vorstoß after Boronmir has already parried this round
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    round: { parries: 1, phase: afterFirstDefence }   # he has parried once: no longer the round's start
    expect:
      notOffered: [{ choice: vorstoss, because: SA_66.V3 }]
    appToday: >
      offered on the attack's announcement, at any point in the round; AT +2 and the defences
      are blocked only from then on (CombatAttackViews.availableManeuvers, proceed())

  - id: "14.3"
    name: Vorstoß while Liegend
    hero: { states: { STATE_10: true } }
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    expect:
      notOffered: [{ choice: vorstoss, because: SA_66.V4 }]
    appToday: offered (availableManeuvers does not look at hero.isLiegend)

  - id: "14.4"
    name: Vorstoß for an attack with the Großschild (Schilde — not on the list)
    loadout: { weapon: Großschild, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    expect:
      notOffered: [{ choice: vorstoss, because: SA_66.V6, ruling: sf-technique-lists }]
    appToday: offered — no manoeuvre checks the technique — wrong

  - id: "14.5"
    name: Vorstoß on horseback
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0, hero.mounted: true }
    expect:
      notOffered:
        - { choice: vorstoss, because: reiterkampf.RK3, ruling: reiterkampf.mounted-manoeuvres }
    appToday: offered — wrong (reiterkampf 5.9)

  - id: "14.6"
    name: Vorstoß round, then a Passierschlag at a foe leaving reach
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    round: { phase: start }
    choose: { choice.vorstoss: true, choice.passierschlag: true }   # Vorstoß at the start, then a Passierschlag
    expect:
      at:                           # the Passierschlag's AT (the old `passierschlag_at`)
        total: -5
        result: 11
        lines:
          - { value: -4, from: passierschlag.PS2 }
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
        notApplied:
          - { rule: SA_66, reason: "a Passierschlag combines with no Kampfsonderfertigkeit (passierschlag.PS3)" }
      # Vorstoß is a manoeuvre, excluded from a Passierschlag (ruling passierschlag.passierschlag-sf).
      # The defences stay gone for the round (SA_66.V2).
    appToday: same (PassierschlagRoll sets maneuver .passierschlag)

  - id: "14.7"
    name: Vorstoß and Wuchtschlag I on the same attack
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    round: { phase: start }
    choose: { choice.vorstoss: true, choice.wuchtschlag: 1 }
    expect:
      legal: { combinations: [{ choices: [vorstoss, wuchtschlag], allowed: true, from: kampfsonderfertigkeiten.KS5 }] }
      # AT +2 −2 −1 = −1 (result 15), TP 1W6+4 +2
    appToday: one manoeuvre per attack — Vorstoß or Wuchtschlag

  # --- Schildspalter (SA_59) -----------------------------------------------------------------

  - id: "14.8"
    name: Schildspalter with the Rabenschnabel against a fighter with a shield
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    opponent: { hasShield: true }
    choose: { choice.schildspalter: true, action.attack: hit }
    expect:
      offered: [{ choice: schildspalter, from: SA_59.SS1 }]
      at:
        total: -1
        result: 15
        lines: [{ value: -1, from: COND_1.B3, via: [SA_41.G1] }]    # SA_59.SS5: no line of its own
      texts:
        - { opponent: "Nur Schildparade oder Ausweichen", from: SA_59.SS1 }
        - { opponent: "Schildparade ohne Parade-Bonus des Schildes", from: SA_59.SS2 }
        # on the hit (the old `on_hit.tp`): the TP, 1W6+4, go to the opponent's shield's
        # Strukturpunkte, which the opponent's side is told
        - { opponent: "TP gehen auf die Strukturpunkte des Schildes; bei 0 ist er zerstört", from: SA_59.SS3 }
    appToday: >
      offered, AT unchanged; the note says only "Schaden gegen Schild-SP" — the limits on the
      opponent's defence are not told (CombatManeuver.infoText)

  - id: "14.9"
    name: Schildspalter against a fighter without a shield
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    opponent: { hasShield: false }
    expect:
      notOffered: [{ choice: schildspalter, because: SA_59.SS4 }]
    appToday: offered — the app never asks whether the opponent carries a shield (OpponentProfile)

  - id: "14.10"
    name: Schildspalter with the Langschwert (Schwerter — not on the list)
    loadout: { weapon: Langschwert, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    opponent: { hasShield: true }
    expect:
      notOffered: [{ choice: schildspalter, because: SA_59.SS7, ruling: sf-technique-lists }]
    appToday: offered — wrong

  - id: "14.11"
    name: Schildspalter on horseback
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0, hero.mounted: true }
    opponent: { hasShield: true, onFoot: true }
    expect:
      notOffered:
        - { choice: schildspalter, because: reiterkampf.RK3, ruling: reiterkampf.mounted-manoeuvres }
    appToday: offered — wrong (reiterkampf 5.9)

  - id: "14.12"
    name: Schildspalter with Wuchtschlag I (its prerequisite)
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    opponent: { hasShield: true }
    choose: { choice.schildspalter: true, choice.wuchtschlag: 1 }
    expect:
      legal: { combinations: [{ choices: [schildspalter, wuchtschlag], allowed: true, from: kampfsonderfertigkeiten.KS5 }] }
      # AT −2 (SA_67.W1) −1 (Belastung) = −3, result 13; 1W6+4 +2 TP to the shield's StP
    appToday: one manoeuvre per attack

  - id: "14.13"
    name: An opponent's Schildspalter at Boronmir's Großschild, on foot
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    opponent: { manoeuvre: schildspalter }
    expect:
      "pa(with: weapon)": { legal: { allowed: false, because: SA_59.SS1 } }   # the old `not_allowed: weaponParry`
      "pa(with: shield)":
        total: -7
        result: 6
        lines:
          - { value: -6, from: SA_59.SS2, ruling: [SA_59.schildspalter-shield-bonus, SA_59.schildspalter-against-hero] }   # removes schilde.SCH3
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
      aw: { total: -1, result: 6, lines: [{ value: -1, from: COND_1.B3, via: [SA_41.G1] }] }
    sequence:
      - rolls: { check.result: failure }   # the defence fails (the old `on_failed_defence`)
        expect:
          events: [{ itemChanged: loadout.shield.structurePoints, from: SA_59.SS3, ruling: SA_59.schildspalter-against-hero }]
          # the TP come off the Großschild's current StP (30 when whole), not Boronmir's LeP; at 0
          # the shield is destroyed and leaves the loadout
    appToday: >
      the app cannot be told: weapon parry 11 − 1 and the full shield parry 13 − 1 are offered,
      and the damage goes to Boronmir's LeP. The shield's StP are never reduced.

  # --- Aufmerksamkeit (SA_40) ----------------------------------------------------------------

  - id: "14.14"
    name: Sinnesschärfe (Hinterhalt entdecken) when the party is ambushed
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    # the old `situation: ambush`: the toggle on
    choose: { check.kind: talent, check.talent: TAL_10, check.application: Hinterhalt entdecken, choice.hinterhaltUeberraschung: true }
    expect:
      offered: [{ choice: hinterhaltUeberraschung, from: SA_40.A1, ruling: SA_40.aufmerksamkeit-when }]
      "check.modifier(talent: TAL_10)":
        total: 2
        lines: [{ value: 2, from: SA_40.A1, ruling: SA_40.aufmerksamkeit-when }]
        # the toggle on. Belastung: off unless the player turns on the "Belastung zählt" toggle
        # (COND_1.belastung-talents-maybe); with it, −1 more.
    appToday: >
      the hint "Aufmerksamkeit: +2 auf Überraschung vermeiden"; the value is unchanged
      (TalentProbeModal.hints, catalog SA_40 byHand)

  - id: "14.15"
    name: Sinnesschärfe to find a hidden clue — no ambush
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { check.kind: talent, check.talent: TAL_10, check.application: Suchen, choice.hinterhaltUeberraschung: false }
    expect:
      "check.modifier(talent: TAL_10)": { total: 0, notApplied: [{ rule: SA_40, reason: "no ambush and no surprise (SA_40.A1)", ruling: SA_40.aufmerksamkeit-when }] }
      # the Hinterhalt / Überraschung toggle is offered and stays off
    appToday: the same hint is shown on every Sinnesschärfe check

  # --- Plänkler-Formation (SA_884) -----------------------------------------------------------

  - id: "14.16"
    name: In a Plänkler-Formation on foot, the line takes +1 AT
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { choice.plaenklerFormation: true, choice.plaenklerFormation.bonus: at }
    expect:
      at:
        total: 0
        result: 16
        lines:
          - { value: 1, from: SA_884.P2 }
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
      pa: { total: -1, result: 10 }
    appToday: same

  - id: "14.17"
    name: In a Plänkler-Formation on foot, the line takes +1 VW — weapon parry, shield parry, dodge
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { choice.plaenklerFormation: true, choice.plaenklerFormation.bonus: vw }
    expect:
      pa:            { total: 0, result: 11, lines: [{ value: 1, from: SA_884.P2 }, { value: -1, from: COND_1.B3, via: [SA_41.G1] }] }
      "pa(with: shield)":  { total: 0, result: 13, lines: [{ value: 1, from: SA_884.P2 }, { value: -1, from: COND_1.B3, via: [SA_41.G1] }] }
      aw:            { total: 0, result: 7,  lines: [{ value: 1, from: SA_884.P2 }, { value: -1, from: COND_1.B3, via: [SA_41.G1] }] }
      at:            { total: -1, result: 15 }
    appToday: same

  - id: "14.18"
    name: A companion without the SF, standing in Boronmir's line (Formation, its larger sibling, in 19.3)
    hero: { abilities: {} }          # any hero without SA_884
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    ally: { has: SA_884 }
    choose: { choice.plaenklerFormation: true, choice.plaenklerFormation.bonus: at }
    expect:
      offered: [{ choice: plaenklerFormation, from: SA_884.P4 }]
      at: { lines: [{ value: 1, from: SA_884.P2, via: [SA_884.P4] }] }
    appToday: >
      not offered — the setup toggle is shown only to a hero with the SF
      (CombatSetupView, hero.hasPlaenklerFormation; the catalog note on SA_884 says so)

  - id: "14.19"
    name: Plänkler-Formation on Kupperus, against foot fighters, Rabenschnabel
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0, hero.mounted: true }
    opponent: { onFoot: true }
    choose: { choice.plaenklerFormation: true, choice.plaenklerFormation.bonus: at }
    expect:
      notOffered: [{ choice: plaenklerFormation, because: SA_884.P1, ruling: SA_884.plaenkler-mounted }]
      at:
        total: 4
        result: 20
        # +2 VP1 via RK2, +2 SA_661.GS1; Belastung I is none for Kampfproben mounted (RK7); the
        # toggle is off with the reason. Formation mounted: 19.4
        notApplied: [{ rule: SA_884, reason: "not while mounted (SA_884.P1, ruling plaenkler-mounted)" }]
    appToday: +1 AT on top, 21 (the bonus ignores whether the hero is mounted) — wrong

  - id: "14.20"
    name: The line breaks up mid-fight
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { choice.plaenklerFormation: true, choice.plaenklerFormation.bonus: vw }
    sequence:
      - choose: { choice.plaenklerFormation: false }   # then the line breaks up
        expect:
          pa: { total: -1, result: 10, notApplied: [{ rule: SA_884, reason: "no longer in formation (SA_884.P1)" }] }
    appToday: >
      cannot be turned off: the formation is chosen once, at combat setup (CombatSetupView), and
      the combat screens receive it read-only (CombatRootView.plaenklerActive)

  - id: "14.21"
    name: Vorstoß inside a Plänkler-Formation (+1 AT)
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    round: { phase: start }
    choose: { choice.plaenklerFormation: true, choice.plaenklerFormation.bonus: at, choice.vorstoss: true }
    expect:
      at:
        total: 2
        result: 18
        lines:
          - { value: 2, from: SA_66.V1 }
          - { value: 1, from: SA_884.P2 }
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
    appToday: same, when the attack is the hero's first act of the round
