  # --- Eisern (ADV_54) and the Wundschwelle ----------------------------------------------------

  - id: "19.6"
    name: Boronmir's Wundschwelle
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rulesets: [fokus.trefferzonen]
    expect:
      wundschwelle:
        total: 9
        lines:
          - { value: 8, from: trefferzonen.TZ8 }          # ⌈KO 15 / 2⌉
          - { value: 1, from: ADV_54.E1 }
    appToday: >
      9 — right (DerivedValueFormulas.wundschwelle, ADV_54 +1). The sheet shows the total alone
      (HeroDetailView, `wundschwelle.max`): the +1 is stored as ComputedValue.bonus and Eisern is
      named nowhere

  - id: "19.7"
    name: 8 SP on the torso — the Wundschwelle without Eisern, so no Wundeffekt
    hero: { values: { sp: 8 } }
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rulesets: [fokus.trefferzonen]
    rolls: { hit.zone: torso }
    expect:
      events: []                    # no Wundeffekt check (the old `checks_first: []`)
      notApplied: [{ rule: trefferzonen, clause: TZ8, reason: "8 SP < Wundschwelle 9 (Eisern +1, ADV_54.E1)" }]
    appToday: >
      same outcome; the row says "Schaden 8 < Wundschwelle 9" (CombatWundschwelleRow) without
      naming Eisern as the reason it is 9

  - id: "19.8"
    name: 17 SP on the torso — one multiple of 9, not two of 8
    hero: { values: { sp: 17 } }
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rulesets: [fokus.trefferzonen]
    rolls: { hit.zone: torso }
    # the Wundeffekt check asked first (the old `checks_first`): Selbstbeherrschung (TAL_8)
    choose: { check.kind: talent, check.talent: TAL_8, check.application: Handlungsfähigkeit bewahren }
    gm: { gmFact.cause: woundEffect }
    expect:
      "check.modifier(talent: TAL_8)": { total: -1, lines: [{ value: -1, from: trefferzonen.TZ8, via: [ADV_54.E1] }] }
    sequence:
      - rolls: { check.result: failure }   # the old `on_failure`
        expect:
          events: [{ damage: { formula: 1W3+1 }, from: trefferzonen.TZ11 }]
    appToday: same (−1, from `wundschwelle.max`); the line does not say Eisern made it −1 rather than −2
    conflict:
      category: a
      reason: >-
        situations/trefferzonen.yaml TZ.12, TZ.13, TZ.14, boronmir-neu.yaml 19.8
        (plan-mandated: A.4 puts the gain in TZ8's `onFailure`; the owner decides whether
        TZ8 or TZ11 is the origin): expect the Wundeffekt `from: trefferzonen.TZ11` (a
        `gained` STATE_10, an item let go, the 1W3+1 SP). Under A.4 the gain, the item
        change and the torso `tell` run in trefferzonen.TZ8's `check.onFailure`, reading
        TZ11's provided tables; their origin is TZ8. The 1W3+1 SP (TZ.12, 19.8: `damage: {
        formula: 1W3+1 }`) has no dice value form and is a `tell` to the player, not a
        damage event (see "Open questions"). Task 32 (R62) compares these events; every
        remaining mismatch: TZ.12: the `damage` event is missing (the engine logs TZ8's tell
        "Wundeffekt Torso: zusätzlich 1W3+1 SP."); the check and its −2 match. TZ.13: the
        `gained` STATE_10 comes from TZ8, the one mismatch. TZ.14: (a) the `itemChanged` is
        missing: TZ8's `item: { instance: { loadout: weapon } }` changes the instance in the
        weapon slot, and the file states the Schwert there but no instance of it, so the
        engine asks for `loadout.weapon.instance` and changes nothing (as reiterkampf 5.5);
        `hit.heldInHand` (`weapon`, from `loadout.weaponHand: rechts` and `hit.side:
        rechts`) and the one-handed Schwert (R61) are no longer the reason; (b) `questions:
        []` (the old `asked: []`, which meant that the hand is not asked; it is not) asserts
        that nothing at all is asked, but the hero states neither MU nor
        Selbstbeherrschung's FW, which the Wundeffekt check's Probe needs (`attr.MU`,
        `fw.TAL_8`), nor an armour, the LE basis or the mount, so the hit's stages and the
        check ask for them (`loadout.armour`, `species.le`, `hero.purchased.le`,
        `hero.mounted`, `gmFact.mountTakesSP`, `gmFact.checkModifier`; fix round 1 gated the
        `ask`s of regeneration R6/T1, fernkampf.FK8 and zaubermodifikationen.ZM11's check
        modifiers, which asked on every query); (c) the origin, as above. 19.8: besides the
        origin and the `damage` event, `check.modifier(talent: TAL_8)` is −2 against the
        expected −1 `via: [ADV_54.E1]`: E1's +1 rests on the open ruling
        ADV_54.eisern-scope, so it applies nothing and the Wundschwelle is 8 (⌊17 / 8⌋ = 2).
      review:
        verdict: agreed
        by: "@samuelsmal"
        date: 2026-09-27

  - id: "19.9"
    name: Trefferzonen not played — 12 SP
    hero: { values: { sp: 12 } }
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rulesets: []
    expect:
      events: []                    # no Wundeffekt check (the old `checks_first: []`)
      # on the sheet (the old `sheet:`), with its note
      wundschwelle: { total: 9, lines: [{ ruling: ADV_54.eisern-scope }] }
      texts: [{ player: "wirkt nur mit Fokusregel Trefferzonen", ruling: ADV_54.eisern-scope }]
    appToday: >
      the take-damage screen says "Wundschwelle erreicht" and "Wundeffekte gibt es nur mit der
      Fokusregel Trefferzonen" (CombatWundschwelleRow); no check, which is right. The sheet shows
      Wundschwelle 9 with no note. What else is right waits on ruling eisern-scope
    conflict:
      category: a
      reason: >-
        situations/boronmir-neu.yaml 19.9: expects `wundschwelle` total 9 with `rulesets:
        []`. The Wundschwelle's derive (⌈KO/2⌉) is trefferzonen.TZ8's, and the whole file is
        `ruleset: fokus.trefferzonen`, so with the Fokusregel off only ADV_54's +1 remains.
        Pending on ADV_54's open ruling eisern-scope, which asks exactly this. Every
        mismatch the harness records (final review): (a) `wundschwelle` total 9, got 0 with
        no lines: with `rulesets: []` TZ8's derive is off, and ADV_54.E1's +1 rests on the
        open ruling eisern-scope, so it applies nothing (§4.7); (b) the expected line
        carrying `ruling: ADV_54.eisern-scope`: no line carries it, for the same reason; E1
        shows its open-ruling text instead ("Die Wundschwelle des Helden steigt durch den
        Vorteil um 1."); (c) the text `{ player: "wirkt nur mit Fokusregel Trefferzonen",
        ruling: ADV_54.eisern-scope }`: no clause tells this; it is the answer the open
        ruling would give, and the text shown for that ruling is E1's own.
      review:
        verdict: agreed
        by: "@samuelsmal"
        date: 2026-09-27

  # --- Schlechte Eigenschaft: Autoritätsglaube (DISADV_37, sid 2) -------------------------------

  - id: "19.10"
    name: The GM says Autoritätsglaube is triggered — a superior's order that makes no sense
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    gm: { gmFact.trigger: DISADV_37, gmFact.triggerModifier: 0 }
    choose: { check.kind: talent, check.talent: TAL_23 }   # Willenskraft
    expect:
      offered:
        - check: { talent: Willenskraft, application: null }
          cause: { rule: DISADV_37.SE1, option: Autoritätsglaube }
          text: "zweifelt nicht an den Worten höhergestellter Personen, selbst wenn sie unlogische Befehle erteilen oder unglaubwürdig sind"   # SE6
          ruling: DISADV_37.schlechte-eigenschaft-check
      "check.fw(talent: TAL_23)": { result: 9 }
      "check.modifier(talent: TAL_23)": { total: 0, lines: [] }
      notApplied: [{ rule: COND_1, clause: B3, reason: "Willenskraft is not hindered by Belastung (ruling COND_1.belastung-reach)" }]
    appToday: >
      nothing offers the check. The sheet lists "Schlechte Eigenschaft (Autoritätsglaube)" with the
      page behind a swipe (HeroDetailView.disadvantagesSection); a Willenskraft check opened from
      the talent list does not mention it (TalentProbeModal.hints). The not-applied Belastung is
      not listed either (as verweichlicht 13.2)
    conflict:
      category: a
      reason: >-
        situations/boronmir-neu.yaml 19.10 (Task 31): expects the Willenskraft check
        `offered` with its cause and text. DISADV_37.SE1's check is asked by the rules, not
        offered (an `offer` offers choices; no expect key holds a check the player may make,
        as lebensenergie 15.7 and 15.16), and it rests on the open ruling
        schlechte-eigenschaft-check, so it is not asked either. The queries (`check.fw` 9,
        `check.modifier` 0, COND_1.B3 not applied) match.
      review:
        verdict: backToAgent
        by: "@samuelsmal"
        date: 2026-09-27
        note: >
          That is part of the game-play. The GM says to roll a check and the player does so.

  - id: "19.11"
    name: The order comes from his Komtur — the GM makes it 2 harder — and Boronmir has Schmerz II
