id: SA_59
subgroup: spezialmanoever
ruleset: core
note: Clause 6 gates every mechanical effect here; it is GM-adjudicated because the opponent is not modelled (ADR-0005). See gmFlag opponentUsesShield in vocabulary.yaml
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Schildspalter.html
  book: US25001
  page: 249
  checked: '2026-09-21'
  hash: sha256:5067af68a00702f4d92778681fd7db7db69aa1e16b267239e8f2009b388917be
effects:
- type: reminder
  note: Clause 2 - the defensibility clause, naming a non-default defence set; GM-adjudicated, and encoded the same way as SA_62's (ADR-0005)
- type: parameterOverride
  parameter: shield.paBonus
  set: 0
  when:
  - gmFlag: opponentUsesShield
  note: Clause 3 - suppresses a named DSA constant for this attack rather than adding a modifier, which is what parameterOverride is for
- type: dice
  recipient: defenderShield
  when:
  - gmFlag: opponentUsesShield
  note: Clause 4 - redirects the attack's own damage to a non-default recipient; no dice are added, which is why add is absent
- type: reminder
  note: Clause 5 - an opponent-side outcome with no hero-side number, promoted to a reminder rather than dropped (ADR-0005, ADR-0008)
