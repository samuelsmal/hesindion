id: SA_59
subgroup: spezialmanoever
note: Schildspalter is two mechanical effects plus one GM reminder, and the whole manoeuvre only applies against an opponent who carries a shield
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Schildspalter.html
  book: US25001
  page: 249
  checked: '2026-09-21'
  hash: sha256:5067af68a00702f4d92778681fd7db7db69aa1e16b267239e8f2009b388917be
effects:
- type: parameterOverride
  parameter: shield.paBonus
  set: 0
  when:
  - gmFlag: opponentUsesShield
  note: Second clause - the shield's parry bonus cannot be used against this attack. Whether the opponent has a shield is GM-adjudicated (ADR-0005)
- type: dice
  recipient: defenderShield
  when:
  - gmFlag: opponentUsesShield
  note: Third clause - the attack's own damage is redirected to the shield's structure points, so this row adds no dice of its own
- type: reminder
  note: Destruction clause - the shield is destroyed once its structure points reach 0. Opponent-side, so the GM applies it (ADR-0005)
