id: CHAP_Reiterkampf
subgroup: none
ruleset: core
note: Chapter rules, not an ability - they bind any mounted hero, SF or not. Holds three constants the app hardcoded in Swift. SA_43 does not own the BE row; see its note
source:
  url: https://dsa.ulisses-regelwiki.de/Reiterkampf.html
  title: Reiterkampf
  book: US25001
  page: 239
  checked: '2026-09-21'
  hash: sha256:6738b2923e6ca81762c9f04efc705c6e9219050640cb6a9c379641c871f052cd
effects:
- type: modifier
  target: be
  scope: combat
  value: -1
  when:
  - mounted: true
  note: 'Clause 7 - scope is the load-bearing field here. Ruled 2026-09-21: combat domains only, so SharedModifiers.encumbrance no longer eases spellCasting/liturgyCasting'
- type: modifier
  target: aw
  scope: combat
  value: -2
  when:
  - mounted: true
  note: 'Clause 6 - the dodge half of the defence clause. UNENCODED: its stated exception turns on an unmodelled action, so this row does not carry it'
- type: modifier
  target: at
  scope: combat
  value: 2
  when:
  - mounted: true
  - gmFlag: opponentOnFoot
  note: Clause 2 - the mounted-vs-on-foot AT ease, which SA_661 raises rather than adding to. MeleeModifiers.vorteilhaftePosition gates it on golgaritenActive; opponent stance is a GM toggle (ADR-0005)
- type: reminder
  when:
  - mounted: true
  note: 'UNENCODED: clause 1, the initiative base - it reads off the mount, which is not a modelled entity'
- type: reminder
  when:
  - mounted: true
  note: 'UNENCODED: clause 3, a maneuver-slot bar. Open question: actionEconomy.forbids is an open vocabulary and could carry it, but the slots themselves live in rules.subgroup_id'
- type: reminder
  when:
  - mounted: true
  note: 'UNENCODED: clauses 4-5, legality keyed on weapon grip and shield facing. Grip is modelled (CombatView.twoHandedGripActive); facing is not, and is opponent-side (ADR-0005)'
- type: reminder
  when:
  - mounted: true
  note: 'UNENCODED: clauses 8-9 and 12, the mount-control probes and the free action - they check a talent against a mount the app does not model'
- type: reminder
  when:
  - mounted: true
  note: 'UNENCODED: clause 10, the fall check and its damage-scaled escalation - it keys on damage dealt to the mount, which is not tracked'
- type: reminder
  when:
  - mounted: true
  note: 'UNENCODED: clause 11, a Passierschlag targeting restriction - opponent-side and GM-adjudicated (ADR-0005)'
- type: reminder
  when:
  - mounted: true
  note: 'UNENCODED: clauses 13-15, the commands SA_43''s legality row unlocks - their damage and probes are the mount''s, and the mount is not modelled'
