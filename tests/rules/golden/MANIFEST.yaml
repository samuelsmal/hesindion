description: >-
  The golden corpus: the ten rules authored by hand against the live
  Regelwiki, which the LLM authoring pipeline must reproduce before it is
  trusted with the remaining 222. This file freezes them by content hash
  instead of by a second copy of the bodies (Task 4 fix round 1, Q5): a
  duplicate under tests/ could drift from specs/rules/ silently, and was
  also the one place in the repo where a `text:` key or a German comment
  would have passed CI unchecked, since `make rules-lint` globs
  specs/rules/ only.

  Each value is the SHA-256 of the authored file's bytes, so any edit to a
  golden rule fails tests/rules/test_golden.py with the remedy in the
  message. That is the intent: changing one of these files invalidates the
  pipeline's calibration and means re-running it, which should be a
  deliberate act, not a side effect.

  One carve-out, and only one: the hash covers the whole file, but the
  calibration gate does not. `test_calibration.py`'s Tier 1 grades *effect
  rows* on `TIER1_FIELDS`, with `note` explicitly excluded -- so an edit
  that touches neither cannot move a single verdict, and there is nothing
  for a re-run to re-measure. Three shapes qualify so far: `note`,
  `source.checked`, and a rule-root key that is not an effect row at all
  (`ruleset`, added by ADR-0009). Such an edit updates the hash here and
  records its reasoning under `golden_edits` in the recorded run's
  `RUN.yaml`. An edit that touches any Tier 1 field of any effect row is
  the other case, and that one does mean a live re-run.

