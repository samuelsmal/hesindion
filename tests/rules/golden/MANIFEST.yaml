description: >-
  The golden corpus: the ten rules authored by hand against the live rule
  website, which the LLM authoring pipeline must reproduce before it is
  trusted with the remaining 222. This file freezes them by content hash
  instead of by a second copy of the bodies (Task 4 fix round 1, Q5): a
  duplicate under tests/ could drift from specs/rules/ silently, and was
  also the one place in the repo where a `text:` key or a German comment
  would have passed CI unchecked, since `make rules-lint` globs
  specs/rules/ only.

  Each rule carries **two** hashes, and they answer two different questions.

  `bytes` is the SHA-256 of the authored file as it sits on disk. It freezes
  the file: any edit at all fails `tests/rules/test_golden.py` with the
  remedy in the message. That is the intent -- changing one of these files
  normally invalidates the pipeline's calibration and means re-running it,
  which should be a deliberate act, not a side effect.

  `graded` is the SHA-256 of the same file **reduced to exactly what the
  calibration gate grades**: the sorted multiset of every non-reminder effect
  row, each cut down to `test_calibration.TIER1_FIELDS` and normalised the
  way `tier1_verdict` normalises it. It is computed by
  `test_calibration.graded_digest`, which is built on `tier1_verdict`'s own
  comparison rather than reimplemented beside it, so it cannot drift from the
  gate it stands in for.

  The second hash exists because of the carve-out below. The hash covers the
  whole file, but the calibration gate does not: Tier 1 grades *effect rows*
  on `TIER1_FIELDS`, with `note` excluded, so an edit that touches neither
  cannot move a single verdict and there is nothing for a re-run to
  re-measure. The carve-out is exactly four shapes, enumerated rather than
  described by exclusion: `note`, `source.checked`, `ruleset` (added by
  ADR-0009) and `source.title` (added for chapter rules). Such an edit
  updates `bytes` here and records its reasoning under `golden_edits` in the
  recorded run's `RUN.yaml`. An edit that touches any Tier 1 field of any
  effect row is the other case, and that one does mean a live re-run.

  **A passing `graded` assertion is necessary evidence for the carve-out, not
  sufficient.** `subgroup`, `excludes` and `id` also leave `graded`
  unchanged -- `graded_digest` only ever reads the non-reminder effect rows,
  never the rule root -- and none of the three is safe to treat as note-only.
  `subgroup` selects which maneuver slot a hero may declare it in
  (`AGENTS.md`, "Maneuver slots come from `rules.subgroup_id`"); `excludes`
  is Tier 2 but mechanical, not cosmetic (`test_calibration.py`); `id` is the
  rule's own identity. An edit to any of those three still means a live
  re-run even though the `graded` assertion below stays green -- it is
  outside what this hash was built to carve out, not an instance of it.

  With only `bytes`, that carve-out rested entirely on an English
  justification: "note-only, so no re-run" and "mechanical, but I called it
  note-only" produce byte-identical evidence, and only a reader diffing the
  file against the claim could tell them apart. `graded` makes the claim
  mechanical. A genuinely note-only edit **provably cannot move it**, because
  no field it touched is an input. A mechanical edit **provably does move
  it**, however plausible the `golden_edits` prose and however carefully
  `bytes` was refreshed -- and the failure names the gate, not the file.

  So: updating `bytes` alone is the carve-out, and is cheap. Updating
  `graded` is a claim that the pipeline's reference encoding changed, and the
  only thing that may settle it is a live re-run.

