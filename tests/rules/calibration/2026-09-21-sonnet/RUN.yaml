description: >-
  The calibration gate's recorded run (Task 7). Everything in this directory is
  agent output, captured verbatim from one live pass of
  `scripts/rules_sync/propose.py` over the ten golden ids, so that
  `tests/rules/test_calibration.py` can grade the gate without spending twenty
  model calls on every `pytest` invocation. Re-recording it means re-running the
  pipeline and updating `expected` below in the same commit -- deliberately, the
  way `tests/rules/golden/MANIFEST.yaml` works.

  The `.yaml` files here are proposals, not authored rules. They are NOT a second
  copy of the corpus: they are what the pipeline produced, and they differ from
  `specs/rules/` on purpose -- that difference is the measurement.
  `test_calibration.py` lints every one of them, because `make rules-lint` globs
  `specs/rules/` only and an unlinted rule file under `tests/` is the hole Task 4
  closed once already.

command: >-
  python3 -m scripts.rules_sync.propose
  --ids SA_40,SA_41,SA_43,SA_48,SA_59,SA_62,SA_65,SA_66,SA_67,SA_661
  --model sonnet --rules-dir <scratch>/rules --proposals-dir <scratch>/proposals

run:
  date: '2026-09-21'
  model: sonnet
  rule_text_source: >-
    Hesindion/Resources/rules.db, i.e. the Optolith seed -- the production
    configuration. This is not the source the golden ten were authored from; see
    the task report for why that is the gate's headline finding.
  cli: 2.1.278 (Claude Code)
  agreement: 6 of 10
  summary_table: |
    rule    verdict       lint     status
    -------------------------------------
    SA_40   agree         ok       written
    SA_41   DISAGREE      ok       disagreement
    SA_43   agree         ok       written
    SA_48   agree         ok       written
    SA_59   DISAGREE      ok       disagreement
    SA_62   DISAGREE      1 err    lint-failed
    SA_65   agree         ok       written
    SA_66   agree         ok       written
    SA_67   agree         ok       written
    SA_661  DISAGREE      ok       disagreement

    9 written, 4 disagreement(s), 1 not written, 10 rule(s) proposed

# The Tier 1 verdict this run earned, per rule. A rule listed here as `false`
# carries the reason it failed; the gate is these ten booleans, and moving one
# of them is a claim that must be re-measured, not a test that may be edited to
# go green.
expected:
  SA_40: true
  SA_41: false
  SA_43: true
  SA_48: true
  SA_59: true
  SA_62: false
  SA_65: true
  SA_66: true
  SA_67: true
  SA_661: false

# Edits made to a golden file under specs/rules/ *after* this run was recorded,
# with the argument for why the run still stands. The default is that it does
# not: `tests/rules/golden/MANIFEST.yaml` hashes whole files, so touching one is
# normally a re-run. An entry here is a claim that the edit lies entirely
# outside what `test_calibration.py` grades, and it has to name the fields.
#
# Since 2026-09-21 that claim is also *checked*, not only argued: each golden
# rule carries a second `graded` hash in MANIFEST.yaml, taken over the file
# reduced to the Tier 1 fields of its non-reminder rows. An edit that is really
# note-only cannot move it; a mechanical edit moves it even with a refreshed
# byte hash and a plausible entry below. The prose here says *why* the edit was
# made; the hash says whether the "outside what the gate grades" part is true.
golden_edits:
  - date: '2026-09-21'
    rule: all ten
    change: >-
      A rule-root `ruleset: core` key added to every authored file, the ten
      golden ones included (ADR-0009). Every rule now declares which set it
      belongs to -- core, focus.<slug> or house.<slug> -- so the engine can
      apply only the sets a hero plays with instead of a Swift branch checking
      a flag. All ten are Regelwerk standard rules, so all ten are `core`.
    rerun_required: false
    why: >-
      `test_calibration.py`'s Tier 1 grades effect rows, field by field, against
      `TIER1_FIELDS`. `ruleset` is not in that list and is not an effect-row
      field at all: it sits at the rule root, beside `id` and `subgroup`, and the
      only root key the gate reads anywhere is `excludes`, in the Tier 2 report.
      No effect row changed, so the ten `expected` verdicts are computed from the
      same bytes as before and a re-run would spend twenty model calls to
      reproduce them. The claim is pinned rather than left here as prose:
      `test_ruleset_is_outside_what_tier_1_grades` fails if `ruleset` is ever
      added to `TIER1_FIELDS` or appears on an effect row, which is the one way
      this argument could quietly stop being true. The manifest hashes are
      updated in the same commit because the manifest freezes files, not fields.
      The recorded proposals in this directory are deliberately *not* given the
      field: they are agent output from a run that predates it, and inventing it
      for them would falsify the measurement. They are linted with
      `allow_missing_ruleset=True` instead, and the next recorded run has no
      waiver.
  - date: '2026-09-21'
    rule: SA_43
    change: >-
      Root `note` only. The removed -1 BE row was justified by three claims, two
      of which were false: the clause does exist on the rule website, and the
      app has implemented it in Swift since before the corpus existed. Removing
      the row from this file was still right, for the reason the note now gives
      -- the effect belongs to the mounted context, not to this SF -- and it is
      now authored as CHAP_Reiterkampf.
    rerun_required: false
    why: >-
      `test_calibration.py`'s Tier 1 compares effect rows on TIER1_FIELDS, which
      lists every field of the effect union *except* `note`, and the root `note`
      is not an effect row at all. No byte this edit changed is an input to any
      of the ten `expected` verdicts, so a re-run would spend twenty model calls
      to reproduce the same ten booleans. The manifest hash is updated in the
      same commit because the manifest freezes files, not fields. Had the edit
      touched `effects` -- even to add a row this note now points elsewhere for
      -- this entry would not exist and the gate would have to be re-run.

failures:
  SA_41: >-
    A genuine error, on three independent grounds; the first recording of this
    run called it a defensible modelling divergence and was wrong. (1) The
    parameter path it invents, `armor.beColumn`, appears nowhere in the corpus,
    nowhere in schema.json and in no registry -- `parameter` is a free string
    that lint.py does not validate, so an invented DSA constant lints clean and
    encodes to nothing. Hard rule 4's UNENCODED: reminder is the case for a
    constant that does not exist. (2) Its numbers are wrong under the very
    schema sentence that appeared to endorse the shape: shiftSteps is defined as
    "scaled by the effect's tier", so 2 at tier 1 and 4 at tier 2 shifts eight
    steps at Stufe II. The proposal's own note quotes this task's new
    running-total instruction as its justification, which is how that
    instruction's missing exception was found. (3) It fails on wiki text too, so
    unlike SA_62 and SA_661 it is not attributable to the input source.
  SA_62: >-
    Not written: the author reached for an actionEconomy grants token that is
    not registered in vocabulary.yaml, which the linter rejects by design. The
    underlying Tier 1 gap is different and worse -- the seed text is missing the
    Erschwernis clause the golden encodes as a modifier row, so the row cannot
    be reached from the input at all.
  SA_661: >-
    The seed text states a damage bonus where the Regelwiki states a defence
    bonus. The pipeline encodes what it was given and is wrong about the rule.
    Fed the wiki page instead, the same pipeline and the same model reproduce
    the golden encoding exactly.
