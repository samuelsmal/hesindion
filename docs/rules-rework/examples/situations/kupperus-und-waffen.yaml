# Example 18 — Kupperus and Boronmir's weapons. Same conventions as belastung.yaml.
# DRAFT FORMAT — see ../README.md.
# Open rulings named without a prefix live in ../rules/rulings.yaml or in the rule's own file.
#
# The hero is Boronmir as of the 2026-09-24 export (docs/sample_heros/Boronmir Siebenfeld von
# Greifenfurt (2026-09-24).json), in his Plattenrüstung, with the values derived as
# boronmir-neu.yaml derives them:
#   MU 14, GE 14, KK 14; Hiebwaffen 14, Schwerter 12, Schilde 10; Reiten (TAL_6) FW 12.
#   Rabenschnabel AT 16 (KtW 14 + (MU 14 − 8)/3 = 2), Langschwert AT 14 (12 + 2), before any
#   line below.
#   INI base ⌈(MU 14 + GE 14)/2⌉ = 14. GS 8 (Mensch).
#   Belastung: Plattenrüstung III, Belastungsgewöhnung II → I: −1 on foot (COND_1.B3 via
#   SA_41.G1); mounted, RK7 lowers it to 0 on Kampfproben and Reiten (ruling rk7-reiten), so
#   no Belastung line on horseback.
# Schadensbonus (L+S): +1 TP per point of the Leiteigenschaft above the weapon's threshold, from
#   the Kampftechniken page (https://dsa.ulisses-regelwiki.de/Spezielle_Nahkampfregeln/kampftechniken.html).
#   It is schaden.S3 (rules/core/schaden.yaml).
#   Rabenschnabel KK 14 → KK 14: +0. Langschwert GE/KK 15 → max(14, 14) = 14: +0. So neither
#   of his weapons gets a Schadensbonus now; 18.17 keeps the case for a hero above the
#   threshold (KK 15, Boronmir's value before 2026-09-24), where the app is still wrong.
# Kupperus (pets.PET_1, Svellttaler Kaltblut): INI 14+1W6, GS 12, KK 25, Tritt AT 15 TP 1W6+7,
#   Biss AT 12 TP 1W6+2, Niederreiten AT 15 TP 2W6+6, Mächtiger Schlag, Ruhiges Temperament.
#   The export's free-text `skills` names both ("Mächtiger Schlag, Ruhiges Temperament").
# "Fokusregel Waffeneigenschaften on" is written `rulesets: [fokus.waffeneigenschaften]`.

hero_file: "../../../sample_heros/Boronmir Siebenfeld von Greifenfurt (2026-09-24).json"
base_hero:
  abilities: { SA_41: 2, SA_43: 1, SA_661: 1 }
  armour: [Plattenrüstung]
  loadout: { weapon: Rabenschnabel, shield: Großschild }
  values: { Rabenschnabel: { at: 16 }, Langschwert: { at: 14 }, kk: 14, ini: 14, gs: 8, reiten: 12 }
mount: { name: Kupperus, profile: svellttaler-kaltblut }

situations:

  # --- Kupperus ------------------------------------------------------------------------------

  - id: "18.1"
    name: Boronmir orders Kupperus to ride down a foot soldier
    hero: { mounted: true }
    opponent: { onFoot: true, size: mittel }
    choose: { order: niederreiten, gait: galopp, runUp: 4 }
    expect:
      offered: [{ order: niederreiten, from: reiterkampf.RK13, requires: [SA_43.BK1] }]
      costs: [{ action: 1, of: hero, from: reiterkampf.RK12 }]
      checks_first:
        - talent: Reiten
          application: Kampfmanöver
          from: reiterkampf.RK12
          total: 1
          lines:
            - { value: 1, from: ruhiges-temperament.RT1, via: [svellttaler-kaltblut.SK5], ruling: svellttaler-kaltblut.mount-profile-data }
          not_applied: [{ rule: COND_1.B3, reason: "Belastung I, one lower mounted (reiterkampf.RK7, ruling rk7-reiten): none" }]
      on_check_failure:
        tell: [{ order: not carried out, nothing worse, from: reiterkampf.RK12 }]
      attack:
        by: mount
        at: { value: 15, from: svellttaler-kaltblut.SK3, via: [reiterkampf.RK13] }
        opponent_may_only: [{ defence: aw, from: reiterkampf.RK13 }]
      on_hit:
        tp: { formula: 2W6+6, from: svellttaler-kaltblut.SK3, via: [reiterkampf.RK13] }
      on_attack_success:
        tell:
          - opponent: { check: Kraftakt, on_failure: STATE_10 }
            from: maechtiger-schlag.MS1
            lines: [{ value: -3, from: maechtiger-schlag.MS2, formula: "−⌈(25 − 20)/2⌉", ruling: round-up }]
      after:
        tell: [{ mount: runs on at GS 12 to the end of the KR; turning it costs Boronmir 1 action, from: reiterkampf.RK13 }]
    app_today: >
      AT 15 and TP 2W6+6 — the AT by luck: the app reads the first attack parsed from the notes,
      Tritt, which is also 15 (18.2). AW-only note: same. Mächtiger Schlag note says −2 (Int
      division floors) — wrong. The Reiten check has no lines. Mounted, Belastung I leaves no line
      anyway, but Ruhiges Temperament is missing: total 0 instead of +1 — wrong. The export's
      `skills` names it, and the app shows it only as the ⓘ text on the attack screen. Offered
      without checking SA_43 (Boronmir has it) and without asking the run-up.

  - id: "18.2"
    name: Niederreiten on an Elenviner Vollblut — Tritt listed first with a different AT
    hero: { mounted: true }
    mount: { profile: "Elenviner Vollblut — Tritt AT 16 TP 1W6+6, Biss AT 13, Niederreiten AT 15 TP 2W6+4 (https://dsa.ulisses-regelwiki.de/Best_Elenviner_Vollblut.html)" }
    choose: { order: niederreiten, gait: galopp, runUp: 4 }
    expect:
      attack: { by: mount, at: { value: 15, from: reiterkampf.RK13 } }
      on_hit: { tp: { formula: 2W6+4, from: reiterkampf.RK13 } }
    app_today: AT 16 — wrong (CombatAttackViews.niederreitenButton takes `mount.attacks.first?.at`); TP 2W6+4 same

  - id: "18.3"
    name: Kupperus kicks (Tritt) while Boronmir rides
    hero: { mounted: true }
    opponent: { onFoot: true, size: mittel }
    choose: { order: mount_attack, attack: Tritt }
    expect:
      offered: [{ order: mount_attack, from: svellttaler-kaltblut.SK3, via: [reiterkampf.RK12], ruling: svellttaler-kaltblut.mount-own-attack }]
      costs: [{ action: 1, of: hero, instead_of: hero attack, from: reiterkampf.RK12, ruling: svellttaler-kaltblut.mount-own-attack }]
      checks_first:
        - talent: Reiten
          application: Kampfmanöver
          from: reiterkampf.RK12
          ruling: svellttaler-kaltblut.mount-own-attack
          total: 1
          lines:
            - { value: 1, from: ruhiges-temperament.RT1, via: [svellttaler-kaltblut.SK5], ruling: svellttaler-kaltblut.mount-profile-data }
          not_applied: [{ rule: COND_1.B3, reason: "Belastung I, one lower mounted (reiterkampf.RK7, ruling rk7-reiten): none" }]
      not_asked: [{ gait: galopp, runUp: 4, reason: "only Niederreiten needs them (reiterkampf.RK13)" }]
      on_check_failure:
        tell: [{ order: not carried out, nothing worse, from: reiterkampf.RK12 }]
      attack:
        by: mount
        at: { value: 15, from: svellttaler-kaltblut.SK3 }
        opponent_may_only:
          - { defence: [shieldParry, aw], from: groessenkategorie.GK4, via: [svellttaler-kaltblut.SK7] }   # a groß attacker
      on_hit:
        tp: { formula: 1W6+7, from: svellttaler-kaltblut.SK3 }
      on_attack_success:
        tell:
          - { opponent: { check: Kraftakt, modifier: -3, on_failure: STATE_10 }, from: maechtiger-schlag.MS1, ruling: round-up }
    app_today: >
      offered beside the hero's own attack, straight to the roll: no Reiten check (so no +1 from
      Ruhiges Temperament either), no action named, and Boronmir may still attack — wrong. AT 15, TP 1W6+7 same; the Mächtiger Schlag
      note says −2 — wrong

  - id: "18.4"
    name: The foot soldier parries Kupperus's Tritt with a shield, successfully
    hero: { mounted: true }
    opponent: { onFoot: true, size: mittel, defence: { kind: shieldParry, result: success } }
    choose: { order: mount_attack, attack: Tritt }
    expect:
      on_hit: { tp: none }
      tell:
        - { opponent: { check: Kraftakt, modifier: -3, on_failure: STATE_10 }, from: maechtiger-schlag.MS3, ruling: round-up }
    app_today: the note says a parry does not help — same, with −2 — wrong

  # --- Rabenschnabel -------------------------------------------------------------------------

  - id: "18.5"
    name: Rabenschnabel, Dornenspitze, on foot, against a knight in plate (RS 6)
    hero: { rulesets: [fokus.waffeneigenschaften] }
    opponent: { rs: 6, armour: worn }
    choose: { dornenspitze: true }
    expect:
      offered: [{ choice: dornenspitze, from: ITEMTPL_19.RS2 }]
      at:
        total: -2
        result: 14
        lines:
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
          - { value: -1, from: ITEMTPL_29.GR1 }
      on_hit:
        tp: { total: 0, formula: 1W6+4, not_applied: [{ rule: schaden.S3, reason: "KK 14, not above the threshold 14" }] }
        opponent:
          rs: { total: -2, result: 4, lines: [{ value: -2, from: ITEMTPL_19.RS2, ruling: [ITEMTPL_19.rabenschnabel-waffeneigenschaft, ITEMTPL_19.dornenspitze-rs] }] }
    app_today: >
      AT 15 — no Großschild −1, wrong. TP 1W6+4: same (the app never adds a Schadensbonus, and
      at KK 14 there is none; 18.17). The Dornenspitze toggle and the RS −2 note ("nur gegen RS
      6 oder mehr"): same.

  - id: "18.6"
    name: Dornenspitze against a creature with natural RS 6, and against a Kettenhemd (RS 4)
    hero: { rulesets: [fokus.waffeneigenschaften] }
    choose: { dornenspitze: true }
    sequence:
      - opponent: { rs: 6, armour: natural }
        expect:
          on_hit:
            opponent: { rs: { total: 0 } }
            not_applied: [{ rule: ITEMTPL_19.RS2, reason: "natural armour, not a Rüstung", ruling: ITEMTPL_19.dornenspitze-rs }]
      - opponent: { rs: 4, armour: worn }
        expect:
          on_hit:
            opponent: { rs: { total: 0 } }
            not_applied: [{ rule: ITEMTPL_19.RS2, reason: RS below 6 }]
    app_today: >
      the same note, "nur gegen RS 6 oder mehr", in both cases; the GM decides — same as text
      against the Kettenhemd; against natural RS 6 the note invites the −2 — wrong (it should
      read "Rüstung mit RS 6 oder mehr")

  - id: "18.7"
    name: Rabenschnabel without the Fokusregel Waffeneigenschaften
    hero: { mounted: true }
    opponent: { onFoot: true }
    expect:
      offered: []   # no Dornenspitze
      on_hit:
        tp: { total: 0, formula: 1W6+4 }   # 18.9 without its RS3 line; no Schadensbonus at KK 14
      not_applied:
        - { rule: ITEMTPL_19.RS2, reason: Fokusregel Waffeneigenschaften off, ruling: ITEMTPL_19.rabenschnabel-waffeneigenschaft }
        - { rule: ITEMTPL_19.RS3, reason: Fokusregel Waffeneigenschaften off, ruling: ITEMTPL_19.rabenschnabel-waffeneigenschaft }
        - { rule: ITEMTPL_19.RS4, reason: Fokusregel Waffeneigenschaften off, ruling: ITEMTPL_19.rabenschnabel-waffeneigenschaft }
    app_today: >
      all three always on — the app has no such Fokusregel (FokusRule): Dornenspitze offered,
      Betäubung on a Patzer — wrong. TP 1W6+5 (the RS3 +1 applied without the Fokusregel) — wrong

  - id: "18.8"
    name: Rabenschnabel, Dornenspitze, on the Sturmangriff zu Pferd
    hero: { mounted: true, rulesets: [fokus.waffeneigenschaften] }
    opponent: { onFoot: true, rs: 6, armour: worn }
    choose: { order: sturmangriffZuPferd, gait: galopp, dornenspitze: true }
    expect:
      on_hit:
        tp:
          total: 9
          formula: "1W6+4 +9"
          lines:
            - { value: 1, from: ITEMTPL_19.RS3, ruling: ITEMTPL_19.rabenschnabel-waffeneigenschaft }
            - { value: 8, from: reiterkampf.RK14, formula: "2 + 12/2" }
        opponent: { rs: { total: -2, lines: [{ value: -2, from: ITEMTPL_19.RS2, ruling: [ITEMTPL_19.rabenschnabel-waffeneigenschaft, ITEMTPL_19.dornenspitze-rs] }] } }
    app_today: TP +9 — same (RK14's 2 + 12/2 = 8 has nothing to round); the RS note same

  - id: "18.9"
    name: Rabenschnabel, mounted on Kupperus, against a foot soldier
    hero: { mounted: true, rulesets: [fokus.waffeneigenschaften] }
    opponent: { onFoot: true }
    expect:
      at:
        total: 3
        result: 19
        lines:
          - { value: 2, from: vorteilhafte-position.VP1, via: [reiterkampf.RK2] }
          - { value: 2, from: SA_661.GS1, raises: vorteilhafte-position.VP1 }
          - { value: -1, from: ITEMTPL_29.GR1 }
        not_applied: [{ rule: COND_1.B3, reason: "Belastung I, one lower for Kampfproben mounted (reiterkampf.RK7): none" }]
      on_hit:
        tp:
          total: 1
          formula: "1W6+4 +1"
          lines:
            - { value: 1, from: ITEMTPL_19.RS3, ruling: ITEMTPL_19.rabenschnabel-waffeneigenschaft }
    app_today: AT 20 (no Großschild −1) — wrong; TP 1W6+5 — same

  - id: "18.10"
    name: Rabenschnabel, confirmed Patzer on an attack
    hero: { rulesets: [fokus.waffeneigenschaften] }
    choose: { attack: confirmedFumble }
    expect:
      conditions: { COND_2: 1, lines: [{ value: 1, from: ITEMTPL_19.RS4, ruling: ITEMTPL_19.rabenschnabel-waffeneigenschaft }] }   # besides the Patzer table's result
    app_today: same (WeaponFumbleExtras), but also without the Fokusregel (18.7)

  # --- Langschwert and Großschild ------------------------------------------------------------

  - id: "18.11"
    name: Langschwert, on foot, with the Großschild on the arm
    hero: { loadout: { weapon: Langschwert, shield: Großschild } }
    expect:
      at:
        total: -2
        result: 12
        lines:
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
          - { value: -1, from: ITEMTPL_29.GR1 }
      on_hit:
        tp: { total: 0, formula: 1W6+4, not_applied: [{ rule: schaden.S3, reason: "max(GE 14, KK 14) = 14, not above 15" }] }
    app_today: AT 13 (no Großschild −1) — wrong; TP same

  - id: "18.12"
    name: GS on foot with the Großschild
    hero: { rulesets: [fokus.waffeneigenschaften] }
    expect:
      gs:
        total: -2
        result: 6
        lines:
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
          - { value: -1, from: ITEMTPL_29.GR4, ruling: ITEMTPL_19.rabenschnabel-waffeneigenschaft }
    app_today: GS 7, no Großschild line (Hero.totalGsPenalty is Belastung and armour only) — wrong with the Fokusregel on

  - id: "18.13"
    name: Same INI as an opponent without a Großschild
    hero: { rulesets: [fokus.waffeneigenschaften] }
    opponent: { ini: tie, shield: none }
    expect:
      tell: [{ order: opponent acts first, from: ITEMTPL_29.GR3, ruling: ITEMTPL_19.rabenschnabel-waffeneigenschaft }]
    app_today: not modelled

  - id: "18.14"
    name: Großschild parry against an arrow, and against a thrown spear
    hero: { rulesets: [fokus.waffeneigenschaften] }
    sequence:
      - incoming: pfeil
        expect: { pa: { lines: [{ value: 1, from: ITEMTPL_29.GR2 }] } }   # after the shield's doubled +3 (schilde)
      - incoming: wurfspeer
        expect: { not_applied: [{ rule: ITEMTPL_29.GR2, reason: not a Pfeil or Bolzen }] }
    app_today: '"+1 PA vs. Fernkampf" as the shield''s note in both cases, never added'

  # --- Kupperus's other values -----------------------------------------------------------------

  - id: "18.15"
    name: Initiative, mounted on Kupperus
    hero: { mounted: true }
    expect:
      ini_base: { value: 14, from: reiterkampf.RK1, via: [svellttaler-kaltblut.SK2] }   # Kupperus's 14+1W6
      ini_belastung: { total: 0, ruling: reiterkampf.rider-ini }
    app_today: same — 14, no Belastung (CombatSetupViews.mountBaseINI parses "14+1W6")

  - id: "18.16"
    name: What Kupperus can carry
    expect:
      mount_carrying_capacity: { value: 210, from: svellttaler-kaltblut.SK12 }
    app_today: 50 (Pet.carryingCapacity = KK × 2), added to Boronmir's own (Hero.totalCarryingCapacity) — wrong

  # --- The Schadensbonus, above the threshold ----------------------------------------------------

  - id: "18.17"
    name: Rabenschnabel in the hands of a hero with KK 15, on foot
    # Boronmir's KK was 15 until the 2026-09-24 export; at KK 14 he no longer reaches the
    # Schadensbonus (18.5), so this situation keeps the case with its own KK. It is the one
    # where the app's missing Schadensbonus shows.
    hero: { kk: 15 }
    expect:
      on_hit:
        tp: { total: 1, formula: "1W6+4 +1", lines: [{ value: 1, from: schaden.S3, formula: "KK 15 − 14" }] }
    app_today: >
      TP 1W6+4 — no Schadensbonus, wrong. OptolithImportService.parseItems does not read the
      item's `primaryThreshold` (`{ threshold: 14 }` in the hero file), and FumbleEffectResolver
      says no export carries it
