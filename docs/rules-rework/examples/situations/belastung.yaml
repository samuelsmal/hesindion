# Example 1 — Belastung. Hero + situation → the values that change, and the rule and clause
# behind every line. Ids follow ../belastung.md. DRAFT FORMAT — see ../README.md.
#
# A line is { value, from: <rule>.<clause> }, plus
#   via:    rules that changed the line without being its source (SA_41 lowers Belastung;
#           Belastung is still what costs the AT)
#   ruling: the ruling the line rests on, shown as "Auslegung" in game
# `total` is what the check or value changes by. Values not listed do not change.
# `open: <ruling>` means the expectation waits on an open ruling.
# `level(rule: COND_1)` is the Stufe of Belastung the hero acts at (after SA_41's useLevel).
#
# The armour rows (ruestung-und-belastung.A2), stated in each situation's `loadout` as
# `armour.belastung` and `armour.extraPenalty`:
#   Stoffrüstung    Belastung 1, extra 0
#   Lederrüstung    Belastung 1, extra −1
#   Kettenrüstung   Belastung 2, extra 0
#   Schuppenrüstung Belastung 2, extra −1
#   Plattenrüstung  Belastung 3, extra 0
#   Gestechrüstung  Belastung 4, extra 0
#   Turnierrüstung  Belastung 5, extra 0

hero: { values: { at: 14, pa: 8, aw: 7, fk: 10, ini: 12, gs: 8 } }

situations:

  # --- Armour alone ------------------------------------------------------------------------

  - id: "1.1"
    name: Stoffrüstung
    loadout: { armour: Stoffrüstung, armour.belastung: 1, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 1 }
      at:  { total: -1, lines: [{ value: -1, from: COND_1.B3 }] }
      pa:  { total: -1, lines: [{ value: -1, from: COND_1.B3 }] }
      aw:  { total: -1, lines: [{ value: -1, from: COND_1.B3 }] }
      ini: { total: -1, lines: [{ value: -1, from: COND_1.B3 }] }
      gs:  { total: -1, lines: [{ value: -1, from: COND_1.B3 }] }

  - id: "1.2"
    name: Lederrüstung — the page's own example
    loadout: { armour: Lederrüstung, armour.belastung: 1, armour.extraPenalty: -1 }
    expect:
      "level(rule: COND_1)": { result: 1 }
      at:  { total: -1, lines: [{ value: -1, from: COND_1.B3 }] }
      ini:
        total: -2
        lines:
          - { value: -1, from: COND_1.B3 }
          - { value: -1, from: ruestung-und-belastung.A1 }   # the extra penalty, its own line
      gs:
        total: -2
        lines:
          - { value: -1, from: COND_1.B3 }
          - { value: -1, from: ruestung-und-belastung.A1 }

  - id: "1.3"
    name: Plattenrüstung
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 3 }
      at:  { total: -3, lines: [{ value: -3, from: COND_1.B3 }] }
      ini: { total: -3, lines: [{ value: -3, from: COND_1.B3 }] }
    appToday: same

  - id: "1.4"
    name: Gestechrüstung on foot — Belastung IV
    loadout: { armour: Gestechrüstung, armour.belastung: 4, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 4 }
      events: [{ gained: STATE_8, from: COND_1.B4 }]
      legal: { actions: none }
    appToday: acts at −4 — wrong

  - id: "1.5"
    name: Turnierrüstung on foot — Belastung 5, and there is no Stufe V
    loadout: { armour: Turnierrüstung, armour.belastung: 5, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 4 }   # capped at the highest Stufe
      events: [{ gained: STATE_8, from: COND_1.B4 }]
    appToday: acts at −5 — wrong

  # --- Belastungsgewöhnung (ruling SA_41.table-shift: −1 Belastung per Stufe, extras stay) ---

  - id: "2.1"
    name: Platte, Belastungsgewöhnung I
    hero: { abilities: { SA_41: 1 } }
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 2 }
      at:  { total: -2, lines: [{ value: -2, from: COND_1.B3, via: [SA_41.G1] }] }
      ini: { total: -2, lines: [{ value: -2, from: COND_1.B3, via: [SA_41.G1] }] }

  - id: "2.2"
    name: Platte, Belastungsgewöhnung II
    hero: { abilities: { SA_41: 2 } }
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 1 }
      at:  { total: -1, lines: [{ value: -1, from: COND_1.B3, via: [SA_41.G1], ruling: SA_41.table-shift }] }
      ini: { total: -1, lines: [{ value: -1, from: COND_1.B3, via: [SA_41.G1], ruling: SA_41.table-shift }] }
    appToday: same

  - id: "2.4"
    name: Schuppe, Belastungsgewöhnung II — Belastung gone, the extra stays
    hero: { abilities: { SA_41: 2 } }
    loadout: { armour: Schuppenrüstung, armour.belastung: 2, armour.extraPenalty: -1 }
    expect:
      "level(rule: COND_1)": { result: 0 }
      at:  { total: 0 }
      ini: { total: -1, lines: [{ value: -1, from: ruestung-und-belastung.A1, ruling: SA_41.table-shift }] }
      gs:  { total: -1, lines: [{ value: -1, from: ruestung-und-belastung.A1, ruling: SA_41.table-shift }] }

  - id: "2.8"
    name: Leder, Belastungsgewöhnung II
    hero: { abilities: { SA_41: 2 } }
    loadout: { armour: Lederrüstung, armour.belastung: 1, armour.extraPenalty: -1 }
    expect:
      "level(rule: COND_1)": { result: 0 }
      at:  { total: 0 }
      ini: { total: -1, lines: [{ value: -1, from: ruestung-und-belastung.A1, ruling: SA_41.table-shift }] }
    appToday: same

  - id: "2.10"
    name: Gestech, Belastungsgewöhnung I — able to act again
    hero: { abilities: { SA_41: 1 } }
    loadout: { armour: Gestechrüstung, armour.belastung: 4, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 3 }
      events: []
      at: { total: -3, lines: [{ value: -3, from: COND_1.B3, via: [SA_41.G1] }] }

  - id: "2.11"
    name: Gestech, Belastungsgewöhnung II
    hero: { abilities: { SA_41: 2 } }
    loadout: { armour: Gestechrüstung, armour.belastung: 4, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 2 }
      at: { total: -2, lines: [{ value: -2, from: COND_1.B3, via: [SA_41.G1] }] }

  # --- Mounted (reiterkampf.RK7: Belastung −1 for Kampfproben only) -------------------------

  - id: "3.1"
    name: Platte, mounted, against another rider (so no vorteilhafte Position)
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0, hero.mounted: true }
    opponent: { onFoot: false }
    expect:
      at: { total: -2, lines: [{ value: -2, from: COND_1.B3, via: [reiterkampf.RK7] }] }
      pa: { total: -2, lines: [{ value: -2, from: COND_1.B3, via: [reiterkampf.RK7] }] }
      aw:
        total: -4
        lines:
          - { value: -2, from: COND_1.B3, via: [reiterkampf.RK7] }
          - { value: -2, from: reiterkampf.RK6 }
      gs:    { total: -3, lines: [{ value: -3, from: COND_1.B3 }] }        # not a Kampfprobe
      "check.modifier(spell: any)": { total: -3, lines: [{ value: -3, from: COND_1.B3, ruling: COND_1.belastung-reach }] }
      ini:   { total: 0, lines: [{ ruling: reiterkampf.rider-ini }] }   # the mount's base, no Belastung
    appToday: same, except the RK6 line cites no rule

  - id: "3.2"
    name: Platte, Belastungsgewöhnung II, mounted
    hero: { abilities: { SA_41: 2 } }
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0, hero.mounted: true }
    opponent: { onFoot: false }
    expect:
      at:    { total: 0 }        # Belastung I, lowered to 0 for the Kampfprobe
      gs:    { total: -1, lines: [{ value: -1, from: COND_1.B3, via: [SA_41.G1] }] }
      "check.modifier(spell: any)": { total: -1, lines: [{ value: -1, from: COND_1.B3, via: [SA_41.G1], ruling: COND_1.belastung-reach }] }

  - id: "3.3"
    name: Gestechrüstung, mounted — the jouster, without Belastungsgewöhnung
    loadout: { armour: Gestechrüstung, armour.belastung: 4, armour.extraPenalty: 0, hero.mounted: true }
    expect:
      "level(rule: COND_1)": { result: 4 }
      events: [{ gained: STATE_8, from: COND_1.B4, ruling: reiterkampf.mounted-jouster }]
      # RK7 lowers the penalty on a Kampfprobe; it does not lift Stufe IV.

  - id: "3.4"
    name: Gestechrüstung, mounted, Belastungsgewöhnung I — the jouster can act
    hero: { abilities: { SA_41: 1 } }
    loadout: { armour: Gestechrüstung, armour.belastung: 4, armour.extraPenalty: 0, hero.mounted: true }
    opponent: { onFoot: false }
    expect:
      "level(rule: COND_1)": { result: 3 }
      events: []
      at: { total: -2, lines: [{ value: -2, from: COND_1.B3, via: [SA_41.G1, reiterkampf.RK7], ruling: reiterkampf.mounted-jouster }] }

  # --- Which checks Belastung reaches (ruling COND_1.belastung-reach) -----------------------

  - id: "4.1"
    name: Klettern in Platte — a movement talent
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { check.kind: talent, check.talent: TAL_3 }   # Klettern
    expect:
      "check.modifier(talent: TAL_3)": { total: -3, lines: [{ value: -3, from: COND_1.B3, ruling: COND_1.belastung-reach }] }
    appToday: 0 — wrong

  - id: "4.2"
    name: Überreden in Platte — a speaking talent
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { check.kind: talent, check.talent: TAL_21 }   # Überreden
    expect:
      "check.modifier(talent: TAL_21)": { total: 0 }
    appToday: same

  - id: "4.3"
    name: Casting a spell in Platte
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { check.kind: spell }
    expect:
      "check.modifier(spell: any)": { total: -3, lines: [{ value: -3, from: COND_1.B3, ruling: COND_1.belastung-reach }] }
    appToday: same

  - id: "4.4"
    name: Reiten (Kampfmanöver) in Platte, mounted — relieved like a Kampfprobe
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0, hero.mounted: true }
    choose: { check.kind: talent, check.talent: TAL_6, check.application: Kampfmanöver }   # Reiten
    expect:
      "check.modifier(talent: TAL_6)": { total: -2, lines: [{ value: -2, from: COND_1.B3, via: [reiterkampf.RK7], ruling: [COND_1.belastung-reach, reiterkampf.rk7-reiten] }] }
    appToday: 0 — wrong

  - id: "4.6"
    name: Reiten in Platte, on foot (leading the horse through a river, say)
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { check.kind: talent, check.talent: TAL_6 }   # Reiten
    expect:
      "check.modifier(talent: TAL_6)": { total: -3, lines: [{ value: -3, from: COND_1.B3, ruling: COND_1.belastung-reach }] }
    appToday: 0 — wrong

  - id: "4.5"
    name: Sinnesschärfe in Platte — a talent flagged "maybe"
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    choose: { check.kind: talent, check.talent: TAL_10 }   # Sinnesschärfe
    sequence:
      - expect:
          offered: [{ choice: belastungZaehlt, default: false, from: COND_1.B3, ruling: COND_1.belastung-talents-maybe }]
          "check.modifier(talent: TAL_10)": { total: 0 }
      - choose: { choice.belastungZaehlt: true }
        expect:
          "check.modifier(talent: TAL_10)": { total: -3, lines: [{ value: -3, from: COND_1.B3, ruling: [COND_1.belastung-reach, COND_1.belastung-talents-maybe] }] }
    appToday: 0, no toggle — right only while the toggle is off

  # --- One armour (ruling ruestung-und-belastung.several-armour-pieces) --------------------

  - id: "6.1"
    name: Two armours equipped, no Trefferzonen-RS
    loadout: { armour: [Kettenrüstung, Lederrüstung] }
    expect:
      notOffered: [{ secondArmour: true, from: ruestung-und-belastung.A1, ruling: ruestung-und-belastung.several-armour-pieces }]
    appToday: both equipped, Belastung 3 and INI −4 — wrong
