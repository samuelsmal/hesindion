# Example 15 — Lebensenergie, Regeneration and Wieder-Aufstehen. Same conventions as belastung.yaml.
# DRAFT FORMAT — see ../README.md.
#
# The hero is Boronmir (docs/sample_heros/Boronmir Siebenfeld von Greifenfurt.json) unless a
# situation says otherwise:
#   species R_1 Mensch               → LE-Grundwert 5 (Spez_Menschen)
#   KO (ATTR_7) 13                   → 2 × KO = 26
#   ADV_25 Hohe Lebenskraft, tier 2  → +2
#   attr.lp (LE bought with AP) 0    → +0
#   LE = 5 + 26 + 2 + 0 = 33
# Schmerz thresholds for LE 33 (COND_6.SZ3): ¾ = 24.75, ½ = 16.5, ¼ = 8.25, and 5.
#   LP 25–33 none · 17–24 I · 9–16 II · 6–8 III · 0–5 IV (III + the "5 or fewer" Stufe)
# He also has ADV_49 Zäher Hund, ADV_44 Verbesserte Regeneration (LE) tier 2, ADV_75 Schnell
# wieder auf den Beinen; Selbstbeherrschung (TAL_8) 9, Körperbeherrschung (TAL_4) 8. In his
# Plattenrüstung with Belastungsgewöhnung I he carries Belastung II (belastung 2.1).
# No armour unless stated, so the Schmerz lines stand alone.
#
# `lp` is the current LP. `conditions` gives the Stufe the hero *has*; `acts_as` the Stufe whose
# effects apply (Zäher Hund). `regeneration` is the rolled LeP gain of one Regenerationsphase,
# with `roll` the 1W6 as rolled.

base_hero: { name: Boronmir, species: R_1, ko: 13, le: 33, at: 12, gs: 8,
             advantages: { ADV_25: 2, ADV_49: 1, ADV_44: 2, ADV_75: 1 } }

situations:

  # --- The LE maximum (lebensenergie.LE3, ADV_25.HL1) --------------------------------------------

  - id: "15.1"
    name: Boronmir's LE
    expect:
      le_max:
        total: 33
        lines:
          - { value: 5, from: lebensenergie.LE3 }          # Grundwert, Mensch
          - { value: 26, from: lebensenergie.LE3 }         # 2 × KO 13
          - { value: 2, from: ADV_25.HL1 }                 # Stufe II
          - { value: 0, from: lebensenergie.LE2 }          # none bought
    app_today: >
      33, right (OptolithImportService.computeDerivedValues, hoheLebenskraftBonus). Shown as
      "current / 33" with no breakdown (HeroDetailView.derivedValuesSection): Hohe Lebenskraft is
      stored as LifeEnergyValue.bonus but named nowhere

  - id: "15.2"
    name: A human with KO 13 and Niedrige Lebenskraft II, no Hohe Lebenskraft
    hero: { advantages: {}, disadvantages: { DISADV_28: 2 } }
    expect:
      le_max:
        total: 29
        lines:
          - { value: 31, from: lebensenergie.LE3 }         # 5 + 2 × 13
          - { value: -2, from: [lebensenergie.LE3, DISADV_28] }   # "−1 pro Stufe" (Optolith text; no rule file yet)
    app_today: 31 — Niedrige Lebenskraft is ignored (computeDerivedValues reads only ADV_25; catalog DISADV_28 todo) — wrong

  # --- Schmerz and Zäher Hund (COND_6.SZ3, SZ5; ADV_49) --------------------------------------------

  - id: "15.3"
    name: LP 25 — above three quarters
    hero: { lp: 25 }
    expect:
      conditions: {}
      at: { total: 0 }
    app_today: same

  - id: "15.4"
    name: LP 24 — Schmerz I, which Zäher Hund treats as none
    hero: { lp: 24 }
    expect:
      conditions: { COND_6: { level: 1, open: ADV_49.zaeher-hund-counts } }   # 1 under a, 0 under b
      acts_as: { COND_6: 0, from: ADV_49.ZH4 }
      at: { total: 0 }
      gs: { total: 0 }
      not_applied: [{ rule: COND_6.SZ5, because: ADV_49.ZH4 }]
    app_today: no Schmerz at all — no chip, no line, no mention of Zäher Hund outside the after-fight screen (Hero.effectiveSchmerzLevel 0)

  - id: "15.5"
    name: LP 16 — Schmerz II, acts as I
    hero: { lp: 16 }
    expect:
      conditions: { COND_6: { level: 2, open: ADV_49.zaeher-hund-counts } }
      acts_as: { COND_6: 1, from: ADV_49.ZH1 }
      at:     { total: -1, lines: [{ value: -1, from: COND_6.SZ5, via: [COND_6.SZ3, ADV_49.ZH1] }] }
      talent: { total: -1, lines: [{ value: -1, from: COND_6.SZ5, via: [ADV_49.ZH1] }] }
      gs:     { total: -1, lines: [{ value: -1, from: COND_6.SZ5, via: [ADV_49.ZH1] }] }
    app_today: >
      checks −1, labelled "Schmerz I" citing COND_6 only (StateModifiers.penaltyDefinitions reads
      the lowered level); GS 0 — wrong (Schmerz never reaches GS, example 4)

  - id: "15.6"
    name: LP 8 — Schmerz III, acts as II (the page's own example)
    hero: { lp: 8 }
    expect:
      conditions: { COND_6: { level: 3, open: ADV_49.zaeher-hund-counts } }
      acts_as: { COND_6: 2, from: ADV_49.ZH1 }
      at: { total: -2, lines: [{ value: -2, from: COND_6.SZ5, via: [ADV_49.ZH1] }] }
      gs: { total: -2, lines: [{ value: -2, from: COND_6.SZ5, via: [ADV_49.ZH1] }] }
    app_today: checks −2 ("Schmerz II"); GS 0 — wrong

  - id: "15.7"
    name: LP 5 — Schmerz IV, Handlungsunfähig nevertheless
    hero: { lp: 5 }
    expect:
      conditions: { COND_6: 4 }
      states: { handlungsunfaehig: { from: COND_6.SZ5, via: [ADV_49.ZH3] } }
      offered:
        - { check: { talent: Selbstbeherrschung, application: Handlungsfähigkeit bewahren, fw: 9, attributes: [MU 14, MU 14, KO 13] },
            from: COND_6.SZ2, open: COND_6.schmerz-iv-check }
      after_check_passed:
        acts_as: { COND_6: 3, open: ADV_49.zaeher-hund-iv }    # III under a; IV under b
        at: { open: ADV_49.zaeher-hund-iv }                    # −3 under a, −4 under b
    app_today: Handlungsunfähig outright, no Selbstbeherrschung check (StateCatalog schmerz handlungsunfaehigAtLevel 4; Hero.effectiveSchmerzLevel skips Zäher Hund at IV) — wrong for the check (example 4)

  - id: "15.8"
    name: In Plattenrüstung, LP 8, and Betäubung III from a blow — eight Stufen?
    hero: { lp: 8, armour: [Plattenrüstung], abilities: { SA_41: 1 }, states: [{ COND_2: 3 }] }
    expect:
      conditions: { COND_1: 2, COND_6: 3, COND_2: 3 }
      states: { handlungsunfaehig: { from: zustaende.Z5, open: ADV_49.zaeher-hund-counts } }
      # Under a: 2 + 3 + 3 = 8 Stufen → Handlungsunfähig. Under b: 2 + 2 + 3 = 7 → not.
      at_if_able_to_act:
        total: -5
        lines:
          - { value: -2, from: COND_1.B3, via: [SA_41.G1] }
          - { value: -2, from: COND_6.SZ5, via: [ADV_49.ZH1] }
          - { value: -3, from: COND_2 }
          - { value: 2, from: zustaende.Z3 }               # −7 capped at −5
    app_today: >
      able to act at AT −5: Hero.totalZustandLevels counts the lowered Schmerz (7 Stufen), which
      is option b of the ruling

  # --- Regeneration (regeneration.R4–R7, T1; ADV_44.VR1) -------------------------------------------

  - id: "15.9"
    name: A night in a good inn from LP 8
    hero: { lp: 8 }
    choose: { environment: ruhig, t1: [gute-unterkunft], roll: 3 }
    expect:
      regeneration:
        total: 6
        lines:
          - { value: 3, from: regeneration.R4 }            # 1W6
          - { value: 1, from: regeneration.T1 }            # Gute Unterkunft
          - { value: 2, from: ADV_44.VR1, ruling: ADV_44.vr-scope }
      after: { lp: 14, conditions: { COND_6: 2 }, acts_as: { COND_6: 1 } }   # healed above ¼: Schmerz III → II
    app_today: >
      same number if the player steps the modifier to +1 by hand (RegenerierenSheet.userModifier);
      the +2 is shown as "Verbesserte Regeneration +2", the inn line has no name

  - id: "15.10"
    name: A wet, cold camp from LP 20
    hero: { lp: 20 }
    choose: { environment: "unruhig, nass oder kalt", roll: 3 }
    expect:
      regeneration:
        open: ADV_44.vr-halving
        # a: (3 + 2) / 2 = 2.5 → 3 (round-up) → LP 23
        # b: 3 / 2 = 1.5 → 2, + 2 → 4 → LP 24
        lines:
          - { value: 3, from: regeneration.R4 }
          - { value: 2, from: ADV_44.VR1 }
          - { halve: true, from: regeneration.R6, ruling: round-up }
    app_today: 5 → LP 25 unless the player works out the halving and enters it as a modifier; the sheet has no environment — wrong

  - id: "15.11"
    name: Tied to his horse's back overnight
    hero: { lp: 20 }
    choose: { environment: "Sturm, auf ein Pferd gebunden" }
    expect:
      regeneration: { total: 0, lines: [{ set: 0, from: regeneration.R6 }] }
      not_applied: [{ rule: ADV_44.VR1, because: regeneration.R6 }]   # he does not regenerate
    app_today: the sheet rolls 1W6 + 2 regardless — wrong

  - id: "15.12"
    name: Vergiftet
    hero: { lp: 20, states: [STATE_15] }
    expect:
      regeneration: { total: 0, lines: [{ set: 0, from: regeneration.R7 }] }
      not_applied: [{ rule: ADV_44.VR1, because: regeneration.R7 }]
      told: [{ player: "Heilkräuter wirken dennoch.", from: regeneration.R7 }]
    app_today: >
      the sheet rolls 1W6 + 2 regardless; only the Vergiftet chip's text says "keine normale
      Regeneration" (Strings state.vergiftet.effect) — wrong

  - id: "15.13"
    name: A bad camp and a long interruption, rolling 1
    hero: { lp: 20 }
    choose: { environment: ruhig, t1: [schlechter-lagerplatz, laengere-unterbrechung], roll: 1 }
    expect:
      regeneration:
        total: 0
        lines:
          - { value: 1, from: regeneration.R4 }
          - { value: -1, from: regeneration.T1 }
          - { value: -2, from: regeneration.T1 }
          - { value: 2, from: ADV_44.VR1 }
    app_today: same if the player enters −3 (the sheet floors at 0 like R4)

  - id: "15.14"
    name: Near the maximum
    hero: { lp: 31 }
    choose: { environment: ruhig, roll: 5 }
    expect:
      regeneration: { total: 7 }
      after: { lp: 33, from: regeneration.R5 }
    app_today: same (RegenerierenSheet.newLE caps at the maximum)

  - id: "15.15"
    name: Another hero with Verbesserte Regeneration III
    hero: { advantages: { ADV_44: 3 } }
    choose: { environment: ruhig, roll: 4 }
    expect:
      regeneration: { total: 7, lines: [{ value: 4, from: regeneration.R4 }, { value: 3, from: ADV_44.VR1 }] }
    app_today: 6 — Hero.verbessertRegenerationLEBonus stops at +2 ("+2 at tier II") — wrong

  # --- Standing up, and what Schnell wieder auf den Beinen really does ----------------------------

  - id: "15.16"
    name: Boronmir stands up from Liegend with an opponent in reach
    hero: { states: [STATE_10] }
    opponent: { inReach: true }
    expect:
      offered:
        - { action: aufstehen, from: STATE_10.L4, costs: action }
        - { check: { talent: Körperbeherrschung, application: Kampfmanöver, fw: 8, attributes: [GE 14, GE 14, KO 13] },
            from: STATE_10.L4, optional: true }
      not_applied: [{ rule: ADV_75, because: "betrifft nur Betäubung und Berauscht (ADV_75.SW1)" }]
    app_today: no stand-up action; the player removes Liegend by hand (liegend 7.6). Not wrong about ADV_75, which the app ignores (catalog todo)

  - id: "15.17"
    name: Betäubung II after a night of Premer Feuer
    hero: { states: [{ COND_2: 2, cause: alcohol }] }
    expect:
      told: [{ player: "Jede Stufe Betäubung baut sich nach 1½ Stunden Ruhe ab (statt 3).", from: ADV_75.SW1 }]
    app_today: the chip says 3 hours (Strings state.betaeubung.removal); ADV_75 ignored — wrong

  - id: "15.18"
    name: Berauscht III
    hero: { states: [{ COND_9: 3 }] }
    expect:
      told: [{ player: "Berauscht baut sich jede Stunde um 1 Stufe ab (statt alle 2), wenn er nichts mehr trinkt.", from: ADV_75.SW1 }]
    app_today: the chip says 2 hours (Strings state.berauscht.removal) — wrong

  - id: "15.19"
    name: Betäubung II from a blow to the head
    hero: { states: [{ COND_2: 2, cause: blow }] }
    expect:
      told: { open: ADV_75.alcohol-scope }      # 3 h per Stufe under a, 1½ h under b
    app_today: 3 hours
