# Example 11 — Beidhändiger Kampf. Same conventions as belastung.yaml.
# DRAFT FORMAT — see ../README.md.
#
# `at(with: mainHand)` / `at(with: offHand)` is the first / second roll of a double attack, or a
# single attack with that hand; `pa(with: mainHand)` / `pa(with: offHand)` names the hand the
# parry is made with. The query's `with:` is the action's `action.with`.
# The loadout: `weapon` is the main hand; `other` is the kind of the second piece (a weapon, a
# Parierwaffe or a shield) and `other.technique` its Kampftechnik (the old `main:` / `off:`).
# The double attack is `choice.doubleAttack` (the old `action: doubleAttack`); making it sets the
# round fact `round.doubleAttack`, stated beside it.
#
# The weapons (the old file-level `weapons` table):
#   Schwert      Schwerter (CT_12)     AT 14, PA 8
#   Dolch        Dolche (CT_3)         AT 13, PA 6
#   Morgenstern  Kettenwaffen (CT_6)   AT 12, PA 5
#   Holzschild   Schilde (CT_10)       AT 10, PA 9

hero: { values: { at: 14, pa: 8, aw: 7, ini: 12, gs: 8 } }

situations:

  - id: "11.1"
    name: Two weapons, one attack — no penalty
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    choose: { action.with: mainHand }         # a single attack with the main hand (the old `action: singleAttack`)
    round: { doubleAttack: false }
    expect:
      at: { total: 0 }
      notApplied:
        - { rule: beidhaendiger-kampf, clause: ZW3, reason: only one weapon attacks this round }
    appToday: same

  - id: "11.2"
    name: Double attack, no SF, no Beidhändig — the page's own example
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    choose: { choice.doubleAttack: true }
    round: { doubleAttack: true }
    expect:
      "at(with: mainHand)": { total: -2, lines: [{ value: -2, from: beidhaendiger-kampf.ZW3 }] }
      "at(with: offHand)":
        total: -6
        lines:
          - { value: -2, from: beidhaendiger-kampf.ZW3 }
          - { value: -4, from: beidhaendiger-kampf.ZW4 }
    appToday: same

  - id: "11.3"
    name: Defending later in the round of a double attack
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    round: { doubleAttack: true }               # done earlier this round
    expect:
      "pa(with: mainHand)": { total: -2, lines: [{ value: -2, from: beidhaendiger-kampf.ZW3 }] }
      "pa(with: offHand)":
        total: -6
        lines:
          - { value: -2, from: beidhaendiger-kampf.ZW3 }
          - { value: -4, from: beidhaendiger-kampf.ZW4 }
      aw: { total: -2, lines: [{ value: -2, from: beidhaendiger-kampf.ZW3 }] }
      offered: [{ choice: parryWith, options: [mainHand, offHand], from: beidhaendiger-kampf.ZW7 }]
    appToday: same

  - id: "11.4"
    name: Beidhändiger Kampf II and Beidhändig — a double attack at no cost
    hero: { abilities: { SA_42: 2 }, advantages: { ADV_5: 1 } }
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    choose: { choice.doubleAttack: true }
    round: { doubleAttack: true }
    expect:
      "at(with: mainHand)":
        total: 0
        lines:
          - { value: -2, from: beidhaendiger-kampf.ZW3 }
          - { value: 2, from: SA_42.BH1 }                                  # raises ZW3
      "at(with: offHand)":
        total: 0
        lines:
          - { value: -2, from: beidhaendiger-kampf.ZW3 }
          - { value: 2, from: SA_42.BH1 }                                  # raises ZW3
        notApplied:
          - { rule: beidhaendiger-kampf, clause: ZW4, reason: removed by ADV_5.V2 }
      aw:
        total: 0
        lines:
          - { value: -2, from: beidhaendiger-kampf.ZW3 }
          - { value: 2, from: SA_42.BH1, ruling: SA_42.sa42-dodge }        # raises ZW3
    appToday: AT 0 / 0, AW 0

  - id: "11.4b"
    name: Beidhändiger Kampf I, no Beidhändig
    hero: { abilities: { SA_42: 1 } }
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    choose: { choice.doubleAttack: true }
    round: { doubleAttack: true }
    expect:
      "at(with: mainHand)": { total: -1 }
      "at(with: offHand)":  { total: -5 }
    appToday: same

  - id: "11.5"
    name: A parry earlier in the round, before the double attack
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    round: { doubleAttack: false }              # the parry comes first, then the double attack
    expect:
      "pa(with: mainHand)": { total: 0 }
      notApplied:
        - { rule: beidhaendiger-kampf, clause: ZW3, reason: the parry came before the double attack, ruling: beidhaendiger-kampf.zw3-earlier-defences }
    appToday: same

  - id: "11.6"
    name: Parrying with the off-hand weapon, no double attack this round
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    choose: { choice.parryWith: offHand }
    round: { doubleAttack: false }
    expect:
      "pa(with: offHand)": { total: -4, lines: [{ value: -4, from: beidhaendiger-kampf.ZW4 }] }
    appToday: same

  - id: "11.7"
    name: What a double attack may carry
    hero: { abilities: { SA_48: 1, SA_67: 1, SA_66: 1, SA_59: 1 } }
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    choose: { choice.doubleAttack: true }
    round: { doubleAttack: true }
    expect:
      offered:
        - { choice: finte, kind: basismanoever }
        - { choice: wuchtschlag, kind: basismanoever }
      notOffered:
        - { choice: vorstoss, because: beidhaendiger-kampf.ZW6 }
        - { choice: schildspalter, because: beidhaendiger-kampf.ZW6 }
    appToday: offers Vorstoß and Schildspalter too — wrong (CombatAttackViews.availableManeuvers)

  - id: "11.8"
    name: A Patzer on the first attack of a double attack
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch
    choose: { choice.doubleAttack: true }
    round: { doubleAttack: true }
    rolls: { roll.firstAttack: patzer }          # the main hand's roll
    expect:
      "at(with: offHand)": { legal: { allowed: false, because: beidhaendiger-kampf.ZW8 } }   # the old `cancelled`
    appToday: same (CombatExecutionView, "fumbleSecondLost")

  - id: "11.9"
    name: Fist and fist, or weapon and fist
    hero: { abilities: { SA_42: 1 } }
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_9 }   # main hand Schwert, off hand Raufen
    choose: { choice.doubleAttack: true }
    round: { doubleAttack: true }
    expect:
      offered: [{ choice: doubleAttack, from: beidhaendiger-kampf.ZW2, ruling: beidhaendiger-kampf.raufen-double-attack }]
      "at(with: mainHand)":
        total: -1
        lines:
          - { value: -2, from: beidhaendiger-kampf.ZW3 }
          - { value: 1, from: SA_42.BH1 }                                  # raises ZW3
      "at(with: offHand)":              # the fist
        total: -5
        lines:
          - { value: -2, from: beidhaendiger-kampf.ZW3 }
          - { value: 1, from: SA_42.BH1 }                                  # raises ZW3
          - { value: -4, from: beidhaendiger-kampf.ZW4 }
    appToday: not selectable — Raufen takes both hands (CombatLoadoutPicker.canSelect) — wrong

  - id: "11.10"
    name: A Kettenwaffe with a second weapon, and with a shield
    loadout: { weapon: Morgenstern, weapon.technique: CT_6 }   # the header's Kettenwaffen (R61)
    expect:
      # the old `not_selectable` / `selectable`: which piece may go in the off hand
      legal: { loadout: [{ other: Dolch, allowed: false, because: beidhaendiger-kampf.ZW1 }, { other: Holzschild, allowed: true }] }
    appToday: the Dolch is selectable — wrong (CombatLoadoutPicker.canSelect)

  - id: "11.11"
    name: Weapon and shield — attacking with the shield, parrying with it
    loadout: { weapon: Schwert, shield: Holzschild, other: shield, other.technique: CT_10 }   # main hand Schwert, off hand Holzschild
    choose: { choice.doubleAttack: true }
    round: { doubleAttack: true }
    expect:
      offered: [{ choice: doubleAttack, from: beidhaendiger-kampf.ZW2 }]
      "at(with: offHand)":              # the shield attack
        total: -6
        lines:
          - { value: -2, from: beidhaendiger-kampf.ZW3 }
          - { value: -4, from: beidhaendiger-kampf.ZW4 }
      "pa(with: shield)": { total: 0 }  # ZW3 and ZW4 both exclude the shield defence
    appToday: no double attack with a shield, and no shield attack at all — missing

  - id: "11.12"
    name: Which weapon is in the off hand
    loadout: { weapon: Schwert, other: weapon, other.technique: CT_3 }   # main hand Schwert, off hand Dolch   # chosen: Schwert and Dolch; the player says the Schwert is the main hand
    choose: { choice.doubleAttack: true }
    round: { doubleAttack: true }
    expect:
      "at(with: offHand)": { total: -6 }   # the Dolch (the old `weapon: Dolch`: the off hand is the Dolch, stated in the loadout)
    appToday: >
      the Dolch is the main hand and the Schwert takes the −4 — CombatLoadoutPicker.apply sorts
      the chosen names and makes the first non-shield one the main weapon — wrong
