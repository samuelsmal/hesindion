# Example 9 — Wuchtschlag. Same conventions as belastung.yaml. DRAFT FORMAT — see ../README.md.
# Weapons: Schwert (Schwerter, CT_12, 1W6+4), Dolch (Dolche, CT_3, 1W6+1).
# Open rulings named without a prefix live in ../rules/rulings.yaml once added.

base_hero: { at: 14, pa: 8, aw: 7 }

situations:

  - id: "9.1"
    name: Wuchtschlag I with a Schwert, hits
    hero: { abilities: { SA_67: 1 }, loadout: { weapon: Schwert } }
    choose: { manoeuvre: wuchtschlag, tier: 1 }
    expect:
      at: { total: -2, lines: [{ value: -2, from: SA_67.W1, tier: 1 }] }
      on_hit:
        tp: { total: 2, lines: [{ value: 2, from: SA_67.W1, tier: 1 }], formula: "1W6+4 +2" }
    app_today: same

  - id: "9.2"
    name: Wuchtschlag III, used at III
    hero: { abilities: { SA_67: 3 }, loadout: { weapon: Schwert } }
    choose: { manoeuvre: wuchtschlag, tier: 3 }
    expect:
      at: { total: -6, lines: [{ value: -6, from: SA_67.W1, tier: 3 }] }
      on_hit:
        tp: { total: 6, lines: [{ value: 6, from: SA_67.W1, tier: 3 }] }
    app_today: same

  - id: "9.3"
    name: Wuchtschlag III, the player chooses II
    hero: { abilities: { SA_67: 3 }, loadout: { weapon: Schwert } }
    choose: { manoeuvre: wuchtschlag, tier: 2 }
    expect: { open: tiered-manoeuvre-stufe }   # under a: AT −4, TP +4
    app_today: offered — AT −4, TP +4 (every Stufe up to the owned one is on the list)

  - id: "9.4"
    name: Wuchtschlag misses
    hero: { abilities: { SA_67: 1 }, loadout: { weapon: Schwert } }
    choose: { manoeuvre: wuchtschlag, tier: 1 }
    expect:
      at: { total: -2 }
      on_miss: { tp: none }
    app_today: same

  - id: "9.5"
    name: Wuchtschlag with a Dolch (Dolche — not on Wuchtschlag's list)
    hero: { abilities: { SA_67: 1 }, loadout: { weapon: Dolch } }
    expect: { open: sf-technique-lists }    # under a: not offered, SA_67.W3
    app_today: offered (the catalog note on SA_67 says so on purpose, pending issue #14)

  - id: "9.6"
    name: Wuchtschlag unarmed (Raufen — on the list)
    hero: { abilities: { SA_67: 1 }, loadout: { weapon: null } }
    choose: { manoeuvre: wuchtschlag, tier: 1 }
    expect:
      at: { total: -2, lines: [{ value: -2, from: SA_67.W1, tier: 1 }] }
      on_hit:
        tp: { total: 2, lines: [{ value: 2, from: SA_67.W1, tier: 1 }], formula: "1W6 +2" }
    app_today: same

  - id: "9.7"
    name: Wuchtschlag on horseback
    hero: { abilities: { SA_67: 1 }, loadout: { weapon: Schwert }, mounted: true }
    expect:
      offered: [{ manoeuvre: wuchtschlag, from: SA_67.W1 }]   # a Basismanöver: reiterkampf.RK3 allows it
    app_today: same

  - id: "9.8"
    name: Wuchtschlag together with Sturmangriff
    hero: { abilities: { SA_67: 1, SA_62: 1 }, loadout: { weapon: Schwert } }
    expect: { open: manoeuvre-combination }   # see sturmangriff 10.6 for the numbers
    app_today: one manoeuvre per attack; SA_62 not offered on foot
