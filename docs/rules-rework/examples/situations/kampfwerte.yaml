# Example 16 — Kampfwerte, Schaden und Schilde. Same conventions as belastung.yaml.
# DRAFT FORMAT — see ../README.md.
# Open rulings named without a prefix live in ../rules/rulings.yaml or in the rule's own file.
#
# The hero is Boronmir as of his 2026-09-24 export (docs/sample_heros/Boronmir Siebenfeld von
# Greifenfurt (2026-09-24).json). The UI-test copy Hesindion/Resources/UITestHero.json is still
# the earlier sheet (KO 13, KK 15, Hiebwaffen 12, Schilde 9). From `attr.values`:
#   ATTR_1 MU 14, ATTR_2 KL 12, ATTR_3 IN 13, ATTR_4 CH 13, ATTR_5 FF 11, ATTR_6 GE 14,
#   ATTR_7 KO 15, ATTR_8 KK 14.
# From `ct`: CT_5 Hiebwaffen 14, CT_12 Schwerter 12, CT_10 Schilde 10, CT_9 Raufen 10,
#   CT_3 Dolche 8.
# Attribute bonuses (kampfwerte.KW1/KW2: "jeweils 3 volle Punkte über 8"):
#   MU 14 → +2, GE 14 → +2, KK 14 → +2, FF 11 → +1.
# Weapons (rules/equipment/): Rabenschnabel ITEMTPL_19 (Hiebwaffen, 1W6+4, KK 14, 0/−1),
#   Langschwert ITEMTPL_35 (Schwerter, 1W6+4, GE/KK 15, 0/0), Großschild ITEMTPL_29 (Schilde,
#   1W6+1, KK 16, −6/+3, and −1 AT on the main weapon, GR1).
# Plattenrüstung RS 6, Belastung III; Belastungsgewöhnung II (SA_41) → Belastung I (belastung,
# the SA_41: 2 situations).
# LE 37: Menschen 5 + 2 × KO 15 + Hohe Lebenskraft II 2 (lebensenergie.LE3, ADV_25).
# KK 14 is not above the Rabenschnabel's Schadensschwelle 14, so none of his weapons gets a
# Schadensbonus; 16.22 keeps the Schadensbonus with a hero whose KK is above it.
#
# Unless a situation says otherwise: on foot, no armour, no Zustände, Fokusregel
# Waffeneigenschaften off (the Großschild's GR2–GR4 are example 18's). `result` is the value
# the check is rolled against; `total` the sum of the lines below the base; `base` the base.
# `pa(with: weapon)` is the weapon parry (with the passive shield bonus), `pa(with: shield)` the
# active shield parry. A line's label (the old `term`, `formula`, `item`) is a comment beside it.

heroFile: "../../../sample_heros/Boronmir Siebenfeld von Greifenfurt (2026-09-24).json"
hero:
  attributes: { MU: 14, KL: 12, IN: 13, CH: 13, FF: 11, GE: 14, KO: 15, KK: 14 }
  techniques: { Hiebwaffen: 14, Schwerter: 12, Schilde: 10, Raufen: 10, Dolche: 8 }
  # no armour unless a situation's loadout says so

situations:

  # --- The sheet -----------------------------------------------------------------------------

  - id: "16.1"
    name: Boronmir's technique values on the sheet
    expect:
      # Hiebwaffen: AT 14 + 2 = 16; PA ⌈14/2⌉ 7 + KK 14 → 2 = 9
      "at(with: Hiebwaffen)":
        result: 16
        lines:
          - { value: 14, from: kampfwerte.KW1 }                          # KtW
          - { value: 2, from: kampfwerte.KW1 }                           # MU 14
      "pa(with: Hiebwaffen)":
        result: 9
        lines:
          - { value: 7, from: kampfwerte.KW2 }                           # KtW 14 halbiert
          - { value: 2, from: kampfwerte.KW2, via: [kampfwerte.KW6] }    # KK 14
      # Schwerter: AT 14; PA 6 + max(GE 14, KK 14) → 2 = 8 (a tie; either gives +2)
      "at(with: Schwerter)": { result: 14 }
      "pa(with: Schwerter)":
        result: 8
        lines:
          - { value: 6, from: kampfwerte.KW2 }
          - { value: 2, from: kampfwerte.KW2, via: [kampfwerte.KW6, kampfwerte.KW7] }   # GE/KK 14
      # Schilde: AT 10 + 2 = 12; PA ⌈10/2⌉ 5 + KK 2 = 7
      "at(with: Schilde)": { result: 12 }
      "pa(with: Schilde)":
        result: 7
        lines:
          - { value: 5, from: kampfwerte.KW2 }                           # KtW 10 halbiert
          - { value: 2, from: kampfwerte.KW2 }                           # KK 14
      # Raufen: AT 10 + 2 = 12; PA 5 + max(GE 14, KK 14) → 2 = 7
      "at(with: Raufen)": { result: 12 }
      "pa(with: Raufen)": { result: 7 }
      # Dolche: AT 8 + 2 = 10; PA 4 + GE 14 → 2 = 6
      "at(with: Dolche)": { result: 10 }
      "pa(with: Dolche)": { result: 6 }
    appToday: >
      same numbers (OptolithImportService.parseCombatTechniques), stored once at import as a
      single number each (CombatTechnique.at/pa): no breakdown, never recomputed

  - id: "16.2"
    name: Ausweichen and the INI Basiswert
    expect:
      aw: { result: 7, lines: [{ value: 7, from: kampfwerte.KW3 }] }            # GE 14 / 2
      iniBase: { result: 14, lines: [{ value: 14, from: kampfwerte.KW9 }] }     # (MU 14 + GE 14) / 2
    appToday: same (DerivedValueFormulas.ausweichen, .initiative); one number each, no breakdown

  # --- Weapons alone -------------------------------------------------------------------------

  - id: "16.3"
    name: Rabenschnabel, no shield
    loadout: { weapon: Rabenschnabel }
    expect:
      at: { result: 16, base: { value: 16, from: kampfwerte.KW1 } }
      pa:
        result: 8
        base: { value: 9, from: kampfwerte.KW2 }
        lines: [{ value: -1, from: at-pa-modifikatoren.M1, via: [ITEMTPL_19.RS0] }]
      tp: { total: 0, notApplied: [{ rule: schaden, clause: S3, reason: "KK 14, not above 14" }] }   # on a hit: 1W6+4
    appToday: >
      AT 16, PA 8 — same, but the −1 is folded into the weapon's stored PA
      (OptolithImportService.parseItems) with no line; TP 1W6+4 — right, but only because KK 14
      is not above the threshold: the app never computes a Schadensbonus (16.22), and the
      not-applied one is not shown

  - id: "16.4"
    name: Langschwert, no shield
    loadout: { weapon: Langschwert }
    expect:
      at: { result: 14 }
      pa: { result: 8 }
      tp: { total: 0, notApplied: [{ rule: schaden, clause: S3, reason: "max(GE 14, KK 14) = 14, not above 15" }] }   # on a hit: 1W6+4
    appToday: same (the not-applied Schadensbonus is not shown)

  # --- With the Großschild -------------------------------------------------------------------

  - id: "16.5"
    name: Langschwert and Großschild — the two parries
    loadout: { weapon: Langschwert, shield: Großschild, other: shield }
    choose: { action.defence: parry }        # the defence screen, before a parry is picked
    expect:
      offered:
        - defence: weaponParry
          result: 11
          base: { value: 8, from: kampfwerte.KW2 }
          lines: [{ value: 3, from: schilde.SCH1 }]                     # Großschild
        - defence: shieldParry
          result: 13
          base: { value: 7, from: schilde.SCH3, via: [kampfwerte.KW2] }     # the Schilde PA
          lines: [{ value: 6, from: schilde.SCH3, formula: "2 × 3" }]
    appToday: >
      11 and 13 — same numbers, but neither shows where it comes from: the passive +3 is added
      to the base (CombatAttackViews weapon list, w.pa + hero.passiveShieldPABonus) and the
      doubled +6 is baked into Shield.pa at import (basePA + 2 * paMod)

  - id: "16.6"
    name: Langschwert and Großschild — attacking with the Langschwert
    loadout: { weapon: Langschwert, shield: Großschild, other: shield }
    expect:
      at: { result: 13, lines: [{ value: -1, from: ITEMTPL_29.GR1 }] }
    appToday: AT 14 — wrong (no Großschild −1; example 18, 18.11)

  - id: "16.7"
    name: Rabenschnabel and Großschild
    loadout: { weapon: Rabenschnabel, shield: Großschild, other: shield }
    expect:
      at: { result: 15, lines: [{ value: -1, from: ITEMTPL_29.GR1 }] }
      "pa(with: weapon)": { result: 11, lines: [{ value: -1, from: at-pa-modifikatoren.M1 }, { value: 3, from: schilde.SCH1 }] }
      "pa(with: shield)": { result: 13, lines: [{ value: 6, from: schilde.SCH3 }] }
      tp: { total: 0, notApplied: [{ rule: schaden, clause: S3, reason: "KK 14, not above 14" }] }   # on a hit: 1W6+4
    appToday: AT 16 — wrong; PA 11 and 13 — same; TP 1W6+4 — same

  - id: "16.8"
    name: Attacking with the Großschild
    loadout: { weapon: Langschwert, shield: Großschild, other: shield }
    choose: { action.with: Großschild }
    expect:
      offered: [{ attack: shield, from: schilde.SCH2 }]
      at:
        result: 6
        base: { value: 12, from: kampfwerte.KW1, technique: Schilde }
        lines: [{ value: -6, from: at-pa-modifikatoren.M1, via: [ITEMTPL_29.GR0] }]
        notApplied: [{ rule: ITEMTPL_29, clause: GR1, reason: "the shield is not the Hauptwaffe" }]
      tp: { total: 0, notApplied: [{ rule: schaden, clause: S3, reason: "KK 14, not above 16" }] }   # on a hit: 1W6+1
    appToday: AT 6, TP 1W6+1 — same (the shield row of the weapon list); the −6 has no line

  - id: "16.9"
    name: An arrow comes at him — Langschwert and Großschild
    loadout: { weapon: Langschwert, shield: Großschild, other: shield }
    gm: { gmFact.incomingAttack: ranged, gmFact.incomingMissile: pfeil }
    expect:
      offered:
        - { defence: shieldParry, result: 13, from: schilde.SCH6 }   # +1 with the Fokusregel: ITEMTPL_29.GR2, 18.14
        - { defence: aw, result: 7 }
      notOffered:
        - { defence: weaponParry, because: schilde.SCH8 }
    appToday: >
      the weapon parry (11, with the passive +3) is offered as well — wrong: the defence screen
      never asks whether the attack is a ranged one (CombatDefenseSetupView, OpponentProfile has
      no such fact), so SCH8 cannot apply. Without a shield the hero can parry an arrow with his
      sword, which SCH9 rules out too

  # --- In armour -----------------------------------------------------------------------------

  - id: "16.10"
    name: Langschwert and Großschild, in the Plattenrüstung
    hero: { abilities: { SA_41: 2 } }
    loadout: { weapon: Langschwert, shield: Großschild, other: shield, armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    expect:
      "level(rule: COND_1)": { result: 1 }
      at:
        result: 12
        lines:
          - { value: -1, from: ITEMTPL_29.GR1 }
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
      "pa(with: weapon)": { result: 10, lines: [{ value: 3, from: schilde.SCH1 }, { value: -1, from: COND_1.B3, via: [SA_41.G1] }] }
      "pa(with: shield)": { result: 12, lines: [{ value: 6, from: schilde.SCH3 }, { value: -1, from: COND_1.B3, via: [SA_41.G1] }] }
      aw: { result: 6, lines: [{ value: -1, from: COND_1.B3, via: [SA_41.G1] }] }
    appToday: AT 13 — wrong (no Großschild −1); the parries and AW same

  - id: "16.11"
    name: Rolling initiative in the Plattenrüstung
    hero: { abilities: { SA_41: 2 } }
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rolls: { roll.ini: 4 }
    expect:
      ini:                                                               # 14 + 1W6 − 1
        result: 17
        lines:
          - { value: 14, from: kampfwerte.KW10, via: [kampfwerte.KW9] }  # Basiswert
          - { value: 4, from: kampfwerte.KW10 }                          # 1W6
          - { value: -1, from: COND_1.B3, via: [SA_41.G1] }
    appToday: >
      17 — same; the screen shows "13 + 4" (CombatInitiativeRollView.heroBaseINI folds the −1
      into the base), so the Belastung line is not shown

  - id: "16.12"
    name: Belastung drops during the fight
    hero: { abilities: { SA_41: 2 } }                                  # Belastung I
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rolls: { roll.ini: 4 }
    sequence:
      - expect: { ini: { result: 17 } }                    # 14 + 4 − 1
      - event: { COND_1: 0 }                               # the plate taken off
        expect: { ini: { result: 18, from: kampfwerte.KW11, kept: { w6: 4 } } }
    appToday: stays 17 — wrong (Hero.activeCombatInitiative stores the total, not its parts)

  # --- The page's own example (Carolan and Arbosch), not Boronmir ------------------------------

  - id: "16.13"
    name: Arbosch, Streitaxt and Holzschild, the shield used passively
    # The page gives AT/PA, not KtW: Hiebwaffen 14/8, Schilde PA 8 (the base values).
    hero: { values: { at: 14, "pa(with: weapon)": 8, "pa(with: shield)": 8 } }
    loadout: { weapon: Streitaxt, shield: Holzschild, other: shield, item.Streitaxt.atMod: 0, item.Streitaxt.paMod: -1, item.Holzschild.paMod: 1 }
    expect:
      at: { result: 14 }
      "pa(with: weapon)": { result: 8, lines: [{ value: -1, from: at-pa-modifikatoren.M1 }, { value: 1, from: schilde.SCH1 }] }
    appToday: same numbers (no lines)

  - id: "16.14"
    name: Arbosch parries actively with the Holzschild
    hero: { values: { at: 14, "pa(with: weapon)": 8, "pa(with: shield)": 8 } }
    loadout: { weapon: Streitaxt, shield: Holzschild, other: shield, item.Streitaxt.atMod: 0, item.Streitaxt.paMod: -1, item.Holzschild.paMod: 1,
               item.Holzschild.technique: Schilde }   # "Schilde PA 8" (16.13's note), the shield's technique (R61, Task 30)
    choose: { action.defence: shieldParry }
    expect:
      "pa(with: shield)": { result: 10, base: { value: 8, technique: Schilde }, lines: [{ value: 2, from: schilde.SCH3 }] }   # 2 × 1
    appToday: same (Shield.pa)

  - id: "16.15"
    name: Carolan, Florett and Linkhand
    # The page gives AT/PA, not KtW: Fechtwaffen 14/8 (the base values).
    hero: { values: { at: 14, "pa(with: weapon)": 8 } }
    loadout: { weapon: Florett, other: parryingWeapon, item.Florett.atMod: 1, item.Florett.paMod: 0, item.Linkhand.parryingWeapon: true, item.Linkhand.paMod: 1 }   # the other piece is the Linkhand
    expect:
      at: { result: 15, lines: [{ value: 1, from: at-pa-modifikatoren.M1 }] }
      "pa(with: weapon)": { result: 9, lines: [{ value: 1, from: schilde.SCH1 }] }   # Linkhand
    appToday: >
      PA 8 — wrong: a Parierwaffe gives no passive bonus (Hero.passiveShieldPABonus reads the
      shield only; the import drops isParryingWeapon), and the Linkhand in the off hand makes
      the loadout a dual-wield (Hero.isDualWielding)

  # --- Rulings -------------------------------------------------------------------------------

  - id: "16.16"
    name: Boronmir parries unarmed, the Großschild on his arm
    loadout: { weapon: null, shield: Großschild, other: shield }
    choose: { action.defence: weaponParry, action.with: Raufen }
    expect:
      "pa(with: weapon)": { result: 10, lines: [{ value: 3, from: schilde.SCH1, ruling: schilde.shield-bonus-raufen }] }   # Großschild; Raufen 7 + 3
    appToday: same (the Raufen row adds hero.passiveShieldPABonus)

  # --- Taking damage -------------------------------------------------------------------------

  - id: "16.17"
    name: Boronmir in plate takes a hit of 9 TP
    hero: { values: { leCurrent: 37, rs: 6 } }   # RS 6: the Plattenrüstung (header; R61, Task 30)
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rolls: { hit.tp: 9 }                                                 # the hit on the hero
    expect:
      sp: { result: 3, base: { from: schaden.S1 } }            # 9 − RS 6
      leCurrent: { result: 34 }
    appToday: same (CombatDamageViews, WoundEffectResolver.effectiveDamage)

  - id: "16.18"
    name: A hit that does not get through the plate
    hero: { values: { leCurrent: 37, rs: 6 } }   # RS 6: the Plattenrüstung (header; R61, Task 30)
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rolls: { hit.tp: 5 }
    expect:
      sp: { result: 0, base: { from: schaden.S1 } }
      leCurrent: { result: 37 }
    appToday: same

  - id: "16.19"
    name: A spell's damage, which ignores armour
    hero: { values: { leCurrent: 37, rs: 6 } }   # RS 6: the Plattenrüstung (header; R61, Task 30)
    loadout: { armour: Plattenrüstung, armour.belastung: 3, armour.extraPenalty: 0 }
    rolls: { hit.tp: 7 }
    choose: { choice.ignoresRS: true }
    expect:
      offered: [{ choice: ignoresRS, from: schaden.S5 }]
      sp: { result: 7 }
      leCurrent: { result: 30 }
    appToday: not offered — RS always comes off (1 SP); the player has to add the RS to the TP by hand

  - id: "16.20"
    name: LE falls to 0
    hero: { values: { leCurrent: 4 } }
    rolls: { hit.tp: 6 }
    expect:
      leCurrent: { result: -2 }           # or 0 — the Sterben rule's question
      events: [{ gained: imSterben, from: schaden.S8 }]
    appToday: LE clamped at 0 (CombatDamageViews); no "im Sterben" state

  # --- Not Boronmir: the one technique whose AT is not MU ------------------------------------

  - id: "16.21"
    name: A Peitsche, MU 14 and FF 11, Peitschen 10
    hero: { attributes: { MU: 14, FF: 11 }, techniques: { Peitschen: 10 } }
    loadout: { weapon.technique: Peitschen }
    expect:
      "at(with: Peitschen)": { result: 11, lines: [{ value: 10, from: kampfwerte.KW1 }, { value: 1, from: kampfwerte.KW6 }] }   # FF 11
      "pa(with: Peitschen)": { legal: false }                            # none
    appToday: AT 12 — wrong (OptolithImportService takes MU for every technique's AT)

  # --- Not Boronmir: a Schadensbonus ---------------------------------------------------------

  - id: "16.22"
    name: A Rabenschnabel in the hands of a hero with KK 16
    hero: { attributes: { KK: 16 } }
    loadout: { weapon: Rabenschnabel }
    choose: { action.attack: hit }                                       # "on a hit" (R61, Task 30)
    expect:
      tp: { total: 2, lines: [{ value: 2, from: schaden.S3 }] }          # on a hit: 1W6+4 +2; KK 16 − 14
    appToday: >
      TP 1W6+4 — no Schadensbonus, wrong (formatDamage ignores primaryThreshold, though the export
      carries it on every weapon; nothing else adds it). Boronmir's own KK 14 is not above the
      Rabenschnabel's 14 (16.3), so his sheet no longer shows it
