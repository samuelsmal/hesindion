# DRAFT FORMAT — see ../../README.md.
# Probe (example 21): does ranged combat need engine concepts the melee drafts lack?
id: fernkampf
name: Fernkampf (Ablauf eines Fernkampfangriffs)
kind: core
source:
  url: https://dsa.ulisses-regelwiki.de/Fernkampf.html
  book: Regelwerk
  page: "241 ff."      # as the page cites it: "Regelwerk (3. überarb. Aufl.), Seite 241ff"
  checked: 2026-09-24
  hash: null
reviewed: null
# FORMAT: one rule assembled from several pages (as trefferzonen): the Deckung sentences (FK8)
# are on the subpage "Größenkategorie im Fernkampf" (Kodex des Schwertes p. 80), not on this
# page. The subpages Bewegung, Schüsse ins Kampfgetümmel, Schadensbonus durch Reichweite and the
# Übersicht returned an empty article on 2026-09-24; this page carries their text.
#
# The app holds the modifier tables in RangedModifiers (all `rules: []`, so no line names a
# rule) and the distance TP in CombatFernkampfViews (`distanzTP`), outside the evaluator.
#
# Facts (plan Task 15): the range band is `target.rangeBand` (nah / mittel / weit / bogen /
# ausserReichweite), stated until ruling range-input says whether the app derives it from the
# distance through FK4's table; the target's size, movement and cover are `target.*`, the sight
# `gmFact.sicht` (0–4), the archer's own movement `hero.lastMovement`, a hero in melee
# `hero.inMelee`. "The hero shoots" is the hero's attack with a ranged weapon
# (`loadout.weapon.kind: ranged`); an incoming ranged attack is `gmFact.incomingAttack: ranged`
# (as schilde.SCH8). A die face of the hero's attack or defence is `roll.attack` / `roll.defence`.

clauses:
  - id: FK1
    text: >
      Ein solcher Angriff läuft ähnlich ab wie beim Nahkampf. Auch hier ist ein Angriffswurf
      notwendig, und zwar auf den sogenannten Fernkampfwert. Ist die Probe erfolgreich, trifft
      das Geschoss sein Ziel.
    none: the FK check itself; its value is kampfwerte's (FK Basiswert)

  - id: FK2
    text: >
      Ein Ziel muss sich nicht in Angriffsdistanz befinden, sehr wohl aber innerhalb der
      Reichweite der Waffe. Noch mehr als beim Nahkampf sind Schützen von den äußeren Umständen
      abhängig. Wie gut das Ziel zu sehen ist, ob es sich bewegt oder sogar teilweise hinter einer
      Deckung steht, beeinflusst die Wahrscheinlichkeit, das Ziel zu treffen.
    effects:
      - when: { target.rangeBand: ausserReichweite }
        forbid: { what: { attack: ranged } }
        because: "außer Reichweite der Waffe"
        # Up to farRange a normal shot; farRange–1.5× only the untargeted shot of FK4 (band
        # `bogen`). Beyond 1.5× the band is `ausserReichweite` (FK4's table): a comparison takes
        # constants, so the old `target.distance above weapon.farRange * 1.5` is the band.

  - id: FK3
    text: >
      Wer sich im Nahkampf befindet, kann keine Fernkampfangriffe ausführen. Als im Nahkampf
      befindlich gelten alle Wesen, die in Angriffsdistanz zueinander stehen und Angriffs- oder
      Verteidigungsaktionen gegeneinander ausführen.
    effects:
      - when: { hero.inMelee: true }
        forbid: { what: { attack: ranged } }
        because: "im Nahkampf keine Fernkampfangriffe"
        # hero.inMelee is a fact the player states (in reach of someone and exchanging attacks or
        # defences with them), as `fromBehind`. The app never asks it: the Fernkampf button is
        # shut only by a Ladehemmung, under water or when actions are blocked (CombatRootView).

  - id: FK4
    text: >
      Abhängig von der Waffe gelten unterschiedliche Modifikatoren für die Reichweite. Es gibt die
      Kategorien nah, mittel und weit für die Distanz zum Ziel. Jede Waffe hat eine andere
      Reichweite, die der Beschreibung der Waffe zu entnehmen ist. Es ist möglich, in weitem Bogen
      über das Maximum der Distanz weit hinaus zuschießen, und zwar bis zum Anderthalbfachen der
      Maximalreichweite der Waffe. Solche Schüsse sind immer ungezielt und reichen höchstens dazu
      aus, um auf eine größere Fläche, über eine Stadtmauer oder ins Schlachtgetümmel zu schießen.
    effects:
      - provide:
          name: fernkampf.FK4
          value:
            nah:    { upto: loadout.weapon.closeRange }
            mittel: { upto: loadout.weapon.mediumRange }
            weit:   { upto: loadout.weapon.farRange }
            bogen:  { upto: { of: loadout.weapon.farRange, times: 1.5 } }
            ausserReichweite: { above: { of: loadout.weapon.farRange, times: 1.5 } }
        ruling: range-input
        # Optolith gives every ranged weapon closeRange / mediumRange / farRange in Schritt
        # (Kurzbogen 10/50/80). A stated distance in Schritt (`target.distance`) picks the band
        # `target.rangeBand`; the band is what FK2, FK4 and FK5 read. A variation of reichweite's
        # `scale` (an ordered enum), keyed on weapon data like ITEMTPL_19's L+S threshold. Which
        # of the two the app asks is ruling range-input (open); until it is decided the band is
        # stated, and this table is shown, not applied.
      - when: { target.rangeBand: bogen }
        forbid: { what: { choice: [zielen, targetZone, gezielterSchuss] } }
        because: "Schüsse über die Maximalreichweite sind immer ungezielt"
        # What an untargeted shot hits is the GM's: no target, no defence; shown as text. The old
        # `aimedAttack` is an aimed zone: trefferzonen.TZ5's `targetZone` and SA_161's
        # `gezielterSchuss`; `zielen` is FK11's action.

  - id: FK5
    text: |
      Je weiter ein Ziel entfernt ist, desto schwerer ist es zu treffen. Die Reichweiten der jeweiligen Waffen werden daher in drei Schritten unterschieden. Befinden sich Ziele in der Reichweite nah, sind Fernkampfattacken um 2 erleichtert und der Angriff verursacht 1 Trefferpunkt zusätzlich.
      Ist das Ziel in der Reichweite mittel, ist die Probe hierdurch weder erleichtert noch erschwert. Ist das Ziel zu guter Letzt in Reichweite weit, dann sind Fernkampfattacken um 2 erschwert und der Angriff erzeugt 1 Trefferpunkt weniger.
      Nah | +2 auf FK (+1 TP)
      Mittel | +/–0 auf FK
      Weit | –2 auf FK (–1 TP)
    effects:
      - provide: { name: fernkampf.FK5.fk, value: { nah: 2, mittel: 0, weit: -2 } }
      - provide: { name: fernkampf.FK5.tp, value: { nah: 1, mittel: 0, weit: -1 } }
        # The old one table with an `fk` and a `tp` column is two provides, one per column
        # (as trefferzonen.TZ11's application / effect).
      - when: { target.rangeBand: [nah, mittel, weit] }
        add: { to: fk, value: "table(fernkampf.FK5.fk, target.rangeBand)" }
      - when: { target.rangeBand: [nah, mittel, weit], loadout.weapon.kind: ranged }
        add: { to: tp, value: "table(fernkampf.FK5.tp, target.rangeBand)" }
        # One fact, two lines on two values (FK now, TP on the hit), both citing FK5. The app
        # computes the TP half in the view (CombatFernkampfViews.distanzTP), not in the evaluator.
        # The bands only: the untargeted `bogen` shot has no row. The TP line is on a ranged
        # weapon's hit only, so a melee TP query does not ask the band.

  - id: FK6
    text: |
      Wichtig ist auch die Größe des Ziels. Ein menschengroßes Ziel gilt hierbei als Standard, also als mittleres Ziel.
      Winzig | –8 auf FK | Ratte, Kröte, Spatz
      Klein | –4 auf FK | Rehkitz, Schaf, Ziege
      Mittel | +/–0 auf FK | Mensch, Zwerg, Esel
      Groß | +4 auf FK | Oger, Troll, Rind
      Riesig | +8 auf FK | Drache, Riese, Elefant
    effects:
      - provide: { name: fernkampf.FK6, value: { winzig: -8, klein: -4, mittel: 0, gross: 4, riesig: 8 } }
      - add: { to: fk, value: "table(fernkampf.FK6, target.size)" }
        # The target's size; FK8's cover replaces this line (the old `target.size_for_fk`).
        # Not groessenkategorie (the melee rule on defences by size): two rules keyed on the same
        # size scale, as reiterkampf's "two rules with one name". trefferzonen.TZ5 suppresses
        # this line when a zone is aimed at.

  - id: FK7
    text: |
      Ebenfalls von Bedeutung ist die Bewegung von Schütze und Ziel. Während ein völlig stillstehendes Ziel leicht zu treffen ist, wird der Schuss bereits durch leichte Bewegungen wie langsames Gehen, sich Umschauen und Ähnliches erschwert. Rennt oder fliegt das Ziel oder schlägt Haken (wobei sich hier die GS halbiert), kann dies schon eine große Herausforderung für einen Schützen darstellen. Auch für den Schützen gilt: Hat dieser die letzte Aktion genutzt, um zu laufen, ist ein Schuss deutlich schwieriger.
      Ziel steht still | +2 auf FK
      Ziel bewegt sich leicht (4 Schritt und weniger in letzter Handlung) | +/–0 auf FK
      Ziel bewegt sich schnell (5 Schritt oder mehr in letzter Handlung) | –2 auf FK
      Ziel schlägt Haken zusätzlich | -4 auf FK, GS des Ziels halbiert
      Schütze geht (4 Schritt und weniger in letzter Handlung) | –2 auf FK
      Schütze rennt (5 Schritt oder mehr in letzter Handlung) | –4 auf FK
    effects:
      - provide: { name: fernkampf.FK7.target, value: { still: 2, leicht: 0, schnell: -2 } }
      - add: { to: fk, value: "table(fernkampf.FK7.target, target.movement)" }
      - when: { target.haken: true }
        add: { to: fk, value: -4 }
        # "zusätzlich": on top of schnell (−2), so −6 in all. A reading — the table row says only
        # "zusätzlich", which reads as added to the running row.
      - when: { target.haken: true }
        multiply: { to: opponent.gs, by: 0.5, round: up }
        ruling: round-up
        # The target pays for its Haken with half its GS — an opponent-side effect (the old
        # `side: opponent` is the `opponent.` prefix), not shown on the hero's FK line; when the
        # *hero* is the target, it is a line on his GS.
      - provide: { name: fernkampf.FK7.shooter, value: { steht: 0, geht: -2, rennt: -4 } }
      - add: { to: fk, value: "table(fernkampf.FK7.shooter, hero.lastMovement)" }
        # The hero's own movement in his last action: a fact the player states (the app asks it;
        # the old `hero.movement.lastAction`).

  - id: FK8
    # From the subpage "Größenkategorie im Fernkampf" (Kodex des Schwertes p. 80).
    text: >
      Diese Modifikationen können ebenfalls angewendet werden, wenn es gilt, Ziele in Deckung oder
      teilweiser Deckung zu beschießen. Ein Mensch, der bis zur Brust von einer Mauer geschützt
      wird, gilt als kleines Ziel. Ist nur ein Viertel, beispielsweise die Unterschenkel,
      außerhalb der Deckung, gilt er als winziges Ziel.
    effects:
      - ask: { fact: target.cover, who: gm, options: [keine, teilweise, weitgehend] }
        ruling: cover-as-size
        # The old `offer: { fact: … }` asks a fact of its owner: `ask` (target.* is the GM's).
      - when: { target.cover: [teilweise, weitgehend] }
        replace: { line: { line: fernkampf.FK6 }, with: "table(fernkampf.FK6, target.sizeInCover)" }
        ruling: cover-as-size
        # A variation of ADV_49's apply_level: one fact makes another rule's table (FK6) read a
        # different row. The line reads "Deckung: gilt als klein (−4)", FK6's line replaced by
        # FK8 (it keeps its origin and shows `was:`, as trefferzonen.TZ5's easing). The old
        # `cover_size(target.size, target.cover)` is the fact `target.sizeInCover`, the size the
        # target counts as behind its cover: how it follows from the size and the cover (a step
        # down, or the visible part) is what ruling cover-as-size asks. The app has no cover
        # input; the player picks a smaller size by hand.

  - id: FK9
    text: |
      Zu guter Letzt sei noch die Sicht genannt. Ein Ziel bei bestem Licht und ohne weitere Störungen zu treffen, ist vergleichsweise simpel. In fahlem Mondlicht kann man zwar noch klar die Silhouette erkennen, aber es macht das Zielen nicht gerade einfacher. Im Nebel oder hinter Buschwerk hingegen kann ein schemenhaftes Ziel eine große Herausforderung sein. Der Schuss auf ein unsichtbares Ziel ist ein reiner Glücksschuss und gelingt nur bei einer 1 auf W20.
      Sicht klar und ungestört | +/–0 auf FK
      Stufe 1 | Leichte Störung der Sicht | leichtes Blattwerk, Morgendunst | –2 auf FK
      Stufe 2 | Ziel als Silhouette erkennbar | Nebel, Mondlicht | –4 auf FK
      Stufe 3 | Ziel schemenhaft erkennbar | starker Nebel, Sternenlicht | –6 auf FK
      Stufe 4 | Ziel unsichtbar | dichter Rauch, völlige Dunkelheit | Glückstreffer bei einer gewürfelten 1 auf 1W20
    effects:
      - provide: { name: fernkampf.FK9, value: { "0": 0, "1": -2, "2": -4, "3": -6 } }
      - when: { gmFact.sicht: { atMost: 3 } }
        add: { to: fk, value: "table(fernkampf.FK9, gmFact.sicht)" }
      - when: { gmFact.sicht: 4 }
        cap: { to: fk, max: 0 }
      - when: { gmFact.sicht: 4 }
        tell: { to: player, text: "Glückstreffer: der Schuss trifft nur bei einer gewürfelten 1" }
        # The old `result: { hit: "roll == 1", else: miss }` has no verb: a check's result is the
        # procedure's (spec §6). Every roll but a 1 misses, whatever the FK: FK capped at 0, so
        # only the 1 that succeeds on any value (passierschlag.passierschlag-dice) hits; the
        # screen says "Glückstreffer: nur bei einer 1". The app's picker stops at Stufe 3.
        # Whether the 1 is a Kritischer Erfolg that needs confirming: FK13 applies unchanged —
        # a reading; the page does not say.

  - id: FK10
    text: |
      Fernkampf vom Pferderücken aus ist nicht einfach. Zwar sind berittene Schützen in manchen Regionen Aventuriens gefürchtete Gegner, aber es ist eine Kunst für sich, vom Pferderücken aus sein Ziel zu treffen. Wenn das Pferd steht, wird die Attacke normal ausgeführt. Im Trab ist Schießen fast nicht möglich und im Schritt um 4, im Galopp um 8 erschwert.
      Ein solcher Angriff kann nicht mit einem Langbogen ausgeführt werden.
      Tier steht | +/–0 auf FK
      Tier im Schritt | –4 auf FK
      Tier im Trab | fast unmöglich (Glückstreffer bei einer gewürfelten 1 auf W20)
      Tier im Galopp | –8 auf FK
    effects:
      - provide: { name: fernkampf.FK10, value: { steht: 0, schritt: -4, galopp: -8 } }
      - when: { hero.mounted: true, action.gait: [steht, schritt, galopp] }
        add: { to: fk, value: "table(fernkampf.FK10, action.gait)" }
        # The mount's gait is reiterkampf's `action.gait` (the old `mount.gait`).
      - when: { hero.mounted: true, action.gait: trab }
        cap: { to: fk, max: 0 }
      - when: { hero.mounted: true, action.gait: trab }
        tell: { to: player, text: "Glückstreffer: im Trab trifft der Schuss nur bei einer gewürfelten 1" }
        # As FK9's Stufe 4. The app offers steht / Schritt / Galopp only (vomPferd 0/−4/−8).
      - when: { hero.mounted: true, loadout.weapon: ITEMTPL_65 }
        forbid: { what: { attack: ranged } }
        because: "vom Pferd kein Langbogen"
        # Legality over the loadout while mounted, like reiterkampf.RK4. The app offers it.

  - id: FK11
    text: >
      Jede zum Zielen genutzte Aktion erleichtert den folgenden Schuss um 2. Dieser Bonus kann bis
      zu einem Maximum von 4 erhöht werden. Zielen ist eine länger dauernde Handlung bis zum
      eigentlichen Angriff.
    effects:
      - when: { loadout.weapon.kind: ranged }
        offer: { choice: zielen, costs: [{ cost: { pool: actions, amount: 1 } }] }
        # "Jede zum Zielen genutzte Aktion": aiming is an action (the old `step: { costs: {
        # action: 1 } }`), offered as liegend's standing up is (STATE_10.L4).
      - when: { loadout.weapon.kind: ranged }
        process:
          id: zielen
          steps: 2
          advancedBy: { action: zielen }
          breaksOff: { action.attack: [hit, miss], loadout.weapon.kind: ranged }
        ruling: zielen-interrupted
        # Two steps of +2 each: "bis zu einem Maximum von 4" is the process's cap, so a third
        # action buys nothing (the old `accumulates: { per: step, cap: 4 }`). The shot ends it
        # (the old `ends: shot` and `span: untilShot`): the hero's attack with the ranged weapon.
        # What else ends it without a shot, and whether it carries into the next Kampfrunde, is
        # ruling zielen-interrupted (open), so the process rests on it.
      - when: { process.zielen: { atLeast: 1 } }
        add: { to: fk, value: 2, per: process.zielen }
        # The bonus on the shot: +2 per step taken (`process.zielen`, the running process's
        # progress), read before the shot ends the process.
        # FORMAT: a länger dauernde Handlung — a process spread over several actions, possibly
        # over several rounds, whose progress is state the app must keep, and which a later
        # action consumes (the shot) or something breaks (ruling zielen-interrupted). Not the
        # round counter of mehrfache-verteidigung (reset each round) nor a `span: round`
        # choice: it outlives the round and is paid for in actions. The same shape as
        # ladezeiten.LZ2 (loading) and, likely, a spell's Zauberdauer. The page defining
        # "länger dauernde Handlung" (linked from ladezeiten) was not found on 2026-09-24.
        # The app offers Zielen as a picker (0/+2/+4) on the shot screen: the bonus is taken
        # without the actions ever being spent. Searched again on 2026-09-25, not found:
        # ladezeiten.laengere-handlungen asks what else is one.

  - id: FK12
    text: |
      Schüsse ins Kampfgetümmel stellen immer eine besondere Herausforderung dar. Wenn ein Fernkämpfer auf Gegner in direkten Kampfhandlungen schießt (sprich: das Ziel und andere Kämpfer sich zueinander in Angriffsdistanz befinden), dann erleidet der Schütze eine Erschwernis von 2 auf seine Probe auf Fernkampf. Misslingt die Probe, wird niemand getroffen.
    effects:
      - when: { target.inMelee: true }
        add: { to: fk, value: -2 }
        # A fact the player states (the app's kampfgetuemmel toggle). "niemand getroffen": a
        # failed shot hits no ally — the Fernkampf-Patzertabelle's "Kamerad getroffen" is a
        # Patzer, not a miss; shown as text on the failure.

  - id: FK13
    text: |
      Eine gewürfelte 1 bei einem Fernkampfangriff muss mit einem Bestätigungswurf überprüft werden.
      Wenn der Bestätigungswurf gelingt, treten die folgenden Effekte ein: Der Verteidigungswert des Gegners wird für diesen Angriff halbiert. Die Trefferpunkte werden samt aller Modifikatoren verdoppelt.
      Wenn der Bestätigungswurf misslingt, tritt folgender Effekt ein: Der Verteidigungswert des Gegners wird für diesen Angriff halbiert.
    effects:
      - when: { roll.attack: 1, loadout.weapon.kind: ranged }
        check:
          of: { check: confirm, with: fk }
          onSuccess:
            - multiply: { to: [opponent.pa, opponent.aw], by: 0.5, round: up }
              ruling: round-up
            - multiply: { to: tp, by: 2 }
          onFailure:
            - multiply: { to: [opponent.pa, opponent.aw], by: 0.5, round: up }
              ruling: round-up
        # A variation of trefferzonen.TZ8's check / onFailure, triggered by a die face
        # (`roll.attack`, the d20 of the hero's attack) of a shot. "samt aller Modifikatoren" is
        # the multiply phase, after every add (the old `after: all`). The confirmation roll is
        # the combat roll's confirm stage, a check on the same target (spec §6). The opponent's
        # Verteidigungswert is `opponent.pa` / `opponent.aw`; "für diesen Angriff" is the check's
        # own consequence (the old `span: attack`).

  - id: FK14
    text: |
      Auf der anderen Seite gibt es im Fernkampf auch Patzer. Hier muss ebenfalls ein Bestätigungswurf erfolgen.
      Wenn der Bestätigungswurf gelingt, geschieht Folgendes: gewöhnliches Misslingen
      Wenn der Bestätigungswurf misslingt, geschieht Folgendes: Der Held erleidet 1W6+2 SP.
    effects:
      - when: { roll.attack: 20, loadout.weapon.kind: ranged }
        check:
          of: { check: confirm, with: fk }
          onFailure:
            - tell: { to: player, text: "Patzer: der Held erleidet 1W6+2 SP" }
        # The old `damage: { formula: 1W6+2 }` needs a dice value form, which the vocabulary does
        # not have (plan A.4, as trefferzonen.TZ11's "1W3+1 SP"): the player is told to roll it,
        # and the SP are not applied by the engine (MIGRATION.md, open questions).
        # The optional Fernkampf-Patzertabelle replaces the 1W6+2 (the app has it, FumbleTable).
        # Note the page's inversion: the *failed* confirmation is the Patzer.

  - id: FK15
    text: |
      Wenn Pfeile, Bolzen oder Speere auf einen niedergehen, bleibt einem nicht viel mehr anderes übrig, als zur Seite zu springen oder einen stabilen Schild zwischen sich und die Geschosse zu bringen, wenn man nicht verletzt werden will.
      Das Ziel kann Fernkampfangriffe nicht mit einer Waffe parieren, dafür aber den Schuss oder Wurf mit einem Schild parieren oder ausweichen. Auszuweichen oder mit dem Schild parieren, ist bei Angriffen mit Schusswaffen um 4 erschwert, bei Wurfwaffen um 2.
      Schusswaffenangriff | -4
      Wurfwaffenangriff | -2
    effects:
      - when: { gmFact.incomingAttack: ranged }
        forbid: { what: { defence: weaponParry } }
        because: "Fernkampfangriffe nur mit Schild parieren oder ausweichen"
        # The same fact kampfwerte example 16 found missing (the app never asks whether the
        # attack is ranged); schilde.SCH8 forbids the same parry. The old `incoming` is the GM's
        # `gmFact.incomingAttack` (plan A.8).
      - when: { gmFact.incomingAttack: ranged, gmFact.incomingRangedKind: schusswaffe }
        add: { to: ["pa(with: shield)", aw], value: -4 }
      - when: { gmFact.incomingAttack: ranged, gmFact.incomingRangedKind: wurfwaffe }
        add: { to: ["pa(with: shield)", aw], value: -2 }
        # The old `shieldParry` target is `pa(with: shield)`.

  - id: FK16
    text: |
      Sollte es nicht gelingen, dem Fernkampfangriff zu entgehen, werden wie beim Nahkampf die Trefferpunkte ausgewürfelt, der Rüstungsschutz vom Ergebnis abgezogen und die verbliebenen Schadenspunkte von den Lebenspunkten abgezogen.
      Man kann in einer Kampfrunde genauso wie auf Nahkampfangriffe mehrmals auf Fernkampfangriffe reagieren, aber auch dies wird zunehmend schwerer: Die erste Parade mit dem Schild ist nicht zusätzlich erschwert. Jede weitere Parade in der laufenden Kampfrunde erhält jedoch eine Erschwernis von 3. Dies ist kumulativ, rechnet sich also auf. Das bedeutet, dass die erste Parade mit dem Schild nicht erschwert ist, der zweite um 3, der dritte um 6, der vierte um 9 usw.
      Ausweichen ist ebenfalls möglich und wird wie die Parade mit dem Schild zunehmend schwerer. Die Erschwernisse für die verschiedenen Verteidigungsarten sind kumulativ und werden bei einem Wechsel der Verteidigungsart übertragen. Hierbei ist es egal, ob die Erschwernisse durch Nah- oder Fernkampf entstanden sind.
      Zu Beginn einer neuen Kampfrunde sind diese Modifikatoren hinfällig.
    none: >
      mehrfache-verteidigung's counter, restated for ranged attacks: one counter per round over
      every defence, melee or ranged ("egal, ob … durch Nah- oder Fernkampf"). Damage is schaden's.

  - id: FK17
    text: |
      Eine gewürfelte 1 bei einer Verteidigung muss mit einem Bestätigungswurf überprüft werden.
      Wenn der Bestätigungswurf gelingt, tritt der folgende Effekt ein: Die Verteidigung sinkt nicht um 3 wie üblich bei der nächsten Verteidigung in dieser Kampfrunde.
      Wenn der Bestätigungswurf misslingt, tritt der folgende Effekt ein: Die nächste Verteidigung in dieser Kampfrunde ist nur um 2 statt um 3 (zusätzlich) erschwert.
    effects:
      - when: { roll.defence: 1, gmFact.incomingAttack: ranged }
        check: { of: { check: confirm, with: [pa, aw] } }
        # The confirmation of a rolled 1 on a defence against a shot (`roll.defence`). Its result
        # is kept for the next defence of the round: `round.previousDefenceCrit` (confirmed /
        # unconfirmed), which the combat roll states and the new round clears.
      - when: { round.previousDefenceCrit: confirmed }
        add: { to: [pa, aw], value: 3 }
        # "sinkt nicht um 3 wie üblich": mehrfache-verteidigung.MV1's −3 for this defence is
        # given back.
      - when: { round.previousDefenceCrit: unconfirmed }
        add: { to: [pa, aw], value: 1 }
        # "nur um 2 statt um 3 (zusätzlich)": one of MV1's 3 is given back.
        # The old `replace` of MV1's line with a span of one defence: `replace` swaps MV1's value
        # before its `per` (−3 × defences made), so it would be right only on the second defence
        # of a round, and no span is one defence. An `add` of the difference on the defence after
        # it is right on any defence.

  - id: FK18
    text: |
      Auf der anderen Seite gibt es bei der Verteidigung im Fernkampf auch Patzer. Hier muss ebenfalls ein Bestätigungswurf erfolgen.
      Wenn der Bestätigungswurf gelingt, geschieht Folgendes: gewöhnliches Misslingen
      Wenn der Bestätigungswurf misslingt, geschieht Folgendes: Der Held erleidet 1W6+2 SP.
    effects:
      - when: { roll.defence: 20, gmFact.incomingAttack: ranged }
        check:
          of: { check: confirm, with: [pa, aw] }
          onFailure:
            - tell: { to: player, text: "Patzer: der Held erleidet 1W6+2 SP" }
        # As FK14: no dice value form, so the 1W6+2 SP are told, not applied.

  - id: FK19
    text: |
      Auch Schuss- und Wurfwaffen verursachen bei einem erfolgreichen Angriff Trefferpunkte. Wie immer werden diese ausgewürfelt und vom Ergebnis der Rüstungsschutz abgezogen. Was übrig bleibt, wird als Schadenspunkte von der Lebensenergie des Getroffenen abgezogen.
      Je näher ein Ziel ist, desto stärker wirkt die Wucht eines Geschosses auf es ein. Daher gilt: Fernkampfwaffen in der Reichweite nah verursachen +1 TP. Fernkampfwaffen in der Reichweite weit verursachen –1 TP.
    none: the TP half of FK5, restated; damage is schaden's

  - id: FK20
    text: >
      Hat man ein Viertel der Lebenspunkte verloren, erhält man eine Stufe des Zustandes Schmerz.
      Das Gleiche geschieht, wenn man die Hälfte und Dreiviertel der Lebenspunkte verloren hat und
      wenn die Lebenspunkte auf 5 oder weniger sinken. Ab 0 Lebenspunkten liegt ein Held im
      Sterben. Details über Zustände.
    none: COND_6.SZ3 and schaden, restated

rulings:
  - id: range-input
    status: open
    question: >
      How does the app learn the range band (nah / mittel / weit / beyond)? By the player naming
      the band, or by the distance in Schritt, which the app turns into the band from the weapon?
    context: >
      FK4 ties the bands to each weapon's ranges; Optolith exports them (Kurzbogen 10 / 50 / 80
      Schritt, Langbogen 20 / 100 / 160). The app asks the band directly (CombatFernkampfViews,
      distanz nah/mittel/weit, default mittel) and has no "beyond" option, so the untargeted shot
      up to 1.5× (FK4) cannot be chosen, and nothing shows which band a distance falls into.
    situations: [probe-fernkampf 21.1, probe-fernkampf 21.2]
    options:
      a: { says: "Ask the distance in Schritt; the app shows the band it falls into for the weapon in hand, the player can override.", app: "a Schritt stepper; the band and its lines follow from the weapon's ranges; 'beyond' (FK4) appears past farRange" }
      b: { says: "Ask the band, as today, and show each band's Schritt for the weapon beside it.", app: "the picker gains the Schritt per band and a fourth option 'über Maximalreichweite'" }
    recommended: b
    whyRecommended: >
      the GM usually says "about 40 Schritt" and the player knows their bow; showing the Schritt
      beside each band answers the question without a stepper, and keeps the one-tap default.
      Either way the band — not the distance — is the fact the rule reads
    answer: null

  - id: cover-as-size
    status: open
    question: >
      FK8: a target in cover "gilt als" a smaller size. Does cover replace the target's size (the
      part that is visible decides: chest-high wall → klein, whoever stands behind it), or step
      the target's own size down (an Oger, groß, behind the same wall → mittel)?
    context: >
      The page's examples are all for a human (mittel → klein, → winzig). For a larger or smaller
      target the page does not say. The app has no cover input; the player can only pick a
      smaller size in the size picker, and the line then says "Größe", not Deckung.
    situations: [probe-fernkampf 21.3]
    options:
      a: { says: "Step down: teilweise Deckung one size smaller, weitgehend two; the line says 'Deckung: gilt als …'.", app: "a cover picker (keine / teilweise / weitgehend); the size row shifts by one or two steps" }
      b: { says: "Replace: the player picks the size of the visible part directly.", app: "the cover picker becomes 'sichtbarer Teil' with the five sizes" }
    recommended: a
    whyRecommended: >
      it reproduces both of the page's examples for a human (bis zur Brust → klein, nur die
      Unterschenkel → winzig) and gives a sensible answer for an Oger or a goblin; the player
      answers one question about the cover, not a judgement about the size of a part
    answer: null

  - id: zielen-interrupted
    status: open
    question: >
      FK11: aiming is "eine länger dauernde Handlung bis zum eigentlichen Angriff". What ends it
      without a shot — a defence, taking damage, the target moving out of sight — and does it
      carry over into the next Kampfrunde?
    context: >
      The page that defines "länger dauernde Handlung" (linked from the Ladezeiten page) was not
      found on 2026-09-24, so this is asked without it and must be re-read against it. The app
      offers Zielen as a 0 / +2 / +4 picker on the shot screen: no actions are spent, nothing
      carries over or breaks.
    situations: [probe-fernkampf 21.6]
    options:
      a: { says: "Aiming lasts until the shot or until the hero does anything else with an action or a defence; it carries over rounds.", app: "an 'Zielen' action on the root screen that counts up (+2, +4) and is shown on the next shot; any other action or a defence clears it" }
      b: { says: "Only another action ends it; a defence does not.", app: "as a, but the defence screens leave it" }
      c: { says: "It is the player's to track; the picker stays.", app: "as today, with the rule cited on the line" }
    recommended: a
    whyRecommended: >
      it makes the cost visible (the actions are spent) without guessing further than "bis zum
      eigentlichen Angriff" allows; b and c wait on the missing page. To be re-checked when the
      page is read
    answer: null
