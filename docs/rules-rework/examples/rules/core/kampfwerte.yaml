  - id: KW28
    page:
      url: https://dsa.ulisses-regelwiki.de/Nah-_und_Fernkampf/initiative.html
      book: Regelwerk (4. überarb. Aufl.)
      page: 226
    text: >
      Beispiel: Arbosch und Geron stehen also drei Orks gegenüber. Arbosch hat einen
      Initiative-Basiswert von 14, Geron einen von 11, die Orks haben einen von 10. Arboschs
      Spieler würfelt 1W6 und erzielt eine 4. Jedoch senkt die Belastung von Arboschs Rüstung
      dieses Ergebnis um 2. Damit hat Arbosch eine Initiative von 16 (14 + 4 - 2 = 16). Gerons
      Spieler würfelt eine 3. Da Geron keine Rüstung trägt, kommt er damit insgesamt auf 14 (11 +
      3 = 14). Der erste Ork hat eine Initiative von 15, der zweite Ork wie Geron eine von 14.
      Damit kommt es zwischen Geron und dem zweiten Ork zu einem Gleichstand. Da Geron aber den
      besseren Basiswert aufweist, ist er vor dem Ork dran. Der dritte Ork kommt gerade mal auf
      eine Initiative von 11 und ist damit als Letzter dran. Die Reihenfolge lautet also: Arbosch
      (16), Ork 1 (15), Geron (14), Ork 2 (14), Ork 3 (11).
    none: >
      KW10 and KW12's tie-break (Geron before Ork 2 on the higher base) worked through; the
      order needs the opponents' INI, which the app does not model
