# DRAFT FORMAT — see ../../README.md.
id: beengte-umgebung
name: Beengte Umgebung
kind: core
catalog_id: GRW_beengteUmgebung
source:
  url: https://dsa.ulisses-regelwiki.de/GR_Kampf-BeengteUmgebung.html
  book: Regelwerk
  page: 238
  checked: 2026-09-24
  hash: null
reviewed: null
# Also Kodex des Schwertes p. 74. The same table is on the status Eingeengt (STATE_6, Regelwerk
# p. 35f), which the app uses as the switch. Optolith's STATE_6 text adds "Talentanwendungen
# können … um bis zu 2 erschwert werden" — not on this page; STATE_6 is not drafted here.
# reichweite.RW2 restates the weapon rows from the reach side.

# The GM decides that the place is beengt (BU1); every clause below applies only then.
applies_when: { gm.fact: beengt, span: round }
# FORMAT: the app keeps this as the hero's status STATE_6 (eingeengt), which persists across
# fights; the page makes it a property of the place, decided by the GM.

clauses:
  - id: BU1
    text: >
      In kleinen Räumen, Gängen und ähnlichem Umfeld kann der Spielleiter entscheiden, dass es
      sich um eine beengte Umgebung handelt. Waffen mit der Reichweite kurz erleiden hier keine
      Abzüge. Größere Waffen erleiden Abzüge.
    effects: none
    why: the switch (`applies_when`) and a summary of BU2's rows

  - id: BU2
    text: |
      Kurze Waffen: +/-0 auf AT; +/-0 auf PA
      Mittlere Waffen: -4 auf AT; -4 auf PA
      Lange Waffen: -8 auf AT; -8 auf PA
    effects:
      - when: { roll.with: weapon, roll.with.reach: mittel }
        add: { to: [at, pa], value: -4 }
      - when: { roll.with: weapon, roll.with.reach: lang }
        add: { to: [at, pa], value: -8 }
      # `roll.with` is the piece the AT or PA is rolled with — on a parry the parrying piece,
      # not the main weapon. Bare hands are kurz (reichweite.RW1). AW is not on the table.

  - id: BU3
    text: |
      Kleine Schilde: -2 auf AT; -2 auf PA
      Mittlere Schilde: -4 auf AT; -3 auf PA
      Große Schilde: -6 auf AT; -4 auf PA
    effects:
      - when: { roll.with: shield, roll.with.shieldSize: klein }
        add: { to: at, value: -2 }
      - when: { roll.with: shield, roll.with.shieldSize: klein }
        add: { to: pa, value: -2 }
      - when: { roll.with: shield, roll.with.shieldSize: mittel }
        add: { to: at, value: -4 }
      - when: { roll.with: shield, roll.with.shieldSize: mittel }
        add: { to: pa, value: -3 }
      - when: { roll.with: shield, roll.with.shieldSize: gross }
        add: { to: at, value: -6 }
      - when: { roll.with: shield, roll.with.shieldSize: gross }
        add: { to: pa, value: -4 }
    ruling: beengt-shield-carried
    # FORMAT: a shield's size is equipment data the app does not have. Optolith states it only
    # in the item's note text ("großer Schild, 30 Strukturpunkte" for Großschild, ITEMTPL_29);
    # its `reach` field says kurz for every shield. An equipment/ rule file per shield template
    # (or a `shieldSize` column in rules.db) would carry it.

rulings:
  - id: beengt-shield-carried
    status: open
    question: >
      A fighter with weapon and shield in a corridor: does the shield's row (BU3) apply only to
      rolls made with the shield, or also to the weapon's AT and PA while the shield is carried?
    context: >
      The page lists weapons and shields as rows of one table, each with its own AT and PA,
      and does not say whose rolls a row applies to. Read per item, the Großschild's −6 AT only
      matters for a shield attack and its −4 PA for a shield parry. Read as "carrying it", a
      Langschwert with a Großschild would be −10 AT / −8 PA. The app reads neither: it knows
      no shield sizes, takes the reach of the main weapon for every AT and PA
      (Situation.loadoutReach; the catalog note says the parrying piece is not named "until step
      3"), and the Großschild's own reach is kurz (OptolithImportService.parseItems, reach 1).
    situations: [kampfsituationen 17.14]
    options:
      a: { says: "Per item: the shield's row applies to rolls with the shield, the weapon's row to rolls with the weapon.", app: "the parrying piece decides the row; shields read their size" }
      b: { says: "Carried: the weapon's rolls also take the shield's row (Langschwert + Großschild: AT −10, PA −8).", app: "a second line on every weapon roll while a shield is in the loadout" }
    recommended: a
    why_recommended: >
      the weapon rows are plainly per item (a Dolch in the other hand does not hamper the
      Langschwert), and the shield rows sit in the same table with the same columns
    answer: null
