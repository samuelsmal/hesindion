# DRAFT FORMAT — see ../../README.md.
id: ruestung-und-belastung
name: Rüstung und Belastung
kind: core
source:
  url: https://dsa.ulisses-regelwiki.de/Spezielle_Nahkampfregeln/ruestung-und-belastung.html
  book: Regelwerk
  page: 237
  checked: 2026-09-23
  hash: null
reviewed: null

clauses:
  - id: A0
    text: >
      Wer fürchten muss, in einen Kampf zu geraten, sollte darauf achten, sich zu schützen. Die
      Völker Deres haben daher eine Vielzahl verschiedener Rüstungen und Helme aus verschiedenen
      Materialien entwickelt. Diese unterscheiden sich sowohl in der Schutzwirkung, die durch den
      Rüstungsschutz (RS) dargestellt wird, als auch in ihrem Gewicht und ihrer Sperrigkeit.
      Träger schwerer Rüstung erleiden den Zustand Belastung in unterschiedlich hohen Stufen.
    none: introduction; that armour gives the Zustand Belastung is A1

  - id: A1
    text: >
      Mittels einer Rüstung erhält ein Abenteurer einen Rüstungsschutz- und Belastungswert.
      Abzüge auf GS und INI können ebenfalls noch zusätzlich entstehen.
    effects:
      # The armour's own values come from the equipment data (Optolith item templates, or what
      # the hero sheet says), not from this file: the table on the page is an excerpt.
      - derive: { to: "level(rule: COND_1)", sum: [{ of: loadout.armour.belastung }] }
        # The Stufe of Belastung the armour gives, with `belastung.source: armour` (what SA_41.G1
        # lowers). FORMAT: an effect that feeds a condition's level rather than a check.
      - add: { to: [gs, ini], value: { of: loadout.armour.extraPenalty } }
        # A line of its own, named after this clause — not part of Belastung, so it is not
        # lowered by Belastungsgewöhnung or by the mounted relief, and is not a Zustand.
      - forbid: { what: { loadout: secondArmour } }
        because: ein Held trägt eine Rüstung (Helm eingeschlossen); Rüstungen summieren sich nicht
        ruling: several-armour-pieces
        # "Mittels einer Rüstung": one armour at a time (ruling several-armour-pieces). Armour by
        # piece and zone is trefferzonen-ruestungsschutz's (its RS3 forbids a second armour too).

  - id: A2
    text: |
      Art | Rüstungsschutz | Belastung (Stufe) | zusätzliche Abzüge
      Normale Kleidung, Felle oder nackt | 0 | 0 | –
      Schwere Kleidung, Winterkleidung | 1 | 0 | -1 GS, -1 INI
      Stoffrüstung, Gambeson | 2 | 1 | –
      Lederrüstung | 3 | 1 | -1 GS, -1 INI
      Kettenrüstung | 4 | 2 | –
      Schuppenrüstung | 5 | 2 | -1 GS, -1 INI
      Plattenrüstung | 6 | 3 | –
      Gestechrüstung | 7 | 4 | –
      Turnierrüstung | 8 | 5 | –
    none: >
      data, held by the equipment table; A1 reads a row's Belastung and zusätzliche Abzüge from
      the armour the hero wears. The rows are also listed in ../../belastung.md. Turnierrüstung's
      Belastung 5 is above the page's Stufe IV (COND_1.B4)

  - id: A3
    text: >
      Beispiel: Wer eine Stoffrüstung trägt, verfügt über einen RS von 2 und eine Belastung von
      1. Die Belastung von 1 sorgt laut der Beschreibung des Zustands dafür, dass alle Proben auf
      Talente, die durch Belastung erschwert sind eine Erschwernis von -1 erhalten. Außerdem gibt
      es Abzüge von -1 auf AT, Verteidigung, INI, GS. Wer eine Lederrüstung trägt erhält die
      gleichen Erschwernisse und Abzüge durch die BE von -1, aber er bekommt zusätzliche Abzüge
      auf GS und INI, sodass er insgesamt Abzüge von -2 auf beide Werte hat.
    none: a worked example; it is situations/belastung.yaml 1.1 and 1.2

rulings:
  - id: several-armour-pieces
    status: decided
    question: >
      A hero may have more than one armour piece equipped. Do their Belastung values add up, and
      do their extra GS/INI penalties? The app adds both today.
    answer: >
      Not under the core rules: a hero wears one armour, and it includes the helmet (a
      Plattenrüstung has one). Armour by piece and zone exists only in the Fokusregel
      Trefferzonen-RS (https://dsa.ulisses-regelwiki.de/Fokus_TreffzonenRS.html), with its own,
      more involved calculation.
    decided: { by: "@samuelsmal", date: 2026-09-23 }
    appliesTo: [A1]
    notes: >
      Consequence for the app: without that Fokusregel, one armour is equipped at a time
      (HeroDetailView lets any number be equipped and Hero.totalEquippedBE sums them). The
      Fokusregel joins example 6, Trefferzonen.
