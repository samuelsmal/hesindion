# Also Kodex des Schwertes p. 75. Whether an attack comes from behind is the GM's call, one
# answer per attack (the app's gm.fact fromBehind, span attack).

clauses:
  - id: AH1
    text: >
      Gelegentlich kann es vorkommen, dass ein Kämpfer einen Gegner von hinten angreifen kann.
      Wenn dies geschieht, so ist die Verteidigung des Gegners um -4 erschwert, da er den
      Angriff nur schlecht sieht oder spät wahrnimmt.
    effects:
      - when: { side: opponent, gm.fact: fromBehind, span: attack }
        add: { to: [pa, aw], value: -4 }
        ruling: from-behind-ranged
        # The hero defends: every defence, shield parry included.
      - when: { side: hero, gm.fact: fromBehind, span: attack }
        opponent_add: { to: [pa, aw], value: -4 }
        # The hero attacks: an opponent line, the GM subtracts it (ADR-0005).
      - when: { side: opponent, gm.fact: fromBehind, hero.mounted: true }
        forbid: { defence: shieldParry }
        from: reiterkampf.RK5
        ruling: mounted-from-behind-shield
        # FORMAT: an effect that belongs to another rule's clause (RK5) but only becomes
        # encodable through this rule's fact: RK5 needs the side an attack comes from, and
        # "from behind" is the one side the app already asks. Where does it live — here, or in
        # reiterkampf with `when: gm.fact fromBehind`? Written here to be seen.

rulings:
  - id: from-behind-ranged
    status: open
    question: >
      Does the −4 apply to a defence against a ranged attack from behind (dodging, or a shield
      parry against an arrow), and to the opponent's defence when the hero shoots from behind?
    context: >
      The page sits among the special melee rules ("Spezielle Nahkampfregeln") and says "einen
      Gegner von hinten angreifen" without naming melee; the reason it gives (the defender sees
      the attack late) holds for an arrow too. The app asks the question on the defence screen
      for any Parieren or Ausweichen (CombatDefenseSetupView), whatever the attack was, and on
      the melee announcement only (CombatAttackViews); the catalog clauses are meleeParry,
      meleeDodge and meleeAttack. So a dodge against an arrow from behind gets −4 today, a shot
      at an opponent's back tells the GM nothing.
    situations: [kampfsituationen 17.13]
    options:
      a: { says: "Melee only: the defence against a melee attack from behind.", app: "the defence screen asks only when the attack is melee" }
      b: { says: "Any attack: also defences against shots from behind, and the hero's own shots from behind tell the opponent −4.", app: "the ranged announcement asks it too" }
    recommended: a
    why_recommended: >
      weakly — the page is filed with the melee rules in both books, and ranged combat has its
      own modifiers for the target's situation; if the owner reads the reason as general, b
    answer: null

  - id: mounted-from-behind-shield
    status: open
    question: >
      Mounted, attacked from behind: RK5 says a shield blocks only attacks from the front and
      the shield-arm side. Is the shield parry gone, and does the shield's passive PA bonus on a
      weapon parry go with it?
    context: >
      reiterkampf.RK5 is unencoded because the app does not know the side of an attack — but it
      does know "from behind" (gm.fact fromBehind). RK5 names front and shield-arm side for the
      shield, weapon-arm side for the weapon, and says nothing of behind, so the weapon parry
      stays under the ordinary rules. The app offers the Großschild parry at −4 and adds the
      shield's PA modifier to a weapon parry (Hero.passiveShieldPABonus) whether mounted or not.
      For Boronmir on Kupperus against a fighter on foot: shield parry 13 + 2 (vorteilhafte
      Position) + 1 (Golgariten-Stil) − 4 = 12 today.
    situations: [kampfsituationen 17.10]
    options:
      a: { says: "No shield parry, and no passive shield bonus on the weapon parry: the shield is not between the attacker and the rider.", app: "the shield drops out of the defence list and out of the weapon PA on fromBehind while mounted" }
      b: { says: "No shield parry; the passive bonus on the weapon parry stays (it is part of the weapon-and-shield PA).", app: "only the shield parry drops out" }
      c: { says: "RK5 is about the sides; from behind the ordinary rules apply, shield parry at −4.", app: "no change" }
    recommended: a
    why_recommended: >
      RK5 says what a shield can block and behind is not on the list; the passive bonus stands
      for the shield covering the fighter, which it cannot do from behind
    answer: null
