# DRAFT FORMAT — see ../../README.md.
# The catalog's id is GRW_mehrfacheVerteidigung. The page is the "3. Verteidigung" section of
# the Nahkampf chapter; only its multiple-defence paragraphs are clauses here. The section ends
# with a link, "Mehr Verteidigungen für Meisterpersonen (Optionale Regel)"
# (Opt_Mehr_Verteidigungen.html): an optional rule for GM characters, deliberately left out.
id: mehrfache-verteidigung
name: Mehrfache Verteidigung
kind: core
source:
  url: https://dsa.ulisses-regelwiki.de/Nahkampf.html
  section: 3. Verteidigung
  book: Regelwerk (4. überarb. Auflage)
  page: 229 ff.        # the multiple-defence paragraphs themselves are p. 232 (Optolith's Vinsalt-Stil text)
  checked: 2026-09-23
  hash: null
reviewed: { by: "@samuelsmal", date: 2026-09-24 }

clauses:
  - id: MV1
    text: >
      Man kann bei jedem Angriff nur einmal eine Verteidigung versuchen, es ist also nicht
      möglich, mehr als eine Verteidigung gegen einen Angriff auszuführen. Es ist jedoch durchaus
      möglich, in einer Kampfrunde mehrmals auf unterschiedliche Angriffe von Gegnern zu
      reagieren. Wiederholte Verteidigung wird aber zunehmend schwerer: Die erste Verteidigung
      ist nicht erschwert, jede weitere in der laufenden Kampfrunde um -3.
    effects:
      - when: { check: [pa, aw], round.defencesMade: { min: 1 } }
        add: { to: check, value: -3, per: round.defencesMade }
        id: MV1.step          # named so SA_923 can change the step
      - forbid: { second_defence_against: same_attack }

  - id: MV2
    text: >
      Das bedeutet, dass die erste Verteidigung nicht erschwert ist, die zweite um -3, die dritte
      um -6, die vierte um -9 usw. Zu Beginn einer neuen Kampfrunde sind diese Modifikatoren
      hinfällig, und die nächste Verteidigung ist nicht mehr erschwert.
    effects: none
    why: restates MV1 and says the count resets each Kampfrunde — `round.defencesMade` is per round

  - id: MV3
    text: >
      Führen diese Erschwernisse dazu, dass der Wert einer Verteidigung auf 0 oder darunter
      sinkt, kann keine Verteidigung dieser Art mehr ausgeführt werden. Steht eine andere
      Verteidigung zur Verfügung, deren Wert trotz der Abzüge nicht auf 0 gefallen ist, kann
      jedoch diese genutzt werden.
    effects:
      - when: { check: [pa, aw], value.after: { max: 0 } }
        forbid: { defence: this_kind }
        ruling: zero-value
        # FORMAT: a legality rule that reads the *result* of all other modifiers — it has to be
        # evaluated after them, unlike every add.

  - id: MV4
    text: >
      Die Erschwernisse von vorherigen Verteidigungen in einer Kampfrunde übertragen sich auf
      alle Verteidigungsarten. Hierbei ist es egal, ob die Erschwernisse durch Nah- oder
      Fernkampf entstanden sind.
    effects: none
    why: >
      says what `round.defencesMade` counts: every defence this round — parries and dodges
      together, against melee and ranged attacks alike

  - id: MV5
    text: >
      Die Möglichkeit, mehrere Verteidigungen in einer Kampfrunde zu benutzen, steht nur Helden
      und Personen mit Schicksalspunkten zur Verfügung. Sie müssen hierfür keine
      Schicksalspunkte ausgeben, oder aktuell besitzen. Andere Wesen haben nur eine Verteidigung
      pro Kampfrunde und eventuell weitere durch Sonderfertigkeiten, Zauber oder Liturgien.
    effects: none
    why: the app's hero is always a Held; other creatures are not modelled (ADR-0005)

  - id: MV6
    text: >
      Nichthumanoide Wesen, insbesondere Ungeheuer, können immer mit ihrem vollen
      Verteidigungswert verteidigen. Auch wenn sie mehrfach in einer KR verteidigen müssen,
      sinkt ihr Verteidigungswert nicht. Sie benötigen auch keine Schicksalspunkte für
      zusätzliche Verteidigungen.
    effects: none
    why: about opponents, which are not modelled (ADR-0005)

rulings:
  - id: zero-value
    status: decided
    question: >
      MV3: when "the value of a defence" falls to 0 or below, no more defences of that kind.
      Which value — the defence value after every modifier this defence would roll against, or
      the base value minus only the multiple-defence penalty?
    answer: >
      The value after all modifiers — the number the defence would be rolled against.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [MV3, schicksalspunkte.SP-verteidigung]
    notes: >
      One number for the roll and the block, so the button and the roll never disagree. The
      Schicksalspunkt "Verteidigung" page agrees: its +4 raises the number of defences "since the
      value reaches 0 later". Belastung, Schmerz, Vorteilhafte Position and the rest count too.
      The app never blocks a defence for its value (CombatRootView.defenseBlocked knows only
      Vorstoß, the Fernkampf-Patzer and Handlungsunfähig); the button must be disabled when the
      full breakdown reaches 0 or less.
