# DRAFT FORMAT — see ../../README.md.
id: passierschlag
name: Passierschlag
kind: core
catalogId: GRW_passierschlag
source:
  url: https://dsa.ulisses-regelwiki.de/GR_Kampf-Passierschlag.html
  book: Regelwerk
  page: 237
  checked: 2026-09-24
  hash: null
reviewed: null
# Also Kodex des Schwertes p. 74. The Passierschlag is struck by whoever is *given* one; the
# hero strikes one (an attack of ours) or suffers one (damage on our side, no defence).

clauses:
  - id: PS1
    text: >
      Es gibt verschiedene Gründe, warum ein Passierschlag ausgeführt werden kann. So erleidet
      ein Kämpfer beispielsweise einen Passierschlag, wenn die Probe bei der Flucht misslingt,
      oder ein Kritischer Erfolg des Gegners bei der Parade gelingt, oder bestimmte Manöver des
      Kämpfers misslingen, oder er einfach durch die Angriffsdistanz eines neuen Gegners rennt
      ohne sich ihm zu stellen.
    effects:
      - when: { gmFact.movesThroughReach: newOpponent, not: { gmFact.engages: true } }
        # The GM states it: the hero runs through a new opponent's reach without facing them.
        tell: { to: player, text: "Passierschlag des Gegners" }
      # The other triggers are the other rules' own clauses, which point here:
      #   Flucht (misslungen) — the Flucht page, not drafted; mounted: reiterkampf.RK15
      #   a critical parry — the critical-success rules (CriticalSuccessTable, basic rule)
      #   failed manoeuvres — SA_62.ST3, SA_172.U2; a Patzer getting there — vorteilhafte-position.VP2
      #   standing up — STATE_10.L4
      # FORMAT: a rule whose triggers live in other files. `beispielsweise` makes this list
      # open, so the Passierschlag has to be reachable on its own (the manoeuvre list does that
      # today), not only from the triggers the rules name.

  - id: PS2
    text: >
      Ein Passierschlag ist ein Nahkampfangriff, der keine Handlung erfordert und auf den nicht
      mit einer Verteidigung reagiert werden kann. Es handelt sich um eine um -4 erschwerte
      Attacke.
    effects:
      - offer: { choice: passierschlag }
        # A melee attack (`at`) that takes no Handlung: the old `costs: none`, `domain: meleeAttack`.
      - when: { choice.passierschlag: true }
        add: { to: at, value: -4 }
        # Every other line of a melee AT still applies (Belastung, Beengte Umgebung, winzig
        # target, vorteilhafte Position) — only the manoeuvres are out (PS3).
      - when: { choice.passierschlag: true }
        forbid: { what: { defence: [opponent.pa, opponent.aw] } }
        because: auf einen Passierschlag kann nicht mit einer Verteidigung reagiert werden
        # The hero strikes it: the opponent may not defend (the old `opponent_may_only: []`).
      - when: { choice.passierschlag: true }
        tell: { to: opponent, text: "keine Verteidigung" }
      - when: { gmFact.incomingAttack: passierschlag }
        forbid: { what: { defence: [pa, aw] } }
        because: auf einen Passierschlag kann nicht mit einer Verteidigung reagiert werden
        # The hero suffers it (the GM states it): no defence is offered; the app goes straight
        # to the damage screen (the old `then: { go_to: takeDamage }`).
        # Mounted and struck by a fighter on foot: the mount is the target (reiterkampf.RK11,
        # ruling reiterkampf.passierschlag-on-mount).

  - id: PS3
    text: >
      Der Passierschlag lässt sich nicht mit Kampfsonderfertigkeiten kombinieren (z.B. Finten
      oder Wuchtschlägen).
    effects:
      - when: { choice.passierschlag: true }
        forbid: { what: { manoeuvre: any } }
        because: der Passierschlag lässt sich nicht mit Kampfsonderfertigkeiten kombinieren
        ruling: passierschlag-sf
        # Basis- and Spezialmanöver only. Passive SF and Kampfstile still apply (Golgariten-Stil's
        # +2 on the vorteilhafte Position, kampfsituationen 17.3).
      - when: { choice.passierschlag: true, rulesets: fokus.trefferzonen }
        offer: { choice: targetZone }
        ruling: passierschlag-zone
        # Aiming is not a Kampfsonderfertigkeit (trefferzonen.TZ5): the full zone penalty, never
        # halved — the halving is the Spezialmanöver Gezielter Angriff (SA_160), which the line
        # above forbids.

  - id: PS4
    text: Es gibt keine Kritischen Erfolge oder Patzer bei Passierschlägen.
    effects:
      - when: { choice.passierschlag: true }
        forbid: { what: { check: [kritischerErfolg, patzer] } }
        because: bei Passierschlägen gibt es keine Kritischen Erfolge oder Patzer
        ruling: passierschlag-dice
        # no confirmation roll, no table
        # A 1 hits and a 20 misses whatever the AT, as on every check (the check procedure,
        # spec §6); only the confirmation roll and the table are gone. The old `result: hit` on
        # a 1 and `result: miss` on a 20 restated that procedure and have no effect of their own.

  - id: PS5
    text: >
      Anmerkung: Für einen Passierschlag braucht man keine Handlungen aufwenden. Man kann
      beliebig viele Passierschläge pro Runde durchführen.
    none: >
      no limit is the default: a Passierschlag is not an action (PS2's offer costs none) and not
      a defence, so it touches neither the action count nor mehrfache-verteidigung's count
    # The old `limit: { …, max: none }` stated "no limit" explicitly — worth saying, because
    # Mehrfache Verteidigung and the action count would otherwise suggest one; a limit takes a
    # number.

  - id: PS6
    text: >
      Beispiel: Arboschs Ork will fliehen, sodass Arbosch einen Passierschlag ausführen kann,
      wenn dem Spielleiter die Probe auf Körperbeherrschung (Kampfmanöver) für den Ork
      misslingt. Die Probe misslingt tatsächlich und so hat Arbosch einen Passierschlag frei.
      Arboschs Attackewert ist 15, der Passierschlag ist aber um -4 erschwert (15 - 4 = 11).
      Der Spieler würfelt eine 3 und trifft den fliehenden Ork in den Rücken. Dieser erleidet
      normalen Waffenschaden.
    none: the worked example; situation kampfsituationen 17.1 is the same arithmetic with Boronmir

rulings:
  - id: passierschlag-sf
    status: decided
    question: >
      PS3: a Passierschlag "lässt sich nicht mit Kampfsonderfertigkeiten kombinieren (z.B. Finten
      oder Wuchtschlägen)". Does that mean the manoeuvres only, or also passive combat SF and
      Kampfstile — e.g. Golgariten-Stil's +2 on the vorteilhafte Position when a mounted
      Golgarite strikes a Passierschlag at a fighter on foot?
    answer: >
      Manoeuvres only (Basis- and Spezialmanöver). Passive SF and Kampfstile apply.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [PS3]
    notes: >
      Both of the page's examples are Basismanöver, and the Fokusregel "Geschickter
      Passierschlag" entry (Aventurisches Kompendium 2 p. 100ff, the app's CriticalSuccessTable)
      lifts the rule by allowing Basismanöver. No change in the app: the Passierschlag is itself
      one entry of the manoeuvre list, and PassierschlagRoll evaluates every passive catalog line
      for a melee AT, so SA_661's +2 applies (kampfsituationen 17.3).

  - id: passierschlag-zone
    status: decided
    question: >
      With the Trefferzonen Fokusregel on, may a Passierschlag be aimed at a zone (paying the
      full TZ5 penalty, no halving)?
    answer: >
      Yes: aim at the full zone penalty; Gezielter Angriff's halving is not available.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [PS3]
    notes: >
      Aiming is open to every hero (trefferzonen.TZ5); only the halving is the Spezialmanöver
      (SA_160.halving-by-manoeuvre), which PS3 excludes. The app hides the zone picker on a
      Passierschlag (CombatAttackViews: "A Passierschlag takes no manoeuvre, so no zone
      either"); it must show it, without the halving (kampfsituationen 17.4).

  - id: passierschlag-dice
    status: decided
    question: >
      PS4: no Kritische Erfolge or Patzer. Is a rolled 1 still a hit and a 20 still a miss
      regardless of the AT, just without confirmation and table?
    answer: >
      1 always hits, 20 always misses; no confirmation, no table.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [PS4]
    notes: >
      The page takes away the critical results, which is what the confirmation roll decides; the
      automatic success and failure are part of every check. The app compares the roll with the
      AT and nothing else (CombatPassierschlagView.isHit is `roll <= effectiveAT`), so a 20 hits
      at AT 20+ and a 1 misses at AT 0 or below; isHit must special-case 1 and 20. Rare for a
      Passierschlag (−4 before anything else), but a 1 at AT 0 happens: the aimed head shot of
      kampfsituationen 17.4.
