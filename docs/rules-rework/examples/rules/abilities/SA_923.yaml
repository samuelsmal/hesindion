# The wiki also lists Kodex der Helden p. 440 and Kodex des Schwertes p. 331.

clauses:
  - id: VS1
    text: >
      Ein Held mit dieser Sonderfertigkeit erleidet bei mehrfachen Verteidigungen in einer KR
      nicht Erschwernisse von jeweils -3, sondern nur von jeweils -2.
    effects:
      - when: { loadout.weapon.technique: [CT_1, CT_4, CT_16] }   # VS2's list
        change: { line: mehrfache-verteidigung.MV1.step, set: { value: -2 } }
        ruling: kampfstil-techniques
        # FORMAT: replaces another rule's constant. The breakdown shows one line,
        # "Mehrfache Verteidigung −4", marked as changed by Vinsalt-Stil — not two lines.

  - id: VS2
    text: "Kampftechniken: Armbrüste, Fechtwaffen, Zweihänder"
    none: >
      the condition of VS1 (ruling kampfstil-techniques): the style applies only while the hero
      fights with one of these. "Zweihänder" is not a Kampftechnik name — it means CT_16
      Zweihandschwerter; Armbrüste is CT_1, Fechtwaffen CT_4. With an Armbrust in hand the
      style lowers the dodge penalty only, as a crossbow does not parry.
    ruling: kampfstil-techniques

  - id: VS3
    text: >
      Anmerkung: Dieser Stil ist mit den Sonderfertigkeiten Meisterparade und Machtvolle
      Meisterparade kompatibel.
    none: a compatibility note; Meisterparade is not in the app yet

  - id: VS4
    text: "Erweiterte Kampfsonderfertigkeiten: Binden, Hohe Klinge, Machtvoller Kernschuss"
    none: unlocks purchases, not a roll

  - id: VS5
    text: "Voraussetzungen: GE 13"
    none: purchase prerequisite, not a roll

  - id: VS6
    text: "AP-Wert: 20 Abenteuerpunkte"
    none: cost
