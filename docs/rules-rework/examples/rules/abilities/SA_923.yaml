    effects: none
    why: >
      what the list means for VS1 is the shared open ruling kampfstil-techniques. Armbrüste on
      a defensive style reads oddly — a crossbow is not parried with — which is itself a hint
      the list says who can learn the style rather than when it applies.

  - id: VS3
    text: >
      Anmerkung: Dieser Stil ist mit den Sonderfertigkeiten Meisterparade und Machtvolle
      Meisterparade kompatibel.
    effects: none
