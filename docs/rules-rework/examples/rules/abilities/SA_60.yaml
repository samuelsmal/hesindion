# DRAFT FORMAT — see ../../README.md.
# Probe (example 21).
id: SA_60
name: Schnellladen
kind: specialAbility
group: Kampfsonderfertigkeiten
passive: true
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Schnellladen.html
  book: Regelwerk
  page: 249
  checked: 2026-09-24
  hash: null
reviewed: null
# Also Aventurisches Kompendium p. 155 (Schleudern), Aventurische Rüstkammer p. 123 (Blasrohre,
# Diskusse, Schleudern), Kodex des Schwertes p. 303 (Feuerspeien).
#
# Bought once per combat technique: Optolith's select options (rules.db select_options) are
# 1 Armbrüste, 2 Bögen, 3 Wurfwaffen, 4 Schleudern, 5 Blasrohre, 6 Diskusse; a hero holds one
# instance per technique, each with its `sid`. The effect applies to a weapon only when the hero
# holds the instance for its technique.

clauses:
  - id: SL1
    text: >
      Das Nachladen von Bögen und das Bereitmachen von Wurfwaffen verkürzen sich um 1 Aktion.
    effects:
      - when: { weapon.technique: [CT_2, CT_14], hero.has: { SA_60: { option_for: weapon.technique } } }
        add: { to: item.ladezeit, value: -1, floor: 0 }
        # Kurzbogen 1 → 0, which ladezeiten.LZ2 turns into one free action. The instance gate is
        # a variation of DISADV_37's `sid` (which option the hero holds) and of the shared
        # kampfstil-techniques / sf-technique-lists (the technique in hand).

  - id: SL2
    text: Das Nachladen von Armbrüsten dauert nur die Hälfte der angegebenen Aktionen.
    effects:
      - when: { weapon.technique: CT_1, hero.has: { SA_60: { option_for: weapon.technique } } }
        halve: { value: item.ladezeit, round: up }
        ruling: round-up
        # Leichte Armbrust 8 → 4, schwere 15 → 7.5 → 8 (the shared round-up; the page does not
        # round). Halving a *weapon* value, as regeneration.R6 halves a rolled one.

  - id: SL3
    text: >
      Diese Sonderfertigkeit muss für die drei Fernkampftechniken Armbrüste, Bögen und
      Wurfwaffen einzeln erworben werden.
    effects: none
    why: carried by the `option_for` gate on SL1 and SL2

  - id: SL4
    text: "Voraussetzungen: FF 13"
    effects: none
    why: purchase prerequisite

  - id: SL5
    text: "Kampftechniken: Armbrüste, Blasrohre, Bögen, Diskusse, Schleudern oder Wurfwaffen"
    effects: none
    why: >
      the techniques the options may name. The Regel (SL1, SL2) speaks only of Bögen,
      Wurfwaffen and Armbrüste; what it does for Blasrohre, Diskusse and Schleudern is in the
      other books, not read for this probe (shown as text)

  - id: SL6
    text: >
      AP-Wert: Armbrüste: 5 Abenteuerpunkte; Blasrohre: 5 Abenteuerpunkte; Bögen: 20
      Abenteuerpunkte; Diskusse: 5 Abenteuerpunkte; Feuerspeien: 5 Abenteuerpunkte; Schleudern:
      5 Abenteuerpunkte; Wurfwaffen: 10 Abenteuerpunkte
    effects: none
    why: purchase cost

  - id: SL7
    text: >
      Anmerkung: "(...) Ohne passende Scheide kann ein Held in der Regel nicht die
      Sonderfertigkeit Schnellziehen anwenden, ohne Köcher nicht Schnellladen (sofern man die
      Pfeile nicht griffbereit hat). (...)" [Regelwerk, S. 374 "Waffenzubehör"] — Feuerspeien hat
      zwar einen AP-Wert, fehlt aber bei den Kampftechniken
    effects:
      - requires: { any_of: [{ hero.has_item: Köcher }, { fact: pfeileGriffbereit }] }
        when: { weapon.technique: CT_2 }
        # Equipment as a precondition (the Köcher), with a GM fact as the way around it. Shown as
        # a note; the app knows the inventory but not what is worn where.
