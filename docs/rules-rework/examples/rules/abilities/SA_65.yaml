# DRAFT FORMAT — see ../../README.md.
id: SA_65
name: Verteidigungshaltung
kind: specialAbility
group: Kampfsonderfertigkeiten
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Verteidigungshaltung.html
  book: Regelwerk
  page: 250
  checked: 2026-09-23
  hash: null
reviewed: null

clauses:
  - id: VH1
    text: >
      Mit dieser Sonderfertigkeit kann man für die aktuelle Kampfrunde seinen Verteidigungswert
      um +4 erhöhen. Dafür kann man diese Kampfrunde keine Aktionen mehr ausführen.
      Verteidigungshaltung muss am Anfang der Runde angesagt werden.
    effects:
      - offer:
          choice: verteidigungshaltung
          when: { round.phase: start }
          span: round
          # FORMAT: a choice announced once and held for the Kampfrunde — like the Schip
          # "Verteidigung", but only offered at the start.
      - when: { choice: verteidigungshaltung }
        add: { to: [pa, aw], value: 4 }
        ruling: [vh-scope, vh-stacking]
        # Every defence, against melee and ranged attacks alike; a line of its own beside the
        # Schip "Verteidigung" +4, which it stacks with.
      - when: { choice: verteidigungshaltung }
        forbid: { action: aktion }
        ruling: vh-free-actions
        # Aktionen only (attack, spell, Fernkampf); freie Aktionen and defences stay.

  - id: VH2
    text: >
      Kampftechniken: Dolche, Fächer, Fechtwaffen, Hiebwaffen, Raufen, Schilde, Schwerter,
      Stangenwaffen, Zweihandhiebwaffen, Zweihandschwerter
    effects: none
    why: >
      no ranged techniques. Whether the +4 needs one of these in hand is the shared
      sf-technique-lists ruling.

  - id: VH3
    text: >
      Meistermaske: Wenn sich ein Kämpfer in die Verteidigungshaltung begibt, ist dies für
      andere Kampfteilnehmer ersichtlich.
    effects: none
    why: a note for the GM about opponents' knowledge

rulings:
  - id: vh-scope
    status: decided
    question: >
      "Seinen Verteidigungswert um +4" — both defence values (PA and AW), or one? And only the
      Nahkampf defences, or also Ausweichen against a ranged attack?
    answer: >
      +4 on every defence — PA and AW, whatever the attack.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [VH1]
    notes: >
      Verteidigung is the umbrella term for PA and AW throughout the combat chapter. The app does
      not implement the SF (catalog: todo).

  - id: vh-free-actions
    status: decided
    question: >
      "Keine Aktionen mehr" — are free actions (e.g. a word, dropping an item, changing gait on
      a mount) still allowed in that Kampfrunde?
    answer: >
      Free actions and defences stay; only Aktionen are gone.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [VH1]
    notes: attack, spell and Fernkampf are disabled for the round; free actions are untouched.

  - id: vh-stacking
    status: decided
    question: >
      Does Verteidigungshaltung's +4 stack with the Schicksalspunkt "Verteidigung" +4 in the
      same round?
    answer: "They stack: +8."
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [VH1, schicksalspunkte.SP-verteidigung]
    notes: >
      Two lines, +4 each. Together they push MV3's "value reaches 0" further out, allowing more
      defences in the round.
