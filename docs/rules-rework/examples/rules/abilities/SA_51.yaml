# DRAFT FORMAT — see ../../README.md.
id: SA_51
name: Kampfreflexe
kind: specialAbility
group: Kampfsonderfertigkeiten
tiers: 3
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Kampfreflexe.html
  book: Regelwerk
  page: 248
  checked: 2026-09-23
  hash: null
reviewed: null

clauses:
  - id: KR1
    text: Der INI-Basiswert steigt um 1 pro Stufe der Sonderfertigkeit.
    effects:
      - add: { to: ini.base, value: 1, per: tier, after: reiterkampf.RK1 }
        ruling: kampfreflexe-mounted
        # FORMAT: modifies a *derived value* (the INI Basiswert on the hero sheet), not a check.
        # It belongs in the value's own breakdown — "INI 12 = (MU+GE)/2 12 + Kampfreflexe II 2"
        # — the way Eisern belongs in the Wundschwelle's (ADR-0006), and so reaches every INI roll.
        # FORMAT: `after:` — mounted, RK1 swaps the base for the mount's and the SF still adds to
        # it (ruling kampfreflexe-mounted), so the swap must come first. A modifier that survives a
        # source swap needs an order between the two effects.

  - id: KR2
    text: "Voraussetzungen: Stufe I: IN 13; Stufe II: IN 15, Kampfreflexe I; Stufe III: IN 17, Kampfreflexe II"
    effects: none
    why: purchase prerequisites, not a roll

rulings:
  - id: kampfreflexe-mounted
    status: decided
    question: >
      Mounted, the rider rolls initiative from the mount's INI base (reiterkampf.RK1). Does
      Kampfreflexe add to that base?
    answer: >
      Yes: the SF raises whatever base the hero rolls from.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [KR1, reiterkampf.RK1]
    notes: >
      Mounted INI = the mount's base + Stufe (kampfreflexe 12.5). Answered against the
      recommendation, which had asked for reiterkampf.rider-ini (does the rider's Belastung still
      reach the mount's base) to be answered the same way; that ruling is still open, and its
      context now says so. The app ignores Kampfreflexe everywhere today.
