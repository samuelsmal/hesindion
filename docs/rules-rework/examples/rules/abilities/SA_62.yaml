# DRAFT FORMAT — see ../../README.md.
# Not the mounted "Sturmangriff zu Pferd", which is reiterkampf.RK14 (ruling two-sturmangriffe).
id: SA_62
name: Sturmangriff
kind: specialAbility
group: Kampfsonderfertigkeiten
manoeuvre: { kind: spezialmanoever, mountedCombat: false }   # so reiterkampf.RK3 forbids it mounted
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_Sturmangriff.html
  book: Regelwerk
  page: 250
  checked: 2026-09-23
  hash: null
reviewed: null
# Optolith says page 249 and lacks the cap clauses. The page wins.

clauses:
  - id: ST1
    text: >
      Das Manöver Sturmangriff kann nur durchgeführt werden, wenn der Angreifer eine
      Anlaufstrecke von mindestens 4 Schritt hat und über eine GS von mindestens 4 verfügt. Die
      Bewegung ist Teil der Aktion, mit der man angreift.
    effects:
      - offer:
          manoeuvre: sturmangriff
          requires: { runUp: { min: 4 }, hero.gs: { min: 4 } }
          ruling: [sturmangriff-gs, sf-technique-lists]
          # runUp is asked (a toggle, "4 Schritt Anlauf?"); GS is the hero's current GS.

  - id: ST2
    text: >
      Ist der Sturmangriff erfolgreich, steigen die TP um +2 und die halbe GS des Angreifers,
      maximal jedoch insgesamt um +10 TP. […] Maximal kann ein TP-Bonus in Höhe der natürlichen
      GS entstehen.
    effects:
      - when: { manoeuvre: sturmangriff, attack: hit }
        add: { to: tp, value: "min(2 + hero.gs / 2, 10, hero.gs.natural)" }
        ruling: [round-up, sturmangriff-gs, sturmangriff-cap-scope]
        # FORMAT: a formula with two caps, and a ruling on which value it reads. The caps only
        # bind above the unhindered range: for current GS 4–16, 2 + ⌈GS/2⌉ ≤ 10, and it exceeds
        # the natural GS only when the current GS is raised above it (a spell, an elixir).

  - id: ST3
    text: >
      Dieser Angriff kann regulär abgewehrt werden. Sollte der Sturmangriff misslingen, erhält
      der Verteidiger die Gelegenheit für einen Passierschlag.
    effects:
      - when: { manoeuvre: sturmangriff, attack: miss }
        tell: { opponent: passierschlag }
        # Opponent side, display only (ADR-0005).

  - id: ST4
    text: >
      Dieses Spezialmanöver kann nicht mit dem Basismanöver Finte kombiniert werden.
      Erschwernis: -2
    effects:
      - when: { manoeuvre: sturmangriff }
        add: { to: at, value: -2 }
      - excludes: { manoeuvre: finte }
        ruling: manoeuvre-combination
        # One Basismanöver and one Spezialmanöver combine (kampfsonderfertigkeiten.KS5); this is
        # the named exception, and the UI says so when Finte is picked.

  - id: ST5
    text: >
      Kampftechniken: Hiebwaffen, Raufen, Schwerter, Stangenwaffen, Zweihandhiebwaffen,
      Zweihandschwerter
    effects:
      - requires: { loadout.weapon.technique: [CT_5, CT_9, CT_12, CT_13, CT_15, CT_16] }
        ruling: sf-technique-lists

  - id: ST6
    text: "Voraussetzungen: MU 13, Vorstoß, Wuchtschlag I"
    effects: none
    why: purchase prerequisites, not a roll

rulings:
  - id: sturmangriff-gs
    status: decided
    question: >
      "Die halbe GS des Angreifers" — the hero's current GS (after Belastung and armour) or the
      natural GS?
    answer: The current GS.
    decided: { by: "@samuelsmal", date: 2026-09-23 }
    applies_to: [ST2]
    notes: >
      A hero with GS 8 in plate (current GS 5) gets +2 + ⌈5/2⌉ = +5; the cap stays the natural
      GS, as the page says. Assumed to hold for ST1's "GS von mindestens 4" too — the same
      words; a hero at current GS 3 cannot charge.

  - id: sturmangriff-cap-scope
    status: decided
    question: >
      "Maximal jedoch insgesamt um +10 TP" — does the +10 cap Sturmangriff's own bonus only, or
      every TP bonus on that attack (Wuchtschlag's, a weapon's, a Kampfstil's) together?
    answer: >
      Sturmangriff's own bonus only; other TP bonuses are added on top.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [ST2]
    notes: >
      The natural-GS cap in the same clause is read the same way: both caps bind ST2's one line.
      At GS 16 Sturmangriff alone is +10, and Wuchtschlag III's +6 adds to it (+16) — they combine
      (manoeuvre-combination, sturmangriff 10.7).
