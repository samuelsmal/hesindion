id: SA_160
name: Gezielter Angriff
kind: specialAbility
group: Kampfsonderfertigkeiten
manoeuvre: { kind: spezialmanoever, mountedCombat: false }
techniques: [alle Nahkampftechniken]
# FORMAT: an SF that only exists inside an optional rule set. Without the Fokusregel the SF
# can still be bought (Optolith lists it) but does nothing; the breakdown says why.
ruleset: fokus.trefferzonen
source:
  url: https://dsa.ulisses-regelwiki.de/KSF_GezielterAngriff.html
  book: Aventurisches Kompendium
  page: 152
  checked: 2026-09-23
  hash: null
reviewed: null
clauses:
  - id: GA1
    text: >
      (Spezialmanöver) (Fokusregel Stufe I - Trefferzonen-Regel) Mit diesem Manöver kann man
      gezielt eine Trefferzone angreifen. Dazu ist eine Attacke nötig, die entsprechend dem
      Zonenaufschlag erschwert ist. Erschwernis: je nach Zone
    effects:
      - offer:
          manoeuvre: gezielterAngriff
          on: at
          requires: { choice: targetZone }
          ruling: halving-by-manoeuvre
          # Aiming itself is trefferzonen.TZ5's and open to every hero; this is the Spezialmanöver
          # announced on top of it. As a Spezialmanöver (the `manoeuvre:` field) it falls under
          # reiterkampf.RK3, SA_172.U3 and the manoeuvre-combination ruling.
      - when: { manoeuvre: gezielterAngriff }
        multiply: { line: trefferzonen.TZ5.aim, by: 0.5 }
        ruling: [halving-by-manoeuvre, trefferzonen.surprised-then-halved]
        # The halving is stated on the Fokusregel page (trefferzonen.TZ5), not here; this page
        # says only that the attack carries the zone penalty.

rulings:
  - id: halving-by-manoeuvre
    status: decided
    question: >
      Does the halving of the aiming penalty come with announcing Gezielter Angriff (melee) /
      Gezielter Schuss (ranged) as the attack's Spezialmanöver, or with merely having the SF?
    answer: >
      The halving is the Spezialmanöver: announced for one attack, with every Spezialmanöver
      restriction. Without it the hero aims at the full penalty.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [GA1, SA_161.GS1, trefferzonen.TZ5]
    notes: >
      Any hero may aim while the Fokusregel is on (trefferzonen.TZ5); only the halving is the
      manoeuvre. So it is unavailable, and the hero aims at the full penalty, (1) on horseback
      (reiterkampf.RK3, ruling reiterkampf.mounted-manoeuvres), (2) with Unterlaufen unless the
      hero has Verbessertes Unterlaufen (SA_172.U3), and (3) next to another Spezialmanöver such as
      Sturmangriff, as far as the open ruling manoeuvre-combination limits them (its option c,
      any number of manoeuvres, would lift this). A hero with the SF may also aim without
      announcing it, to keep the slot free (trefferzonen TZ.27). The app today halves every aimed
      attack of a hero with the SF (CombatZonePicker, HitZoneModifiers.penalty).
