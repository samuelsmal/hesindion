# DRAFT FORMAT — see ../../README.md.
id: ADV_75
name: Schnell wieder auf den Beinen
kind: advantage
source:
  url: https://dsa.ulisses-regelwiki.de/vorteil.html?vorteil=Schnell%20wieder%20auf%20den%20Beinen
  book: Kneipen & Tavernen (Meisterschirmbegleitheft)
  page: 13
  checked: 2026-09-24
  hash: null
reviewed: null

# Despite the name, this advantage has nothing to do with standing up from Liegend (STATE_10.L4):
# it halves the time Betäubung and Berauscht take to wear off. Standing up costs 1 action and
# risks a Passierschlag exactly as for anyone (situation 15.16). Boronmir dropped this advantage
# on 2026-09-24; the example-15 situations about it give it to him.

clauses:
  - id: SW1
    text: >
      Mit diesem Vorteil benötigt man nur noch die Hälfte der Zeit, bis eine Stufe des Zustands
      Betäubung oder Berauscht, der durch Alkohol verursacht wurde, abgebaut ist.
    effects:
      - when: { hero.has: COND_2, gmFact.cause: alcohol }
        tell: { to: player, text: "Jede Stufe Betäubung baut sich nach 1½ Stunden Ruhe ab (statt 3)." }
        ruling: alcohol-scope
        # 3 h Ruhephase (COND_2.BT2) → 1½ h per Stufe.
      - when: { hero.has: COND_2, gmFact.cause: alcohol }
        suppress: { line: { line: COND_2.BT2 } }
        because: halbe Zeit durch Alkohol (Schnell wieder auf den Beinen)
        ruling: alcohol-scope
      - when: { hero.has: COND_9, gmFact.cause: alcohol }
        tell: { to: player, text: "Berauscht baut sich jede Stunde um 1 Stufe ab (statt alle 2), wenn er nichts mehr trinkt." }
        ruling: alcohol-scope
        # 2 h (COND_9.BR4) → 1 h per Stufe.
      - when: { hero.has: COND_9, gmFact.cause: alcohol }
        suppress: { line: { line: COND_9.BR4 } }
        because: halbe Zeit durch Alkohol (Schnell wieder auf den Beinen)
        ruling: alcohol-scope
        # Both Zustände only from alcohol (ruling alcohol-scope); the GM states the cause
        # (`gmFact.cause`). The old `scale: { duration: COND_2.decay | COND_9.decay, by: 0.5 }`:
        # the app keeps no time outside combat rounds and no cause for a Zustand, so a Zustand's
        # decay is a text (COND_2.BT2, COND_9.BR4), and this advantage replaces that text with
        # the halved one (situations lebensenergie 15.17–15.19).

  - id: SW2
    text: "Voraussetzung: Keine"
    none: no prerequisite

  - id: SW3
    text: "AP-Wert: 2 Abenteuerpunkte"
    none: cost, not a rule at the table (the ruling alcohol-scope leans on it)

rulings:
  - id: alcohol-scope
    status: decided
    question: >
      "Betäubung oder Berauscht, der durch Alkohol verursacht wurde" — does "durch Alkohol" limit
      both Zustände, or only Berauscht? Does Betäubung from a blow or from exhaustion also wear off
      in half the time?
    answer: >
      Both only when caused by alcohol; Betäubung from a blow wears off as usual.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    appliesTo: [SW1]
    notes: >
      The book (Kneipen & Tavernen), the name and the 2 AP price all point at the morning after;
      halving every Betäubung, a combat Zustand, would be worth far more. Until the app keeps a
      Zustand's cause, the Betäubung and Berauscht chips state the condition ("durch Alkohol: baut
      sich in der halben Zeit ab — Schnell wieder auf den Beinen"). The app ignores the advantage
      today (catalog ADV_75 todo).
