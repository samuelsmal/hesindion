# DRAFT FORMAT — see ../../README.md.
id: COND_6
name: Schmerz
kind: condition
levels: 4
source:
  url: https://dsa.ulisses-regelwiki.de/Sta_Schmerz.html
  book: Regelwerk
  page: 34
  checked: 2026-09-23
  hash: null
reviewed: null

# Where a Stufe comes from: the LP thresholds (SZ3) plus whatever sets Schmerz directly
# (a Patzer, a wound effect, a spell). Zäher Hund (ADV_49) lowers it (ADV_49.yaml).
level:
  from:
    - clause: SZ3
    - set_by: [event, gm]
  effects_lowered_by: [ADV_49]   # the Stufe stays; ADV_49 lowers the Stufe whose *effects* apply
                                 # (ruling ADV_49.zaeher-hund-counts)

clauses:
  - id: SZ1
    text: >
      Durch Verletzungen, Gifte, Zauber und andere Unannehmlichkeiten kann ein Held Schmerzen
      erleiden, die ihn im schlimmsten Falle handlungsunfähig machen.
    effects: none
    why: introduction

  - id: SZ2
    text: >
      Um trotz immenser Schmerzen (Stufe IV) handlungsfähig zu bleiben, ist eine Probe auf
      Selbstbeherrschung (Handlungsfähigkeit bewahren) nötig.
    effects:
      - when: { level: 4, before: action }
        requires_check: { talent: Selbstbeherrschung, application: Handlungsfähigkeit bewahren }
        on_failure: { gain: { state: handlungsunfaehig } }
        on_success: { see: SZ5 }
        ruling: schmerz-iv-check
        # Rolled before each action the hero wants to take; a success lets that one action
        # through at −4 (SZ5), a failure leaves the hero Handlungsunfähig for it.
        # FORMAT: a check that decides whether a state applies, repeated per action.

  - id: SZ3
    text: >
      Durch den Verlust von Lebenspunkten kommt es öfters vor, dass ein Held Stufen dieses
      Zustands erhält. Sind die Lebenspunkte auf Dreiviertel, die Hälfte oder ein Viertel der
      Gesamt-Lebensenergie gesunken, erhält der Held jeweils eine Stufe Schmerz. Steigen die
      Lebenspunkte wieder über diese Begrenzungen, verschwindet damit auch die entsprechende
      Stufe Schmerz. Sinkt sie auf 5 oder weniger, erhält er eine weitere Stufe Schmerz.
    effects:
      - sets: { condition: COND_6, level: "count(lp <= le*3/4, lp <= le/2, lp <= le/4, lp <= 5)" }
        ruling: schmerz-thresholds
        # FORMAT: a level derived from a formula over the hero's current values, recomputed
        # whenever LP change.

  - id: SZ4
    text: Ist nichts anderes genannt, verliert der Held nach jeweils 4 Stunden eine Stufe des Zustands.
    # Would encode as: lower: { condition: COND_6, by: 1, every: 4h, not_for: SZ3 } — the LP
    # part (SZ3) goes with healing, not with time. Out-of-combat time is not tracked; the app
    # shows this as text on the Schmerz chip.
    status: unencoded
    why: the app does not keep time outside combat rounds

  - id: SZ5
    text: |
      Stufe I: leichte Schmerzen, alle Proben –1, GS –1
      Stufe II: ablenkende Schmerzen, alle Proben –2, GS –2
      Stufe III: starke Schmerzen, alle Proben –3, GS –3
      Stufe IV: Handlungsunfähig, ansonsten alle Proben –4
    effects:
      - when: { level: [1, 3] }
        add: { to: [check, gs], value: -1, per: level }
        # "alle Proben": AT, PA, AW, FK, talents, spells, liturgies. Not INI — an INI roll is
        # not a Probe, and unlike Belastung the page does not list INI.
      - when: { level: 4 }
        gain: { state: handlungsunfaehig }
        unless: { check_passed: SZ2 }
      - when: { level: 4, check_passed: SZ2 }
        add: { to: check, value: -4 }
      - when: { level: 4 }
        set: { value: gs, to: 0 }
        ruling: schmerz-iv-gs
        # Passed check or not, the hero cannot move at Stufe IV; speaking stays possible.
        # FORMAT: a value set, not a modifier (like STATE_10's GS 1).

rulings:
  - id: schmerz-thresholds
    status: decided
    question: >
      "Auf Dreiviertel, die Hälfte oder ein Viertel der Gesamt-Lebensenergie gesunken" — is the
      hero's LP compared with the exact fraction, or is the fraction rounded first (ADR-0006
      rounds up)?
    answer: >
      Exact: Schmerz when LP is at or below the fraction itself.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [SZ3]
    notes: >
      LE 30: Schmerz I starts at 22 LP (22.5), not 23. Nothing is computed that needs rounding,
      so ADR-0006 does not reach it. The app already compares this way
      (Hero.lebenspunkteSchmerzLevel, `current <= maxLP * 3 / 4`, equal to the exact comparison
      for whole LP).

  - id: schmerz-iv-check
    status: decided
    question: >
      Stufe IV needs a Selbstbeherrschung (Handlungsfähigkeit bewahren) check to stay able to
      act. When is it rolled, and how long does a success hold?
    answer: >
      Before each action the hero wants to take.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [SZ2, SZ5]
    notes: >
      Answered against the recommendation (once, when Stufe IV is reached). A success holds for
      that one action, taken at −4; a failure means the hero cannot take it (Handlungsunfähig).
      The app needs a check prompt before each action of a hero at Schmerz IV. Today it has no
      such check: the hero is Handlungsunfähig outright (StateCatalog schmerz,
      handlungsunfaehigAtLevel: 4), and only the Schip "Zustand ignorieren" gives a round back.
      Moving is not an action this check can buy (ruling schmerz-iv-gs).

  - id: schmerz-iv-gs
    status: decided
    question: >
      A hero who passes the Stufe IV check has "alle Proben –4". The page gives GS −1/−2/−3 for
      Stufen I–III and no GS for Stufe IV. What is their GS penalty?
    answer: >
      The hero cannot move (GS 0), but can still speak.
    decided: { by: "@samuelsmal", date: 2026-09-24 }
    applies_to: [SZ5]
    notes: >
      The owner's own answer, none of the offered options (GS −4, none, GS −3). At Stufe IV the
      hero's GS is 0 whether or not the Selbstbeherrschung check passed; a passed check buys an
      action at −4 (schmerz-iv-check), never movement. Speaking is always possible. GS 0 is a
      value set, not a line to cap, so the Zustand cap (zustaende.cap-scope) does not change it.
      With Zäher Hund, a passed check makes the hero act as Stufe III, GS 0 included: GS −3
      (ADV_49.zaeher-hund-iv).
      The app applies no Schmerz to GS at any Stufe (Hero.effectiveGeschwindigkeit,
      Hero.totalGsPenalty).
