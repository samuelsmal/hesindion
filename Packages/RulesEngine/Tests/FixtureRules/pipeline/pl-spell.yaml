name: Modifikationen
kind: specialAbility
source: { url: https://example.invalid/pl, book: Regelwerk, page: 1, checked: 2026-09-25, hash: null }
reviewed: null
clauses:
  - id: S1
    text: Modifikationen, höchstens FW/4.
    effects:
      - offer: { choice: mod, options: [a, b, c] }
      - limit: { what: { choice: [mod.a, mod.b, mod.c] }, max: { of: fw.current, per: 4, round: down }, per: action }
